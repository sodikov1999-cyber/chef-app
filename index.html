<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ШефБук</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0F0D0B;--card:#1B1613;--text:#F5ECE2;--muted:#9C8D7E;--accent:#FF8A3D;--accent-soft:rgba(255,138,61,.14);--green:#5FD38A;--blue:#6FA8FF;--red:#FF6B5E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;padding-bottom:40px}
h1{font-weight:800;font-size:26px;margin-bottom:16px}
h2{font-weight:700;font-size:18px;margin:22px 0 12px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.tile{padding:18px 14px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.06);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.tile:active{transform:scale(.97)}
.tile-emoji{font-size:28px;margin-bottom:8px}
.tile-title{font-weight:700;font-size:15px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:3px}
.pulse{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn{display:block;width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:center}
.btn:active{transform:scale(.98)}
.btn-sec{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-flex;align-items:center;gap:6px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,.06);border-radius:10px;color:var(--text);margin-bottom:16px;cursor:pointer;border:none;font-size:14px;font-weight:600}
.recipe{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;cursor:pointer;border:none;width:100%;text-align:left;color:inherit;font:inherit}
.recipe:active{background:rgba(255,255,255,.07)}
.recipe-name{font-weight:700;font-size:15px;margin-bottom:3px}
.recipe-meta{font-size:12px;color:var(--muted)}
.ingredient{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;font-size:14px}
.ingredient:last-child{border:none}
.ingredient b{color:var(--accent)}
.step{padding:12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent);font-size:14px;line-height:1.5}
.step-num{display:inline-block;width:20px;height:20px;background:var(--accent-soft);color:var(--accent);border-radius:6px;text-align:center;line-height:20px;font-weight:700;font-size:11px;margin-right:8px}
.news{padding:14px;background:rgba(255,138,61,.08);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--accent)}
.news-title{font-weight:700;font-size:14px;margin-bottom:3px}
.news-text{font-size:13px;color:var(--muted);line-height:1.4}
.news-date{font-size:11px;color:var(--muted);margin-top:5px}
.check-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.check-item:last-child{border:none}
.check-box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold;color:transparent;font-size:13px;transition:all .2s}
.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-item.done span{text-decoration:line-through;color:var(--muted)}
.kpi{display:flex;gap:8px;margin-bottom:14px}
.kpi-box{flex:1;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;text-align:center}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.kpi-value{font-weight:700;font-size:14px}
.mults{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mult{padding:7px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.mult.on{background:var(--accent);color:#000;border-color:var(--accent)}
.user{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FFB067,var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;flex-shrink:0}
.user-info b{display:block;font-size:15px}
.user-info span{font-size:12px;color:var(--muted)}
.note{padding:14px;background:rgba(95,211,138,.1);border-left:3px solid var(--green);border-radius:10px;margin-top:14px;font-size:13px;line-height:1.5}
.admin-btn{position:fixed;bottom:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(255,138,61,.4);font-size:20px;z-index:100}
.admin-btn:active{transform:scale(.9)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:40px;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-weight:800;font-size:18px}
.modal-close{background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px}
.form-field{margin-bottom:14px}
.form-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-textarea,.form-select{width:100%;padding:12px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{min-height:80px;resize:vertical}
.item-card{padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06)}
.item-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-card-title{font-weight:700;font-size:15px}
.icon-btn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:none;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.1)}
.icon-btn.danger{background:rgba(255,107,94,.15);color:var(--red)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;z-index:300;max-width:85vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:2px}
.tab-btn{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;padding:8px 12px;cursor:pointer}
.tab-btn.on{color:var(--accent);border-bottom:2px solid var(--accent)}
</style>
</head>
<body>

<div id="app"></div>
<button id="admin-btn" class="admin-btn" onclick="haptic('hard');openAdmin()">✏️</button>

<script>
/* ============================================================
   🔗 НАСТРОЙКИ ТАБЛИЦЫ
   ============================================================ */
const SHEET_ID = '1qwcKV8_0bmbj1OSLPPMmTHke6t2U8fFz94xHE6iriIk';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

/* ============================================================
   📦 ДАННЫЕ (Загружаются из LocalStorage или дефолтные)
   ============================================================ */
const DEFAULT_DATA = {
  month: 'Август 2026',
  locations: [
    {name:'Галактика', staff:[{name:'Бочаров Вадим', role:'Су-шеф', shifts:Array(31).fill(0), total:0}]}, // Заглушка
  ],
  recipes: [
    {id:1, name:'Борщ с говядиной', cat:'Горячее', time:'45 мин', yield:'350 г', kcal:96, note:'', ingr:[['Говядина',100,80]], steps:['Сварить бульон.']},
  ],
  news: [{tag:'Инфо', title:'Добро пожаловать', text:'Приложение готово к работе.', date:'Сегодня'}],
  team: [{name:'Администратор', role:'Управление', init:'АД'}]
};

// Глобальное состояние
let AppState = {
  recipes: [],
  news: [],
  team: [],
  scheduleData: null, // Данные графика (из сети или локальные)
  useLocalSchedule: false
};

// Инициализация данных
function initData() {
  const savedRecipes = localStorage.getItem('sb_recipes');
  const savedNews = localStorage.getItem('sb_news');
  const savedTeam = localStorage.getItem('sb_team');

  AppState.recipes = savedRecipes ? JSON.parse(savedRecipes) : DEFAULT_DATA.recipes;
  AppState.news = savedNews ? JSON.parse(savedNews) : DEFAULT_DATA.news;
  AppState.team = savedTeam ? JSON.parse(savedTeam) : DEFAULT_DATA.team;
  
  // Для графика пока используем заглушку, реальная загрузка асинхронна
  AppState.scheduleData = DEFAULT_DATA.locations; 
}

/* ============================================================
   ⚙️ СИСТЕМНЫЕ ФУНКЦИИ
   ============================================================ */
const tg = window.Telegram?.WebApp;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

const $ = s => document.querySelector(s);
const app = $('#app');
let currentView = 'home';
let currentRecipeId = null;
let currentMult = 1;
let expandedLocations = new Set();

function haptic(kind){ try{ if(tg?.HapticFeedback){ tg.HapticFeedback.impactOccurred(kind==='hard'?'medium':'light'); } }catch(e){} }

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if(type === 'error') t.style.background = 'var(--red)', t.style.color = '#fff';
  if(type === 'success') t.style.background = 'var(--green)', t.style.color = '#000';
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'), 10);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2500);
}

function saveData(key) {
  if(key === 'recipes') localStorage.setItem('sb_recipes', JSON.stringify(AppState.recipes));
  if(key === 'news') localStorage.setItem('sb_news', JSON.stringify(AppState.news));
  if(key === 'team') localStorage.setItem('sb_team', JSON.stringify(AppState.team));
}

function navigate(view, data){
  currentView = view;
  if(data !== undefined) currentRecipeId = data;
  render();
  window.scrollTo(0,0);
}

/* ============================================================
   📡 ЗАГРУЗКА ГРАФИКА (CSV)
   ============================================================ */
async function loadScheduleData(force = false) {
  if (!force && AppState.scheduleData && !AppState.useLocalSchedule) return;

  try {
    const res = await fetch(SHEET_URL + '&t=' + Date.now());
    if(!res.ok) throw new Error('Network error');
    const text = await res.text();
    parseScheduleCSV(text);
    AppState.useLocalSchedule = false;
  } catch (e) {
    console.warn('Schedule load failed, using local/default', e);
    AppState.scheduleData = DEFAULT_DATA.locations;
    AppState.useLocalSchedule = true;
  }
}

function parseScheduleCSV(text) {
  // Простой парсер для структуры: Локация, Должность, Дата...
  const rows = text.split('\n').map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
  const newLocations = [];
  let currentLoc = null;

  rows.forEach(row => {
    if(row.length < 3) return;
    // Пропускаем заголовки и итоги
    if(row[0].includes('Дата') || row[0].includes('итого') || row[0] === '') return;
    
    // Проверка: если во второй колонке есть слово "Должность", значит это заголовок локации
    if(row[1] && row[1].includes('Должность')) {
      // Новая локация началась в предыдущей строке или это заголовок
      // В данном CSV структура: Название локации в первой ячейке перед строкой заголовков? 
      // Судя по вашему CSV: Строка "Галактика,,сб,вск..." идет ПЕРЕД заголовком "Локация,Должность..."
      // Но в вашем примере "Галактика" стоит в отдельной строке перед заголовками столбцов дней?
      // Давайте искать строку, где есть имя сотрудника.
      return; 
    }

    // Если первая ячейка не пуста и не число, и вторая ячейка содержит роль (Су-шеф, Повар...)
    // Это сотрудник
    if(row[0] && !row[0].includes('итого') && (row[1].includes('шеф') || row[1].includes('Повар') || row[1].includes('Универсал') || row[1].includes('ИО') || row[1].includes('цех') || row[1].includes('Мангал') || row[1].includes('Италия') || row[1].includes('раб'))) {
       if(!currentLoc) return; // Ошибка структуры
       
       const name = row[0];
       const role = row[1];
       // Дни начинаются с 3-й колонки (индекс 2), но в вашем CSV там могут быть дни недели "сб, вск..."
       // Реальные данные (1/0) идут после строки с днями недели.
       // Упрощение: берем все ячейки с 2 по 32, пытаемся превратить в число.
       const shifts = [];
       for(let i=2; i<33; i++) {
         let val = row[i];
         // Обработка "0,5"
         if(val && val.includes(',')) val = val.replace(',', '.');
         shifts.push(parseFloat(val) || 0);
       }
       
       currentLoc.staff.push({name, role, shifts, total: shifts.reduce((a,b)=>a+b, 0)});
    }
    
    // Определение локации: строка, где первая ячейка - название, а вторая пустая или "Должность"
    if(row[1] === '' || row[1] === 'Должность') {
       // Проверяем, не является ли это строкой итогов
       if(!row[0].includes('итого')) {
         currentLoc = { name: row[0], staff: [] };
         newLocations.push(currentLoc);
       }
    }
  });

  if(newLocations.length > 0) AppState.scheduleData = newLocations;
}

/* ============================================================
   🎨 ОТРИСОВКА (RENDER)
   ============================================================ */
function render(){
  if(currentView === 'home') renderHome();
  else if(currentView === 'ttk') renderTTK();
  else if(currentView === 'recipe') renderRecipe();
  else if(currentView === 'schedule') renderSchedule();
  else if(currentView === 'checklist') renderChecklist();
  else if(currentView === 'team') renderTeam();
  app.classList.add('fade');
  setTimeout(()=>app.classList.remove('fade'), 300);
}

function renderHome(){
  const user = tg?.initDataUnsafe?.user;
  const greet = user ? 'Привет, ' + user.first_name + '!' : 'ШефБук 👨‍';
  const today = new Date();
  const currentDay = today.getDate();
  const dayIndex = currentDay - 1;
  
  let todayShifts = 0;
  if(AppState.scheduleData) {
    AppState.scheduleData.forEach(loc => {
      loc.staff.forEach(p => {
        if(p.shifts[dayIndex] && p.shifts[dayIndex] > 0) todayShifts++;
      });
    });
  }

  app.innerHTML = `
    <h1>${greet}</h1>
    <div class="card">
      <span class="pulse"></span>Сегодня ${currentDay} августа
      <div style="margin-top:10px;font-size:13px;color:var(--muted)">
         На смене: <span style="color:var(--accent);font-weight:700">${todayShifts}</span> человек
      </div>
    </div>
    <div class="grid">
      <button class="tile" onclick="navigate('ttk');haptic()">
        <div class="tile-emoji">📖</div>
        <div class="tile-title">ТТК</div>
        <div class="tile-desc">${AppState.recipes.length} техкарт</div>
      </button>
      <button class="tile" onclick="navigate('schedule');haptic()">
        <div class="tile-emoji">🗓</div>
        <div class="tile-title">График</div>
        <div class="tile-desc">Смены</div>
      </button>
      <button class="tile" onclick="navigate('checklist');haptic()">
        <div class="tile-emoji">✅</div>
        <div class="tile-title">Чек-лист</div>
        <div class="tile-desc">Открытие/закрытие</div>
      </button>
      <button class="tile" onclick="navigate('team');haptic()">
        <div class="tile-emoji">👥</div>
        <div class="tile-title">Команда</div>
        <div class="tile-desc">${AppState.team.length} чел</div>
      </button>
    </div>
    <h2>Объявления</h2>
    ${AppState.news.map(n => `
      <div class="news">
        <div class="news-title">${n.tag}: ${n.title}</div>
        <div class="news-text">${n.text}</div>
        <div class="news-date">${n.date}</div>
      </div>
    `).join('')}
  `;
}

function renderTTK(){
  const cats = ['Все', ...new Set(AppState.recipes.map(r=>r.cat))];
  window._ttkCat = window._ttkCat || 'Все';
  window._ttkQ = window._ttkQ || '';
  const q = window._ttkQ.toLowerCase();
  const items = AppState.recipes.filter(r => 
    (window._ttkCat === 'Все' || r.cat === window._ttkCat) &&
    (!q || r.name.toLowerCase().includes(q))
  );

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Техкарты</h1>
    <input type="search" placeholder="🔍 Поиск блюда..." 
           value="${window._ttkQ}" 
           oninput="window._ttkQ=this.value;renderTTK()"
           style="width:100%;padding:12px 16px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:var(--text);font-size:15px;margin-bottom:12px;outline:none">
    <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px">
      ${cats.map(c => `<button class="mult ${c===window._ttkCat?'on':''}" onclick="window._ttkCat='${c}';haptic();renderTTK()">${c}</button>`).join('')}
    </div>
    ${items.length ? items.map(r => `
      <button class="recipe" onclick="navigate('recipe',${r.id});haptic()">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">${r.cat} · ${r.time} · ${r.yield}</div>
      </button>
    `).join('') : '<div class="card" style="text-align:center;color:var(--muted)">Ничего не найдено 🔍</div>'}
  `;
}

function renderRecipe(){
  const r = AppState.recipes.find(x => x.id === currentRecipeId);
  if(!r){ navigate('ttk'); return; }

  app.innerHTML = `
    <button class="back" onclick="navigate('ttk');haptic()">← Назад</button>
    <h1>${r.name}</h1>
    <div class="kpi">
      <div class="kpi-box"><div class="kpi-label">Время</div><div class="kpi-value">${r.time}</div></div>
      <div class="kpi-box"><div class="kpi-label">Выход</div><div class="kpi-value">${r.yield}</div></div>
      <div class="kpi-box"><div class="kpi-label">Ккал</div><div class="kpi-value">${r.kcal}</div></div>
    </div>
    <h2>Ингредиенты</h2>
    <div class="mults">
      ${[1,2,5,10].map(m => `<button class="mult ${m===currentMult?'on':''}" onclick="currentMult=${m};haptic();renderRecipe()">×${m}</button>`).join('')}
    </div>
    <div class="card">
      ${r.ingr.map(i => `
        <div class="ingredient">
          <span>${i[0]}</span>
          <b>${Math.round((parseFloat(i[2])||0)*currentMult)} г</b>
        </div>
      `).join('')}
    </div>
    <h2>Приготовление</h2>
    ${r.steps.map((s,i) => `
      <div class="step"><span class="step-num">${i+1}</span>${s}</div>
    `).join('')}
    ${r.note ? `<div class="note">📝 <b>Важно:</b> ${r.note}</div>` : ''}
  `;
}

async function renderSchedule(){
  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1>График</h1>
        <button class="btn btn-sm" onclick="loadScheduleData(true); renderSchedule(); haptic()">↻ Обновить</button>
    </div>
    <div class="card" style="text-align:center;padding:30px">
      <div class="loader-inline" style="width:30px;height:30px;border:3px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite"></div>
      <div style="margin-top:14px;color:var(--muted)">Загрузка...</div>
    </div>
  `;
  
  await loadScheduleData(false);

  const today = new Date();
  const currentDay = today.getDate();
  const dayIndex = currentDay - 1;
  const dowShort = ['вск','пн','вт','ср','чт','пт','сб'];
  const currentDow = dowShort[today.getDay()];

  // Генерация дней недели
  const weekDays = [];
  for(let i=0; i<7; i++){
     // Упрощенно: просто текущая неделя от текущего дня
     // Для точности нужно считать mondayOffset, но для примера оставим просто дни
     let dNum = currentDay - 3 + i; 
     if(dNum < 1) dNum = 1; 
     if(dNum > 31) dNum = 31;
     
     let count = 0;
     if(AppState.scheduleData) {
        AppState.scheduleData.forEach(loc => {
            loc.staff.forEach(p => {
                if(p.shifts[dNum-1] && p.shifts[dNum-1] > 0) count++;
            });
        });
     }
     weekDays.push({dayNum: dNum, isToday: dNum===currentDay, count});
  }

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1>${AppState.useLocalSchedule ? 'График (Локально)' : 'График'}</h1>
        <button class="btn btn-sm" onclick="loadScheduleData(true); renderSchedule(); haptic()">↻ Обновить</button>
    </div>
    
    ${AppState.useLocalSchedule ? `
      <div style="background:rgba(255,138,61,.1);border-left:3px solid var(--accent);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.5">
        ⚠️ <b>Нет связи с сервером</b><br>
        <span style="color:var(--muted)">Показаны локальные данные</span>
      </div>
    ` : `
      <div style="background:rgba(95,211,138,.1);border-left:3px solid var(--green);padding:12px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;line-height:1.5">
         <b>Данные из Google Таблицы</b><br>
        <span style="color:var(--muted)">Сегодня ${currentDay} число · ${currentDow}</span>
      </div>
    `}
    
    <h2>Эта неделя</h2>
    <div style="display:flex;gap:6px;margin-bottom:16px">
      ${weekDays.map(d => `
        <div style="flex:1;text-align:center;padding:8px 4px;background:${d.isToday?'var(--accent)':'var(--card)'};border-radius:10px;color:${d.isToday?'#000':'var(--text)'}">
          <div style="font-size:10px;font-weight:700;color:${d.isToday?'#000':'var(--muted)'};text-transform:uppercase">${dowShort[(today.getDay()+d.dayNum-currentDay+7)%7]}</div>
          <div style="font-weight:800;font-size:17px;margin:3px 0">${d.dayNum}</div>
          <div style="font-size:11px;color:${d.isToday?'#000':'var(--muted)'}">${d.count} чел</div>
        </div>
      `).join('')}
    </div>
    
    ${AppState.scheduleData ? AppState.scheduleData.map(loc => {
      const isOpen = expandedLocations.has(loc.name);
      const workingToday = loc.staff.filter(p => p.shifts[dayIndex] && p.shifts[dayIndex] > 0);
      const staffStats = [...loc.staff].sort((a,b) => b.total - a.total);
      
      return `
        <div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">
          <button onclick="toggleLoc('${loc.name}');haptic()" style="width:100%;padding:16px;background:transparent;border:none;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px">
            <div style="flex:1;min-width:0">
              <div style="font-weight:700;font-size:16px;margin-bottom:4px">${loc.name}</div>
              <div style="font-size:12px;color:var(--muted)">
                👥 Сегодня: <span style="color:var(--accent);font-weight:700">${workingToday.length}</span> из ${loc.staff.length}
              </div>
            </div>
            <div style="width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;transition:transform .3s;transform:rotate(${isOpen?180:0}deg);flex-shrink:0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </button>
          
          <div style="max-height:${isOpen?'5000px':'0'};overflow:hidden;transition:max-height .4s ease-out">
            <div style="padding:0 16px 16px;border-top:1px solid rgba(255,255,255,.06)">
              <div style="margin-top:14px;margin-bottom:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Сегодня на смене (${workingToday.length})</div>
              ${workingToday.length > 0 ? workingToday.map(p => `
                <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)">
                  <div class="avatar" style="width:36px;height:36px;font-size:12px">${p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()}</div>
                  <div style="flex:1;min-width:0">
                    <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</div>
                    <div style="font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.role}</div>
                  </div>
                </div>
              `).join('') : '<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px">🎉 Все отдыхают</div>'}
              
              <div style="margin-top:16px;margin-bottom:10px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700">Команда за месяц</div>
              ${staffStats.map(s => `
                  <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">
                    <div style="flex:1;min-width:0">
                      <div style="font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>
                      <div style="font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.role} · ${s.total} дн</div>
                    </div>
                    <div style="text-align:right;margin-left:10px">
                      <div style="font-weight:800;font-size:16px;color:var(--accent)">${s.total}</div>
                    </div>
                  </div>
                `).join('')}
            </div>
          </div>
        </div>
      `;
    }).join('') : '<div class="card">Нет данных</div>'}
  `;
}

function toggleLoc(name) {
  if (expandedLocations.has(name)) expandedLocations.delete(name);
  else expandedLocations.add(name);
  renderSchedule();
}

const CHECKLISTS = { open: ['Включить вентиляцию','Проверить холодильники','Принять поставку'], close: ['Убрать заготовки','Санобработка','Вынести мусор'] };

function renderChecklist(){
  window._clTab = window._clTab || 'open';
  const key = window._clTab;
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('cl_'+today+'_'+key) || '[]');
  const items = CHECKLISTS[key];
  const done = saved.length;

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Чек-листы</h1>
    <div class="mults">
      <button class="mult ${key==='open'?'on':''}" onclick="window._clTab='open';renderChecklist()">Открытие</button>
      <button class="mult ${key==='close'?'on':''}" onclick="window._clTab='close';renderChecklist()">Закрытие</button>
    </div>
    <div class="card">
      ${items.map((item,i) => `
        <div class="check-item ${saved.includes(i)?'done':''}" onclick="toggleCheck(${i});haptic()">
          <div class="check-box">✓</div>
          <span>${item}</span>
        </div>
      `).join('')}
    </div>
  `;
}

window.toggleCheck = function(i){
  const key = window._clTab;
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('cl_'+today+'_'+key) || '[]');
  const idx = saved.indexOf(i);
  if(idx>=0) saved.splice(idx,1); else saved.push(i);
  localStorage.setItem('cl_'+today+'_'+key, JSON.stringify(saved));
  renderChecklist();
};

function renderTeam(){
  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Команда</h1>
    ${AppState.team.map(u => `
      <div class="user">
        <div class="avatar">${u.init}</div>
        <div class="user-info"><b>${u.name}</b><span>${u.role}</span></div>
      </div>
    `).join('')}
  `;
}

/* ============================================================
   🔐 АДМИНКА (СТАБИЛЬНАЯ)
   ============================================================ */
let adminTab = 'recipes';

function openAdmin(){
  showAdminModal();
}

function showAdminModal(){
  adminTab = adminTab || 'recipes';
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'admin-modal';
  modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
  
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">⚙️ Редактор</div>
        <button class="modal-close" onclick="document.getElementById('admin-modal').remove()">✕</button>
      </div>
      <div class="tabs">
        <button class="tab-btn ${adminTab==='recipes'?'on':''}" onclick="adminTab='recipes';showAdminModal()">ТТК</button>
        <button class="tab-btn ${adminTab==='news'?'on':''}" onclick="adminTab='news';showAdminModal()">Новости</button>
        <button class="tab-btn ${adminTab==='team'?'on':''}" onclick="adminTab='team';showAdminModal()">Команда</button>
      </div>
      <div id="admin-content"></div>
    </div>
  `;
  document.body.appendChild(modal);
  renderAdminContent();
}

function renderAdminContent(){
  const c = document.getElementById('admin-content');
  if(!c) return;
  
  if(adminTab === 'recipes'){
    c.innerHTML = `
      <button class="btn" onclick="editRecipe()">+ Добавить техкарту</button>
      ${AppState.recipes.map(r => `
        <div class="item-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${r.name}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${r.cat}</div>
            </div>
            <div>
              <button class="icon-btn" onclick="editRecipe(${r.id})">✏️</button>
              <button class="icon-btn danger" onclick="deleteRecipe(${r.id})">🗑</button>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  } else if(adminTab === 'news'){
    c.innerHTML = `
      <button class="btn" onclick="editNews()">+ Добавить новость</button>
      ${AppState.news.map((n,i) => `
        <div class="item-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${n.title}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${n.date}</div>
            </div>
            <div>
              <button class="icon-btn" onclick="editNews(${i})">✏️</button>
              <button class="icon-btn danger" onclick="deleteNews(${i})">🗑</button>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  } else if(adminTab === 'team'){
    c.innerHTML = `
      <button class="btn" onclick="editTeamMember()">+ Сотрудник</button>
      ${AppState.team.map((u,i) => `
        <div class="item-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${u.name}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${u.role}</div>
            </div>
            <div>
              <button class="icon-btn" onclick="editTeamMember(${i})">✏️</button>
              <button class="icon-btn danger" onclick="deleteTeamMember(${i})">🗑</button>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  }
}

// --- Редактирование Рецептов ---
function editRecipe(id){
  const r = id ? AppState.recipes.find(x=>x.id===id) : {id:Date.now(), name:'', cat:'Горячее', time:'', yield:'', kcal:0, note:'', ingr:[['',0,0]], steps:['']};
  
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${id?'✏️ Редактировать':'✨ Новая'} техкарта</div>
        <button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button>
      </div>
      <div class="form-field"><label class="form-label">Название</label><input class="form-input" id="r-name" value="${r.name}"></div>
      <div class="form-field"><label class="form-label">Категория</label>
        <select class="form-select" id="r-cat">
          ${['Горячее','Салаты','Десерты','Напитки','Заготовки'].map(c=>`<option ${r.cat===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
        <div class="form-field"><label class="form-label">Время</label><input class="form-input" id="r-time" value="${r.time}"></div>
        <div class="form-field"><label class="form-label">Выход</label><input class="form-input" id="r-yield" value="${r.yield}"></div>
        <div class="form-field"><label class="form-label">Ккал</label><input class="form-input" id="r-kcal" type="number" value="${r.kcal}"></div>
      </div>
      <div class="form-field"><label class="form-label">Ингредиенты <button class="btn btn-sm btn-sec" style="margin-left:8px" onclick="addIngrRow()">+</button></label>
        <div id="ingr-list">${r.ingr.map((i,idx)=>ingrRowHTML(i,idx)).join('')}</div>
      </div>
      <div class="form-field"><label class="form-label">Шаги <button class="btn btn-sm btn-sec" style="margin-left:8px" onclick="addStepRow()">+</button></label>
        <div id="steps-list">${r.steps.map((s,idx)=>stepRowHTML(s,idx)).join('')}</div>
      </div>
      <div class="form-field"><label class="form-label">Примечание</label><textarea class="form-textarea" id="r-note">${r.note||''}</textarea></div>
      <button class="btn" onclick="saveRecipe(${id||'null'})">💾 Сохранить</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function ingrRowHTML(i, idx){
  return `<div class="ing-editor" style="background:rgba(255,255,255,.03);padding:12px;border-radius:10px;margin-bottom:8px;display:flex;gap:6px;align-items:center">
    <input class="form-input" placeholder="Продукт" value="${i[0]||''}" data-ing="${idx}" data-f="0" style="flex:2">
    <input class="form-input" placeholder="Бр" type="number" value="${i[1]||0}" data-ing="${idx}" data-f="1" style="flex:1">
    <input class="form-input" placeholder="Нет" type="number" value="${i[2]||0}" data-ing="${idx}" data-f="2" style="flex:1">
    <button class="icon-btn danger" onclick="this.closest('.ing-editor').remove()">✕</button>
  </div>`;
}

function stepRowHTML(s, idx){
  return `<div style="display:flex;gap:6px;margin-bottom:8px;align-items:flex-start">
    <textarea class="form-textarea" placeholder="Шаг ${idx+1}" style="flex:1;min-height:42px">${s||''}" data-step="${idx}"></textarea>
    <button class="icon-btn danger" onclick="this.parentElement.remove()">✕</button>
  </div>`;
}

window.addIngrRow = function(){
  const list = document.getElementById('ingr-list');
  const idx = list.querySelectorAll('.ing-editor').length;
  list.insertAdjacentHTML('beforeend', ingrRowHTML(['',0,0], idx));
};
window.addStepRow = function(){
  const list = document.getElementById('steps-list');
  const idx = list.querySelectorAll('[data-step]').length;
  list.insertAdjacentHTML('beforeend', stepRowHTML('', idx));
};

window.saveRecipe = function(editId){
  const name = $('#r-name').value.trim();
  if(!name){ toast('Введите название!', 'error'); return; }
  
  const newIngr = Array.from(document.querySelectorAll('[data-ing]')).map(el => {
     const idx = el.dataset.ing;
     const f = el.dataset.f;
     const val = f==='0' ? el.value : (parseFloat(el.value)||0);
     // Группировка по индексам сложна в одном map, упростим сбор:
     return {idx, f, val}; 
  }).reduce((acc, curr) => {
     if(!acc[curr.idx]) acc[curr.idx] = [0,0,0];
     acc[curr.idx][curr.f] = curr.val;
     return acc;
  }, []).filter(arr => arr[0]); // Убрать пустые

  const newSteps = Array.from(document.querySelectorAll('[data-step]')).map(el => el.value).filter(v => v.trim());

  const r = {
    id: editId || Date.now(),
    name: name,
    cat: $('#r-cat').value,
    time: $('#r-time').value,
    yield: $('#r-yield').value,
    kcal: parseInt($('#r-kcal').value) || 0,
    note: $('#r-note').value,
    ingr: newIngr,
    steps: newSteps
  };

  if(editId){
    const idx = AppState.recipes.findIndex(x=>x.id===editId);
    AppState.recipes[idx] = r;
  } else {
    AppState.recipes.push(r);
  }
  saveData('recipes');
  document.getElementById('edit-modal').remove();
  toast('Сохранено ✓', 'success');
  renderAdminContent();
};

window.deleteRecipe = function(id){
  if(!confirm('Удалить?')) return;
  AppState.recipes = AppState.recipes.filter(x=>x.id!==id);
  saveData('recipes');
  renderAdminContent();
  toast('Удалено', 'success');
};

// --- Редактирование Новостей ---
function editNews(i){
  const n = i!==undefined ? AppState.news[i] : {tag:'Инфо', title:'', text:'', date:'Сегодня'};
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header"><div class="modal-title">${i!==undefined?'Ред':'Нов'} новость</div><button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button></div>
      <div class="form-field"><label class="form-label">Тег</label><input class="form-input" id="n-tag" value="${n.tag}"></div>
      <div class="form-field"><label class="form-label">Заголовок</label><input class="form-input" id="n-title" value="${n.title}"></div>
      <div class="form-field"><label class="form-label">Текст</label><textarea class="form-textarea" id="n-text">${n.text}</textarea></div>
      <div class="form-field"><label class="form-label">Дата</label><input class="form-input" id="n-date" value="${n.date}"></div>
      <button class="btn" onclick="saveNews(${i!==undefined?i:'null'})">💾 Сохранить</button>
    </div>`;
  document.body.appendChild(modal);
}

window.saveNews = function(i){
  const title = $('#n-title').value.trim();
  if(!title){ toast('Введите заголовок!', 'error'); return; }
  const n = {tag:$('#n-tag').value, title:title, text:$('#n-text').value, date:$('#n-date').value};
  if(i!==null) AppState.news[i] = n; else AppState.news.unshift(n);
  saveData('news');
  document.getElementById('edit-modal').remove();
  toast('Сохранено ✓', 'success');
  renderAdminContent();
};
window.deleteNews = function(i){
  if(!confirm('Удалить?')) return;
  AppState.news.splice(i,1);
  saveData('news');
  renderAdminContent();
};

// --- Редактирование Команды ---
function editTeamMember(i){
  const u = i!==undefined ? AppState.team[i] : {name:'', role:'', init:'??'};
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header"><div class="modal-title">${i!==undefined?'Ред':'Нов'} сотрудник</div><button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button></div>
      <div class="form-field"><label class="form-label">Имя</label><input class="form-input" id="u-name" value="${u.name}"></div>
      <div class="form-field"><label class="form-label">Должность</label><input class="form-input" id="u-role" value="${u.role}"></div>
      <div class="form-field"><label class="form-label">Инициалы</label><input class="form-input" id="u-init" value="${u.init}" maxlength="2"></div>
      <button class="btn" onclick="saveTeamMember(${i!==undefined?i:'null'})">💾 Сохранить</button>

}

window.saveTeamMember = function(i){

  if(!name){ toast('Введите имя!', 'error'); return; }

  saveData('team');
  document.getElementById('edit-modal').remove();
  toast('Сохранено ✓', 'success');
  renderAdminContent();
};
window.deleteTeamMember = function(i){
  if(!confirm('Удалить?')) return;
  AppState.team.splice(i,1);
  saveData('team');
  renderAdminContent();
};

/* ============================================================
   🚀 СТАРТ

initData();
render();
</script>

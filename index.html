}

async function syncToFirebase(){
  if(FIREBASE_URL.includes('ВАШ-ПРОЕКТ')){ console.warn('Firebase URL не настроен.'); return; }
  try{
    const data = {recipes:RECIPES,news:NEWS,team:TEAM,matrix:MATRIX_DATA,favorites:FAVORITES,updatedAt:Date.now()};
    const res = await fetch(`${FIREBASE_URL}${FB_PATH}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!res.ok) console.warn('☁️ Firebase ошибка:', res.status);
  }catch(e){ console.warn('☁️ Ошибка синхронизации:', e.message); }
}
async function loadFromFirebase(){
  if(FIREBASE_URL.includes('ВАШ-ПРОЕКТ')) return false;
  try{
    const res = await fetch(`${FIREBASE_URL}${FB_PATH}.json?t=${Date.now()}`);
    if(!res.ok) return false;
    const data = await res.json();
    if(data && data.recipes){
      RECIPES=data.recipes; NEWS=data.news||DEFAULT_NEWS; TEAM=data.team||DEFAULT_TEAM;
      MATRIX_DATA=data.matrix||DEFAULT_MATRIX; FAVORITES=data.favorites||[];
      localStorage.setItem('chef_recipes',JSON.stringify(RECIPES));
      localStorage.setItem('chef_news',JSON.stringify(NEWS));
      localStorage.setItem('chef_team',JSON.stringify(TEAM));
      localStorage.setItem('chef_matrix',JSON.stringify(MATRIX_DATA));
      return true;
    }
  }catch(e){ console.warn('☁️ Не удалось загрузить:', e.message); }
  return false;
}

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function act(name, ...args){
  return `data-action="${name}"` + (args.length ? ` data-args='${JSON.stringify(args).replace(/'/g,"&#39;")}'` : '');
}
function runAction(el){
  const fn = window[el.dataset.action];
  if(typeof fn !== 'function') return;
  let args = [];
  if(el.dataset.args){ try{ args = JSON.parse(el.dataset.args); }catch(e){ args = []; } }

function haptic(kind){ try{ if(tg?.HapticFeedback){ tg.HapticFeedback.impactOccurred(kind==='hard'?'medium':'light'); } }catch(e){} }

/* ============================================================
   🌀 PHYSICS ENGINE — единственный источник движения
============================================================ */
function makeSpring(response=0.4, bounce=0, mass=1){
  const zeta = Math.max(0.05, 1 - bounce);           // bounce 0 → критическое затухание
  const omega = (2*Math.PI)/response;
  return { stiffness: mass*omega*omega, damping: 2*zeta*Math.sqrt(mass*omega*omega*mass), mass };
}
function springAnimate({from, to, velocity=0, onUpdate, onComplete, stiffness, damping, mass=1}){
  if(RM.matches){ onUpdate(to,0); if(onComplete) onComplete(); return {cancel(){}, getVelocity:()=>0}; }
  let current=from, vel=velocity, rafId=null, lastTime=performance.now(), running=true;
  function tick(now){
    if(!running) return;
    const dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;
    const disp = current - to;
    const acc = ((-stiffness*disp) + (-damping*vel)) / mass;
    vel += acc*dt; current += vel*dt;
    onUpdate(current, vel);
    if(Math.abs(current-to) < 0.4 && Math.abs(vel) < 0.5){
      onUpdate(to, 0); if(onComplete) onComplete(); return;
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
  return { cancel(){ running=false; if(rafId) cancelAnimationFrame(rafId); }, getVelocity(){ return vel; } };
}
function rubberband(overshoot, dimension, constant=0.55){
  return (overshoot*dimension*constant) / (dimension + constant*Math.abs(overshoot));
}
function project(initialVelocity, decelerationRate=0.998){
  return (initialVelocity/1000) * decelerationRate / (1-decelerationRate);
}
function velocityFromHistory(h){
  const now = performance.now();
  const rec = h.filter(p => now - p.t < 100);
  if(rec.length < 2) return 0;
  const a=rec[0], b=rec[rec.length-1];
  const dt = b.t - a.t;
  return dt > 0 ? (b.y - a.y)/dt*1000 : 0;
}
/* Spring по произвольному скалярному свойству с состоянием (interruptible) */
const scalarMap = new WeakMap();
function springScalar(el, map, {to, apply, spring, rest}){
  let st = map.get(el);
  if(!st){ st = {v:0, value: parseFloat(el.dataset.init||'0'), anim:null}; map.set(el,st); }
  st.anim?.cancel();
  st.anim = springAnimate({from:st.value, to, velocity:st.v, ...spring,
    onUpdate:(v,vel)=>{ st.value=v; st.v=vel; apply(v); },
    onComplete:()=>{ st.v=0; st.anim=null; if(rest) rest(); }});
}
/* Аккордеон: spring по высоте (локальный layout — осознанный компромисс) */
const heightMap = new WeakMap();
function springHeight(el, open){
  const st = heightMap.get(el) || {v:0, anim:null};
  heightMap.set(el, st);
  const cur = el.offsetHeight;
  const target = open ? el.firstElementChild.offsetHeight : 0;
  st.anim?.cancel();
  el.style.height = cur+'px';
  if(RM.matches){ el.style.height = open?'auto':'0px'; el.style.opacity = open?'1':'0'; return; }
  st.anim = springAnimate({from:cur, to:target, velocity:st.v, ...makeSpring(0.38,0),
    onUpdate:(h,v)=>{ st.v=v; el.style.height=h+'px'; el.style.opacity=String(clamp(h/Math.max(target,cur,1),0,1)); },
    onComplete:()=>{ st.v=0; el.style.height = open?'auto':'0px'; el.style.opacity = open?'1':'0'; }});
}
const rotMap = new WeakMap();
function springRotate(el, deg){
  if(!el) return;
  springScalar(el, rotMap, {to:deg, spring:makeSpring(0.4,0.1), apply:r=>{ el.style.transform=`rotate(${r}deg)`; }});
}
/* Пружинный pop для мелких объектов (чекбоксы, FAB, кнопки матрицы) */
function popEl(el, from=0.6){
  if(!el || RM.matches) return;
  springAnimate({from, to:1, velocity:0, ...makeSpring(0.35,0.5),
    onUpdate:s=>{ el.style.transform=`scale(${s})`; },
    onComplete:()=>{ el.style.transform=''; }});
}

/* ============================================================
   🎯 СИСТЕМА МГНОВЕННОГО ОТКЛИКА (§3.1) — pointerdown, не click
============================================================ */
const tap = { el:null, id:null, x:0, y:0, cancelled:false };
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-action]');
  if(!el || e.button > 0) return;
  if(el.matches('input,select,textarea,a')) return;
  e.preventDefault(); // убирает tap-delay и синтетический click
  tap.el=el; tap.id=e.pointerId; tap.x=e.clientX; tap.y=e.clientY; tap.cancelled=false;
  el.classList.add('pressed');
  haptic(el.dataset.haptic || 'light'); // фидбек в первый кадр
}, {passive:false});
document.addEventListener('pointermove', e => {
  if(!tap.el || e.pointerId !== tap.id) return;
  if(!tap.cancelled && Math.hypot(e.clientX-tap.x, e.clientY-tap.y) > 12){
    tap.cancelled = true; tap.el.classList.remove('pressed'); // cancel-by-dragging-away
  }
}, {passive:true});
document.addEventListener('pointerup', e => {
  if(!tap.el || e.pointerId !== tap.id) return;
  const el = tap.el; tap.el=null;
  el.classList.remove('pressed');
  if(!tap.cancelled) runAction(el);
});
document.addEventListener('pointercancel', e => {
  if(!tap.el || e.pointerId !== tap.id) return;
  tap.el.classList.remove('pressed'); tap.el=null;
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){
    if(panelStack.length) closePanel();
    else if(viewStack.length>1) goBack();
    return;
  }
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = document.activeElement;
  if(el && el.dataset && el.dataset.action){ e.preventDefault(); runAction(el); }
});

/* ============================================================
   🧭 НАВИГАЦИЯ: push/pop как физика двух связанных объектов
============================================================ */
let currentView = 'home';
let currentRecipeId = null;
let currentMult = 1;
let expandedLocations = new Set();
let ttkSearchRaf = null, matrixSearchRaf = null;
let viewStack = [{view:'home', data:null}];
let screenStack = [];
let currentScreen = app;
let navAnim = null, navX = 0;

function hidePrev(p){
  if(!p) return;
  p.style.display='none'; p.style.visibility='hidden';
  p.style.transform=''; p.style.opacity='';
}
function applyNavPosOn(cur, prev, x){
  navX = x;
  cur.style.transform = `translateX(${x}px)`;
  if(prev){
    const p = clamp(x/innerWidth, 0, 1.2);
    prev.style.transform = `translateX(${(p*30-30)}%)`;
    prev.style.opacity = String(Math.max(0.45, 1-p*0.55));
  }
}
function navigate(view, data){
  if(data !== undefined) currentRecipeId = data;
  const prev = screenStack.length ? screenStack[screenStack.length-1] : null;
  const el = document.createElement('div');
  el.className = 'screen';
  app.appendChild(el);
  if(prev) prev.classList.remove('current');
  el.classList.add('current');
  screenStack.push(el); viewStack.push({view, data: data ?? null});
  currentView = view; currentScreen = el; navX = innerWidth;
  render();
  navAnim?.cancel();
  navAnim = springAnimate({from:innerWidth, to:0, velocity:0, ...makeSpring(0.42,0),
    onUpdate:(x)=>{ applyNavPosOn(el, prev, x); },
    onComplete:()=>{ navAnim=null; navX=0; el.style.transform=''; hidePrev(prev); }});
}
function commitPopState(){
  viewStack.pop();
  const cur = screenStack.pop();
  const ps = viewStack[viewStack.length-1];
  currentView = ps.view;
  currentRecipeId = ps.data ?? null;
  currentScreen = screenStack[screenStack.length-1] || app;
  return cur;
}
function animatePop(cur, from, velocity){
  const prev = screenStack[screenStack.length-1];
  if(prev){ prev.style.display=''; prev.style.visibility=''; prev.classList.add('current'); }
  cur.classList.remove('current');
  navAnim?.cancel();
  navAnim = springAnimate({from, to:innerWidth, velocity, ...makeSpring(0.4, velocity>600?0.1:0),
    onUpdate:(x)=>{ applyNavPosOn(cur, prev, x); },
    onComplete:()=>{
      navAnim=null; navX=0;
      cur.remove();
      if(prev){ prev.style.transform=''; prev.style.opacity=''; }
      render();
    }});
}
function goBack(){
  if(viewStack.length<=1) return;
  const from = navAnim ? Math.max(0, navX) : 0;
  const v = navAnim ? Math.abs(navAnim.getVelocity()) : 0;
  navAnim?.cancel();
  const cur = commitPopState();
  if(!cur) return;
  animatePop(cur, from, v);
}

/* ---------- Interactive pop gesture (iOS-style), Pointer Events ---------- */
const sb = { id:null, startX:0, startY:0, baseX:0, x:0, engaged:false, cur:null, prev:null, history:[] };
document.addEventListener('pointerdown', e => {
  if(panelStack.length || viewStack.length<=1) return;
  if(e.clientX > 44) return; // краевая зона
  const cur = screenStack[screenStack.length-1], prev = screenStack[screenStack.length-2];
  if(!cur || !prev) return;
  if(navAnim){ navAnim.cancel(); navAnim=null; }
  sb.id=e.pointerId; sb.startX=e.clientX; sb.startY=e.clientY;
  sb.baseX=navX||0; sb.x=sb.baseX; sb.engaged=false;
  sb.cur=cur; sb.prev=prev; sb.history=[];
  prev.style.display=''; prev.style.visibility='';
  applyNavPosOn(cur, prev, sb.x);
}, true);
document.addEventListener('pointermove', e => {
  if(sb.id !== e.pointerId) return;
  const dx = e.clientX - sb.startX, dy = e.clientY - sb.startY;
  if(!sb.engaged){
    if(dx < 0 || (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 10)){ sbAbort(); return; }
    if(dx > 12 && Math.abs(dx) > Math.abs(dy)*1.3){
      sb.engaged = true;
      try{ sb.cur.setPointerCapture(e.pointerId); }catch(_){}
    } else return;
  }
  e.preventDefault();
  sb.history.push({x:e.clientX, t:performance.now()});
  if(sb.history.length>8) sb.history.shift();
  sb.x = Math.max(0, sb.baseX + dx);
  applyNavPosOn(sb.cur, sb.prev, sb.x); // 1:1, без «догоняния»
}, {passive:false});
document.addEventListener('pointerup', e => { if(sb.id===e.pointerId) finishSwipe(); });
document.addEventListener('pointercancel', e => { if(sb.id===e.pointerId) sbAbort(); });
function sbAbort(){
  if(sb.id===null) return;
  const cur=sb.cur, prev=sb.prev, x=sb.x;
  sb.id=null; sb.engaged=false;
  if(x > 2){
    navAnim = springAnimate({from:x, to:0, velocity:0, ...makeSpring(0.4,0),
      onUpdate:v=>applyNavPosOn(cur, prev, v),
      onComplete:()=>{ navAnim=null; navX=0; cur.style.transform=''; hidePrev(prev); }});
  } else { cur.style.transform=''; hidePrev(prev); }
}
function finishSwipe(){
  const x=sb.x, cur=sb.cur, prev=sb.prev;
  const v = velocityFromHistory(sb.history.map(h=>({y:h.x,t:h.t})));
  sb.id=null; sb.engaged=false;
  // Решение — по проекции импульса и знаку скорости, не по порогу позиции
  const projected = x + project(v);
  const commit = v > 900 || (v > -300 && projected > innerWidth*0.5);
  if(commit){
    commitPopState();
    animatePop(cur, x, Math.max(0, v)); // velocity handoff без шва
  } else {
    navAnim?.cancel();
    navAnim = springAnimate({from:x, to:0, velocity:v, ...makeSpring(0.4,0.12),
      onUpdate:vx=>applyNavPosOn(cur, prev, vx),
      onComplete:()=>{ navAnim=null; navX=0; cur.style.transform=''; hidePrev(prev); }});
  }
}

/* ============================================================
   🗂 ПАНЕЛИ (Sheet/Modal): drag-to-dismiss, depth, symmetry
============================================================ */
const panelStack = [];
function panelById(id){ return panelStack.find(s=>s.id===id); }
function applyPush(el, f){
  if(!el) return;
  if(f <= 0.01){ el.style.scale=''; el.style.opacity=''; el.style.borderRadius=''; return; }
  el.style.scale = String(1 - 0.045*f);
  el.style.opacity = String(1 - 0.25*f);
  el.style.borderRadius = (16*f)+'px';
}
function setPanelY(st, y){
  st.y = y;
  st.panel.style.transform = `translateY(${y}px)`;
  const f = clamp(1 - y/st.H, 0, 1);
  st.scrim.style.opacity = (0.55*f).toFixed(3);
  const idx = panelStack.indexOf(st);
  const below = idx > 0 ? panelStack[idx-1].panel : screenStack[screenStack.length-1];
  applyPush(below, f);
  if(idx > 1) applyPush(panelStack[idx-2].panel, f*0.5);
}
function refreshPush(){
  const st = panelStack[panelStack.length-1];
  if(st){ setPanelY(st, st.y); }
  else { const s = screenStack[screenStack.length-1]; if(s){ s.style.scale=''; s.style.opacity=''; s.style.borderRadius=''; } }
}
function openPanel(opts){
  killPanelInstant(opts.id);
  const root = document.createElement('div');
  root.className = 'panel-root';
  root.innerHTML = `
    <div class="scrim"></div>
    <div class="panel panel--${opts.variant||'sheet'}">
      <div class="panel-grip">
        <div class="sheet-handle"></div>
        <div class="panel-header">
          <div class="panel-title">${opts.title}</div>
          <button class="sheet-close" ${act('closePanel')} aria-label="Закрыть">✕</button>
        </div>
      </div>
      <div class="panel-body">${opts.body}</div>
    </div>`;
  document.body.appendChild(root);
  const panel = root.querySelector('.panel');
  const scrim = root.querySelector('.scrim');
  const H = panel.offsetHeight;
  const st = { id:opts.id, root, panel, scrim, H, y:H, anim:null, drag:null, onClose:opts.onClose };
  panelStack.push(st);
  panel.style.transform = `translateY(${H}px)`;
  wirePanelDrag(st);
  scrim.addEventListener('pointerdown', e => { e.preventDefault(); closePanel(); });
  if(RM.matches){
    panel.style.transform = '';
    requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.add('rm-in')));
  } else {
    requestAnimationFrame(()=>{
      st.anim = springAnimate({from:H, to:0, velocity:0, ...makeSpring(0.36,0.05),
        onUpdate:y=>setPanelY(st,y), onComplete:()=>{ st.anim=null; }});
    });
  }
  if(opts.afterRender) opts.afterRender(root);
  return st;
}
function wirePanelDrag(st){
  const grip = st.root.querySelector('.panel-grip');
  grip.addEventListener('pointerdown', e => {
    if(e.target.closest('[data-action]')) return; // кнопки в шапке — это тапы
    e.preventDefault();
    try{ grip.setPointerCapture(e.pointerId); }catch(_){}
    if(st.anim){ st.anim.cancel(); st.anim=null; }
    st.drag = { id:e.pointerId, startY:e.clientY, baseY:st.y, history:[] };
  });
  grip.addEventListener('pointermove', e => {
    const d = st.drag;
    if(!d || e.pointerId !== d.id) return;
    let y = d.baseY + (e.clientY - d.startY); // grab offset уважается (дельта)
    if(y < 0) y = -rubberband(-y, st.H*0.6, 0.55); // прогрессивное сопротивление
    d.history.push({y:e.clientY, t:performance.now()});
    if(d.history.length>8) d.history.shift();
    setPanelY(st, y);
  });
  const release = (e, isCancel) => {
    const d = st.drag;
    if(!d || e.pointerId !== d.id) return;
    st.drag = null;
    const v = isCancel ? 0 : velocityFromHistory(d.history);
    const projected = st.y + project(v);
    const dismiss = v > 1100 || (v > -250 && projected > st.H*0.45);
    if(dismiss){ dismissPanel(st, Math.max(0,v)); }
    else {
      st.anim = springAnimate({from:st.y, to:0, velocity:v, ...makeSpring(0.36, Math.abs(v)>400?0.15:0),
        onUpdate:y=>setPanelY(st,y), onComplete:()=>{ st.anim=null; }});
    }
  };
  grip.addEventListener('pointerup', e => release(e,false));
  grip.addEventListener('pointercancel', e => release(e,true));
}
function dismissPanel(st, velocity){
  const done = () => {
    st.root.remove();
    const i = panelStack.indexOf(st); if(i>=0) panelStack.splice(i,1);
    refreshPush();
    if(st.onClose) st.onClose();
  };
  if(st.anim){ st.anim.cancel(); st.anim=null; }
  if(RM.matches){
    st.root.classList.remove('rm-in');
    setTimeout(done, 180);
    return;
  }
  st.anim = springAnimate({from:st.y, to:st.H, velocity, ...makeSpring(0.34,0),
    onUpdate:y=>setPanelY(st,y), onComplete:done});
}
function closePanel(){ const st = panelStack[panelStack.length-1]; if(st) dismissPanel(st, 0); }
function closePanelById(id){ const st = panelById(id); if(st) dismissPanel(st, 0); }
function killPanelInstant(id){
  const st = panelById(id);
  if(st){ st.root.remove(); const i=panelStack.indexOf(st); if(i>=0)panelStack.splice(i,1); refreshPush(); }
}
function updatePanelBody(id, html){
  const st = panelById(id);
  if(st) st.root.querySelector('.panel-body').innerHTML = html;
}
function updatePanelTitle(id, html){
  const st = panelById(id);
  if(st) st.root.querySelector('.panel-title').innerHTML = html;
}

/* ============================================================
   🍞 TOAST — spring, не bezier
============================================================ */
let toastEl=null, toastAnim=null, toastTimer=null;
function toast(msg, type='info'){
  if(toastEl){ toastAnim?.cancel(); toastEl.remove(); toastEl=null; }
  clearTimeout(toastTimer);
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  if(type==='error'){ t.style.background='var(--red)'; t.style.color='#fff'; }
  if(type==='success'){ t.style.background='var(--green)'; t.style.color='#000'; }
  document.body.appendChild(t);
  toastEl=t;
  const applyPos = y => {
    t.style.transform = `translateX(-50%) translateY(${y}px)`;
    t.style.opacity = String(clamp(1 - y/90, 0, 1));
  };
  toastAnim = springAnimate({from:90, to:0, velocity:0, ...makeSpring(0.45,0.3),
    onUpdate:applyPos,
    onComplete:()=>{
      toastTimer = setTimeout(()=>{
        toastAnim = springAnimate({from:0, to:90, velocity:0, ...makeSpring(0.32,0),
          onUpdate:applyPos,
          onComplete:()=>{ t.remove(); if(toastEl===t) toastEl=null; }});
      }, 2200);
    }});
}

let currentWeekStart = null, selectedDayIndex = null;
async function fetchScheduleData(force=false, silent=false){
  if(isLoading) return;
  isLoading = true;
  if(!force && scheduleData){ isLoading=false; return; }
  try{
    const response = await fetch(SHEET_URL + '&t=' + Date.now());
    if(!response.ok) throw new Error('Ошибка сети: ' + response.status);
    const parsed = parseComplexCSV(await response.text());
    if(parsed?.locations?.length){ scheduleData=parsed; useLocalSchedule=false; if(!silent) toast('Данные обновлены','success'); }
    else throw new Error('Неверный формат данных');
  }catch(e){
    console.warn('Онлайн загрузка не удалась:', e);
    if(!scheduleData){ scheduleData=DEFAULT_LOCAL_DATA; useLocalSchedule=true; }
    if(!silent) toast('Нет связи с сервером. Показаны локальные данные.','error');
  }finally{ isLoading=false; }
}
function parseComplexCSV(csvText){
  const rows = csvText.split('\n').map(row=>{
    const result=[]; let cell='', inQuotes=false;
    for(let i=0;i<row.length;i++){
      const ch=row[i];
      if(ch==='"') inQuotes=!inQuotes;
      else if(ch===','&&!inQuotes){ result.push(cell.trim()); cell=''; }
      else cell+=ch;
    }
    result.push(cell.trim());
    return result;
  }).filter(r=>r.length>2);
  if(rows.length<5) return null;
  const locations=[]; let currentLoc=null;
  for(const row of rows){
    const first=(row[0]||'').trim().toLowerCase();
    if(first.includes('итого')||first.includes('дата')||first.includes('локация')||first===''||!isNaN(first)||first.includes('вск')||first.includes('пн')) continue;
    const second=(row[1]||'').trim();
    if(second==='Должность'||second===''){
      if(row[0]&&row[0].trim()!==''&&!row[0].includes('итого')){
        currentLoc={name:row[0].trim(),staff:[]}; locations.push(currentLoc);
      }
    } else if(currentLoc){
      const shifts=[];
      for(let d=2;d<Math.min(row.length-2,33);d++){
        let val=row[d]; if(val&&val.includes(',')) val=val.replace(',','.');
        let num=parseFloat(val); if(isNaN(num)) num=0;
        shifts.push(num);
      }
      currentLoc.staff.push({name:row[0].trim(),role:second,shifts,total:shifts.reduce((a,b)=>a+b,0)});
    }
  }
  return locations.length ? {month:'Август 2026', locations} : null;
}

          <div class="cart-qty-wrap">
            <button class="cart-qty-btn" ${act('updateCartQty',it.idx,-1)} aria-label="Меньше">−</button>
            <input class="cart-qty-input" type="text" inputmode="decimal" data-idx="${it.idx}" value="${it.qty}">
            <button class="cart-qty-btn" ${act('updateCartQty',it.idx,1)} aria-label="Больше">+</button>
          </div>
          <button class="icon-btn danger" style="width:1.75rem;height:1.75rem" ${act('deleteCartItem',it.idx)} aria-label="Удалить">✕</button>
        </div>`).join('')}
    </div>`).join('') + `
    <button class="btn" ${act('copyOrder')} data-haptic="hard" style="margin-top:.5rem">📋 Скопировать заявку</button>
    <button class="btn btn-sec" ${act('clearCart')}>🗑 Очистить</button>`;
}
function wireCartInputs(root){
  (root||document).querySelectorAll('.cart-qty-input').forEach(inp=>{
    inp.addEventListener('focus', ()=>inp.select());
    inp.addEventListener('change', ()=>setCartQty(parseInt(inp.dataset.idx), inp.value));
  });
}
function renderCartSheet(){
  const st=panelById('cart');
  if(st){
    updatePanelTitle('cart',`📋 Заявка (${orderCart.length})`);
    updatePanelBody('cart',cartBodyHtml());
    wireCartInputs(st.root);
  } else {
    openPanel({id:'cart',variant:'sheet',title:`📋 Заявка (${orderCart.length})`,body:cartBodyHtml(),afterRender:r=>wireCartInputs(r)});
  }
}
window.renderCartSheet = renderCartSheet;
window.updateCartQty = function(idx,delta){
  if(!orderCart[idx]) return;
  orderCart[idx].qty=Math.max(0.01,parseFloat((orderCart[idx].qty+delta).toFixed(3)));
  saveData(); renderCartSheet(); updateCartFab();
};
function setCartQty(idx,rawVal){
  const num=parseFloat(String(rawVal).replace(',','.').replace(/[^0-9.]/g,''));
  if(isNaN(num)||num<=0) orderCart.splice(idx,1);
  else orderCart[idx].qty=Math.round(num*1000)/1000;
  saveData(); updateCartFab();
  if(!orderCart.length){ closePanelById('cart'); return; }
  renderCartSheet();
}
window.deleteCartItem = function(idx){
  orderCart.splice(idx,1);
  saveData(); updateCartFab();
  if(!orderCart.length){ closePanelById('cart'); return; }
  renderCartSheet();
};
window.clearCart = function(){
  orderCart=[]; saveData(); updateCartFab();
  closePanelById('cart'); renderMatrix();
};
window.copyOrder = function(){
  if(!orderCart.length){ toast('Корзина пуста','error'); return; }
  const date=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const grouped={};
  orderCart.forEach(c=>{ (grouped[c.supplier]=grouped[c.supplier]||[]).push(c); });
  let text=`📋 ЗАЯВКА НА ПОСТАВКУ\n${date}\n\n`;
  for(const [sup,items] of Object.entries(grouped)){
    text+=`📦 ${sup}\n`;
    items.forEach(it=>{ text+=`• ${it.name} — ${it.qty} ${it.unit}\n`; });
    text+='\n';
  }
  text+='—\nОтправлено из ШефБук';
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>toast('Скопировано! Вставьте в заметки','success'))
      .catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
};
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Скопировано! Вставьте в заметки','success'); }
  catch{ toast('Не удалось скопировать','error'); }
  ta.remove();
}
let fabShown=false;
const cartFab=document.createElement('button');
cartFab.className='cart-fab';
cartFab.style.display='none';
cartFab.setAttribute('data-action','renderCartSheet');
cartFab.setAttribute('data-haptic','hard');
cartFab.setAttribute('aria-label','Корзина');
cartFab.innerHTML='<span>📋</span>';
document.body.appendChild(cartFab);
function updateCartFab(){
  if(orderCart.length>0){
    cartFab.style.display='flex';
    let badge=cartFab.querySelector('.cart-badge');
    if(!badge){ badge=document.createElement('span'); badge.className='cart-badge'; cartFab.appendChild(badge); }
    badge.textContent=orderCart.length;
    if(!fabShown){ fabShown=true; popEl(cartFab,0.4); }
  } else { cartFab.style.display='none'; fabShown=false; }
}

          <button class="icon-btn" ${act('editRecipe',r.id)} aria-label="Редактировать">✏️</button>

        </div></div></div>`).join('');

    c.innerHTML=`<button class="btn" ${act('editNews')}>+ Добавить новость</button>` +

        <div><div class="item-card-title">${esc(n.tag)}: ${esc(n.title)}</div><div class="small" style="color:var(--muted);margin-top:.1875rem">${esc(n.date)}</div></div>

        <div><div class="item-card-title">${esc(u.name)}</div><div class="small" style="color:var(--muted);margin-top:.1875rem">${esc(u.role)}</div></div>
        <div style="display:flex;gap:.375rem">
          <button class="icon-btn" ${act('editTeamMember',i)}>✏️</button>
          <button class="icon-btn danger" ${act('deleteTeamMember',i)}>🗑</button>

/* ---------- CRUD: техкарты ---------- */
function editRecipe(id){
  killPanelInstant('edit-modal');
  const r=id?RECIPES.find(x=>x.id===id):{id:null,name:'',cat:'Горячее',time:'',yield:'',kcal:0,note:'',ingr:[['',0,0]],steps:['']};
  if(!r) return;
  const body=`
    <div class="form-field"><label class="form-label">Название</label><input class="form-input" id="r-name" value="${esc(r.name)}"></div>
    <div class="form-field"><label class="form-label">Категория</label>
      <select class="form-select" id="r-cat">${['Горячее','Салаты','Десерты','Напитки','Заготовки'].map(c=>`<option ${r.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem">
      <div class="form-field"><label class="form-label">Время</label><input class="form-input" id="r-time" value="${esc(r.time)}"></div>
      <div class="form-field"><label class="form-label">Выход</label><input class="form-input" id="r-yield" value="${esc(r.yield)}"></div>
      <div class="form-field"><label class="form-label">Ккал</label><input class="form-input" id="r-kcal" type="number" value="${r.kcal}"></div>
    </div>
    <div class="form-field">
      <label class="form-label">Ингредиенты <button class="btn btn-sm btn-sec" style="margin-left:.5rem" ${act('addIngr')}>+ Добавить</button></label>
      <div id="ingr-list">${r.ingr.map((i,idx)=>ingrRow(i,idx)).join('')}</div>
    </div>
    <div class="form-field">
      <label class="form-label">Шаги <button class="btn btn-sm btn-sec" style="margin-left:.5rem" ${act('addStep')}>+ Добавить</button></label>
      <div id="steps-list">${r.steps.map((s,idx)=>stepRow(s,idx)).join('')}</div>
    </div>
    <div class="form-field"><label class="form-label">Примечание</label><textarea class="form-textarea" id="r-note">${esc(r.note||'')}</textarea></div>
    <button class="btn" ${act('saveRecipe',r.id)} data-haptic="hard">💾 Сохранить</button>`;
  openPanel({id:'edit-modal',variant:'modal',title:(id?'✏️ Редактировать':'✨ Новая')+' техкарта',body});
}
window.editRecipe = editRecipe;
function ingrRow(i,idx){
  return `<div class="ing-editor"><div style="display:grid;grid-template-columns:1fr 4.375rem 4.375rem 2rem;gap:.375rem">
    <input class="form-input" placeholder="Продукт" data-ing="${idx}" data-f="name" value="${esc(i[0]||'')}">
    <input class="form-input" placeholder="Брутто" type="number" data-ing="${idx}" data-f="brutto" value="${i[1]||0}">
    <input class="form-input" placeholder="Нетто" type="number" data-ing="${idx}" data-f="netto" value="${i[2]||0}">
    <button class="icon-btn danger" ${act('removeRow')} aria-label="Удалить">✕</button>
  </div></div>`;
}
function stepRow(s,idx){
  return `<div style="display:flex;gap:.375rem;margin-bottom:.5rem;align-items:flex-start">
    <textarea class="form-textarea" data-step="${idx}" placeholder="Шаг ${idx+1}" style="flex:1;min-height:2.625rem">${esc(s||'')}</textarea>
    <button class="icon-btn danger" ${act('removeRow')} aria-label="Удалить">✕</button>
  </div>`;
}
window.removeRow = function(el){ el.closest('.ing-editor, div[style*="flex"]').remove(); };
window.addIngr = function(){
  const list=document.getElementById('ingr-list');
  list.insertAdjacentHTML('beforeend', ingrRow(['',0,0], list.querySelectorAll('.ing-editor').length));
};
window.addStep = function(){
  const list=document.getElementById('steps-list');
  list.insertAdjacentHTML('beforeend', stepRow('', list.querySelectorAll('[data-step]').length));
};
window.saveRecipe = function(editId){
  const r={
    id:editId||Date.now(),
    name:$('#r-name').value, cat:$('#r-cat').value, time:$('#r-time').value, yield:$('#r-yield').value,
    kcal:parseInt($('#r-kcal').value)||0, note:$('#r-note').value,
    ingr:Array.from(document.querySelectorAll('[data-ing]')).reduce((acc,el)=>{
      const idx=el.dataset.ing, f=el.dataset.f;
      acc[idx]=acc[idx]||[];
      const val=f==='name'?el.value:parseFloat(el.value)||0;
      acc[idx][f==='name'?0:f==='brutto'?1:2]=val;
      return acc;
    },[]).filter(x=>x&&x[0]),
    steps:Array.from(document.querySelectorAll('[data-step]')).map(el=>el.value).filter(x=>x.trim())
  };
  if(!r.name){ toast('Введите название','error'); return; }
  if(editId){ RECIPES[RECIPES.findIndex(x=>x.id===editId)]=r; } else RECIPES.push(r);
  saveData(); syncToFirebase();
  closePanelById('edit-modal');
  toast('Сохранено ✓','success');
  renderAdminContent();
};
window.deleteRecipe = function(id){
  if(!confirm('Удалить техкарту?')) return;
  const idx=RECIPES.findIndex(r=>r.id===id);
  if(idx>=0) RECIPES.splice(idx,1);
  saveData(); syncToFirebase();
  renderAdminContent();
  toast('Удалено','success');
};

/* ---------- CRUD: новости / команда ---------- */
window.editNews = function(i){
  killPanelInstant('edit-modal');
  const isEdit=i!==undefined&&i!==null;
  const n=isEdit?NEWS[i]:{tag:'',title:'',text:'',date:'Сегодня'};
  openPanel({id:'edit-modal',variant:'modal',title:(isEdit?'Редактировать':'Новая')+' новость',body:`
    <div class="form-field"><label class="form-label">Тег</label><input class="form-input" id="n-tag" value="${esc(n.tag)}"></div>
    <div class="form-field"><label class="form-label">Заголовок</label><input class="form-input" id="n-title" value="${esc(n.title)}"></div>
    <div class="form-field"><label class="form-label">Текст</label><textarea class="form-textarea" id="n-text">${esc(n.text)}</textarea></div>
    <div class="form-field"><label class="form-label">Дата</label><input class="form-input" id="n-date" value="${esc(n.date)}"></div>
    <button class="btn" ${act('saveNews',isEdit?i:null)} data-haptic="hard">💾 Сохранить</button>`});
};
window.saveNews = function(i){
  const n={tag:$('#n-tag').value,title:$('#n-title').value,text:$('#n-text').value,date:$('#n-date').value};
  if(!n.title){ toast('Введите заголовок','error'); return; }
  if(i!==null&&i!==undefined) NEWS[i]=n; else NEWS.unshift(n);
  saveData(); syncToFirebase();
  closePanelById('edit-modal');
  renderAdminContent();
  toast('Сохранено','success');
};
window.deleteNews = function(i){
  if(!confirm('Удалить новость?')) return;
  NEWS.splice(i,1); saveData(); syncToFirebase();
  renderAdminContent(); toast('Удалено','success');
};
window.editTeamMember = function(i){
  killPanelInstant('edit-modal');
  const isEdit=i!==undefined&&i!==null;
  const u=isEdit?TEAM[i]:{name:'',role:'',init:'??'};
  openPanel({id:'edit-modal',variant:'modal',title:(isEdit?'Редактировать':'Новый')+' сотрудник',body:`
    <div class="form-field"><label class="form-label">Имя</label><input class="form-input" id="u-name" value="${esc(u.name)}"></div>
    <div class="form-field"><label class="form-label">Должность</label><input class="form-input" id="u-role" value="${esc(u.role)}"></div>
    <div class="form-field"><label class="form-label">Инициалы</label><input class="form-input" id="u-init" value="${esc(u.init)}" maxlength="2"></div>
    <button class="btn" ${act('saveTeamMember',isEdit?i:null)} data-haptic="hard">💾 Сохранить</button>`});
};
window.saveTeamMember = function(i){
  const u={name:$('#u-name').value,role:$('#u-role').value,init:$('#u-init').value.toUpperCase()};
  if(!u.name){ toast('Введите имя','error'); return; }
  if(i!==null&&i!==undefined) TEAM[i]=u; else TEAM.push(u);
  saveData(); syncToFirebase();
  closePanelById('edit-modal');
  renderAdminContent();
  toast('Сохранено','success');
};
window.deleteTeamMember = function(i){
  if(!confirm('Удалить сотрудника?')) return;
  TEAM.splice(i,1); saveData(); syncToFirebase();
  renderAdminContent(); toast('Удалено','success');
};

/* ---------- CRUD: поставщики ---------- */
window.editSupplier = function(index){
  killPanelInstant('edit-supplier-modal');
  const isEdit=index!==undefined&&index!==null;
  const s=isEdit?MATRIX_DATA[index]:{supplier:'',schedule:'',items:[]};
  const itemsHtml=s.items.map((it,idx)=>`
    <div class="ing-editor"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 2rem;gap:.375rem">
      <input class="form-input" placeholder="Продукт" value="${esc(it.name)}" data-midx="${idx}" data-f="name">
      <input class="form-input" placeholder="Ед." value="${esc(it.unit)}" data-midx="${idx}" data-f="unit">
      <input class="form-input" placeholder="Лимит" type="number" value="${it.limit!==null?it.limit:''}" data-midx="${idx}" data-f="limit">
      <button class="icon-btn danger" ${act('removeRow')}>✕</button>
    </div></div>`).join('');
  openPanel({id:'edit-supplier-modal',variant:'modal',title:(isEdit?'✏️ Редактировать':'✨ Новый')+' поставщик',body:`
    <div class="form-field"><label class="form-label">Название поставщика</label><input class="form-input" id="m-supplier" value="${esc(s.supplier)}"></div>
    <div class="form-field"><label class="form-label">График доставки</label><input class="form-input" id="m-schedule" value="${esc(s.schedule)}"></div>
    <div class="form-field">
      <label class="form-label">Товары <button class="btn btn-sm btn-sec" style="margin-left:.5rem" ${act('addMatrixItem')}>+ Добавить</button></label>
      <div id="matrix-items-list">${itemsHtml}</div>
    </div>
    <button class="btn" ${act('saveSupplier',isEdit?index:null)} data-haptic="hard">💾 Сохранить</button>`});
};
window.addMatrixItem = function(){
  const list=document.getElementById('matrix-items-list');
  const idx=list.querySelectorAll('.ing-editor').length;
  list.insertAdjacentHTML('beforeend',`
    <div class="ing-editor"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 2rem;gap:.375rem">
      <input class="form-input" placeholder="Продукт" data-midx="${idx}" data-f="name" value="">
      <input class="form-input" placeholder="Ед." data-midx="${idx}" data-f="unit" value="">
      <input class="form-input" placeholder="Лимит" type="number" data-midx="${idx}" data-f="limit" value="">
      <button class="icon-btn danger" ${act('removeRow')}>✕</button>
    </div></div>`);
};
window.saveSupplier = function(index){
  const supplierName=$('#m-supplier').value, schedule=$('#m-schedule').value;
  if(!supplierName){ toast('Введите название поставщика','error'); return; }
  const items=Array.from(document.querySelectorAll('[data-midx]')).reduce((acc,el)=>{
    const idx=el.dataset.midx, f=el.dataset.f;
    acc[idx]=acc[idx]||{};
    acc[idx][f]=f==='limit'?(el.value===''?null:parseFloat(el.value)):el.value;
    return acc;
  },[]).filter(x=>x.name&&x.name.trim()!=='');
  const newSupplier={supplier:supplierName,schedule,items};
  if(index!==null&&index!==undefined) MATRIX_DATA[index]=newSupplier; else MATRIX_DATA.push(newSupplier);
  saveData(); syncToFirebase();
  closePanelById('edit-supplier-modal');
  toast('Сохранено','success');
  renderAdminContent();
};
window.deleteSupplier = function(index){
  if(!confirm('Удалить поставщика и все его товары?')) return;
  MATRIX_DATA.splice(index,1);
  saveData(); syncToFirebase();
  renderAdminContent();
  toast('Удалено','success');
};

/* ============================================================
   🚀 СТАРТ
============================================================ */
// Фикс iOS: скачок скролла при blur quantity-input
document.addEventListener('focusout', e => {
  if(e.target.classList?.contains('cart-qty-input')){
    const scroller=app.querySelector('.screen.current');
    if(!scroller) return;
    const st=scroller.scrollTop;
    requestAnimationFrame(()=>{ scroller.scrollTop=st; requestAnimationFrame(()=>scroller.scrollTop=st); });
  }
});
// Тап в верхней зоне → скролл наверх (как тап по статус-бару iOS)
document.addEventListener('touchend', e => {
  const t=e.changedTouches[0];
  if(t.clientY<80 && viewStack.length>1 && !panelStack.length){
    const scroller=app.querySelector('.screen.current');
    if(scroller){ scroller.scrollTo({top:0,behavior:'smooth'}); haptic(); }
  }
}, {passive:true});

// Домашний экран — полноценный объект стека (не рендер в контейнер)
const homeEl=document.createElement('div');
homeEl.className='screen current';
app.appendChild(homeEl);
screenStack.push(homeEl);
currentScreen=homeEl;

updateCartFab();
(async function init(){
  await loadFromFirebase();
  render();
  startFirebaseSync();
})();
</script>

const $=s=>document.querySelector(s);
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
/* Sentinel: действие получает DOM-элемент только если явно запросило */
const EL='$el';
function act(name,...args){
  return `data-action="${name}"`+(args.length?` data-args='${JSON.stringify(args).replace(/'/g,"&#39;")}'`:'');
}
/* FIX v3.1: bind к родительскому объекту — this больше не теряется */
function resolveAction(name){
  const parts=name.split('.');
  let obj=window;
  for(let i=0;i<parts.length-1;i++){ obj=obj?.[parts[i]]; }
  const fn=obj?.[parts[parts.length-1]];
  return typeof fn==='function' ? fn.bind(obj) : null;
}
function runAction(el){
  const fn=resolveAction(el.dataset.action);
  if(!fn)return;
  let args=[];
  if(el.dataset.args){try{args=JSON.parse(el.dataset.args);}catch(e){args=[];}}
  args=args.map(a=>a===EL?el:a);
  fn(...args);
}

        const target=typeof t==='string'?t:t.target;
        if(typeof t==='object'&&t.guard&&!t.guard(payload))return false;
        const prev=cur;
        cfg.states[prev]?.exit?.(payload);
        cur=target;
        cfg.states[cur]?.entry?.(payload);
        console.debug(`[SM:${cfg.id}] ${prev} →(${evt})→ ${cur}`);
        return true;
      }
    };
  }
};

/* ============================================================
   MOTION
============================================================ */
function makeSpring(response=0.4,bounce=0,mass=1){
  const zeta=Math.max(0.05,1-bounce), omega=(2*Math.PI)/response;
  const stiffness=mass*omega*omega;
  return {stiffness,damping:2*zeta*Math.sqrt(stiffness*mass),mass};
}
const Motion={
  nav:makeSpring(0.42,0),
  navCancel:makeSpring(0.4,0.12),
  navFlick:v=>makeSpring(0.4,v>600?0.1:0),
  sheetOpen:makeSpring(0.36,0.05),
  sheetSettle:v=>makeSpring(0.36,Math.abs(v)>400?0.15:0),
  sheetDismiss:makeSpring(0.34,0),
  toastIn:makeSpring(0.45,0.3),
  snackIn:makeSpring(0.4,0.2),
  gentle:makeSpring(0.4,0),
  height:makeSpring(0.38,0),
  rot:makeSpring(0.4,0.1),
  pop:makeSpring(0.35,0.5)
};
function springAnimate({from,to,velocity=0,onUpdate,onComplete,stiffness,damping,mass=1}){
  if(RM.matches){onUpdate(to,0);if(onComplete)onComplete();return{cancel(){},getVelocity:()=>0};}
  let current=from,vel=velocity,rafId=null,last=performance.now(),running=true;
  function tick(now){
    if(!running)return;
    const dt=Math.min((now-last)/1000,0.05);last=now;
    const disp=current-to;
    vel+=((-stiffness*disp)+(-damping*vel))/mass*dt;
    current+=vel*dt;
    onUpdate(current,vel);
    if(Math.abs(current-to)<0.4&&Math.abs(vel)<0.5){onUpdate(to,0);if(onComplete)onComplete();return;}
    rafId=requestAnimationFrame(tick);
  }
  rafId=requestAnimationFrame(tick);
  return{cancel(){running=false;if(rafId)cancelAnimationFrame(rafId);},getVelocity(){return vel;}};
}
function rubberband(o,d,c=0.55){return(o*d*c)/(d+c*Math.abs(o));}
function project(v,d=0.998){return(v/1000)*d/(1-d);}
function velFromHistory(h){
  const now=performance.now(),rec=h.filter(p=>now-p.t<100);
  if(rec.length<2)return 0;
  const a=rec[0],b=rec[rec.length-1],dt=b.t-a.t;
  return dt>0?(b.y-a.y)/dt*1000:0;
}
const heightMap=new WeakMap();
function springHeight(el,open){
  const st=heightMap.get(el)||{v:0,anim:null};heightMap.set(el,st);
  const cur=el.offsetHeight,target=open?el.firstElementChild.offsetHeight:0;
  st.anim?.cancel();el.style.height=cur+'px';
  if(RM.matches){el.style.height=open?'auto':'0px';el.style.opacity=open?'1':'0';return;}
  st.anim=springAnimate({from:cur,to:target,velocity:st.v,...Motion.height,
    onUpdate:(h,v)=>{st.v=v;el.style.height=h+'px';el.style.opacity=String(clamp(h/Math.max(target,cur,1),0,1));},
    onComplete:()=>{st.v=0;el.style.height=open?'auto':'0px';el.style.opacity=open?'1':'0';}});
}
const rotMap=new WeakMap();
function springRotate(el,deg){
  if(!el)return;
  let st=rotMap.get(el);
  if(!st){st={v:0,r:parseFloat(el.dataset.rot||'0'),anim:null};rotMap.set(el,st);}
  st.anim?.cancel();
  st.anim=springAnimate({from:st.r,to:deg,velocity:st.v,...Motion.rot,
    onUpdate:(r,v)=>{st.r=r;st.v=v;el.style.transform=`rotate(${r}deg)`;},
    onComplete:()=>{st.v=0;}});
}
function popEl(el,from=0.6){
  if(!el||RM.matches)return;
  springAnimate({from,to:1,velocity:0,...Motion.pop,onUpdate:s=>{el.style.transform=`scale(${s})`;},onComplete:()=>{el.style.transform='';}});
}

/* ============================================================
   TAP: мгновенный отклик на pointerdown
============================================================ */
const Tap={
  state:'Idle', el:null, id:null, x:0, y:0,
  init(){
    document.addEventListener('pointerdown',e=>{
      const el=e.target.closest('[data-action]');
      if(!el||e.button>0)return;
      if(el.matches('input,select,textarea,a'))return;
      e.preventDefault();
      this.state='Pressed';this.el=el;this.id=e.pointerId;this.x=e.clientX;this.y=e.clientY;
      el.classList.add('pressed');
      haptic(el.dataset.haptic||'light');
    },{passive:false});
    document.addEventListener('pointermove',e=>{
      if(this.state!=='Pressed'||e.pointerId!==this.id)return;
      if(Math.hypot(e.clientX-this.x,e.clientY-this.y)>12){
        this.state='Cancelled';this.el.classList.remove('pressed');
      }
    },{passive:true});
    document.addEventListener('pointerup',e=>{
      if(this.state==='Idle'||e.pointerId!==this.id)return;
      const el=this.el,wasPressed=this.state==='Pressed';
      this.state='Idle';this.el=null;
      el.classList.remove('pressed');
      if(wasPressed)runAction(el);
    });
    document.addEventListener('pointercancel',e=>{
      if(this.state==='Idle'||e.pointerId!==this.id)return;
      this.el?.classList.remove('pressed');this.state='Idle';this.el=null;
    });
    document.addEventListener('keydown',e=>{
      if(e.key!=='Enter'&&e.key!==' ')return;
      const el=document.activeElement;
      if(el?.dataset?.action){e.preventDefault();runAction(el);}
    });
  }
};

const Cart={
  listeners:[],
  onChange(fn){this.listeners.push(fn);},
  notify(){this.listeners.forEach(f=>f());},
  find(s,n){return Store.cart.find(c=>c.supplier===s&&c.name===n);},
  toggle(supplier,name){
    const ex=this.find(supplier,name);
    let added;
    if(ex){Store.cart=Store.cart.filter(c=>c!==ex);added=false;}
    else{
      const sup=Store.matrix.find(s=>s.supplier===supplier);
      const it=sup?.items.find(i=>i.name===name)||{unit:'шт',limit:1};
      Store.cart.push({supplier,name,unit:it.unit,qty:it.limit!==null?it.limit:1});
      added=true;
    }
    Store.save();this.notify();return added;
  },
  changeQty(i,d){
    if(!Store.cart[i])return;
    Store.cart[i].qty=Math.max(0.01,parseFloat((Store.cart[i].qty+d).toFixed(3)));
    Store.save();this.notify();
  },
  setQty(i,raw){
    const num=parseFloat(String(raw).replace(',','.').replace(/[^0-9.]/g,''));
    if(isNaN(num)||num<=0)Store.cart.splice(i,1);
    else Store.cart[i].qty=Math.round(num*1000)/1000;
    Store.save();this.notify();
  },
  remove(i){Store.cart.splice(i,1);Store.save();this.notify();},
  clear(){Store.cart=[];Store.save();this.notify();}
};

/* ============================================================
   NAV: единый стек + NavMachine
============================================================ */
const Nav={
  stack:[],machine:null,anim:null,liveX:0,_pending:null,
  init(){
    this.machine=SM.create({id:'Nav',initial:'Idle',states:{
      Idle:{on:{PUSH:'Pushing',POP:'Popping',GRAB:'Interactive'}},
      Pushing:{on:{PUSH_DONE:'Idle',GRAB:'Interactive'}},
      Interactive:{on:{COMMIT:'Popping',CANCEL:'Idle'}},
      Popping:{on:{POP_DONE:'Idle',GRAB:'Interactive'}}
    }});
  },
  current(){return this.stack[this.stack.length-1];},
  prev(){return this.stack[this.stack.length-2];},
  markStale(){for(let i=0;i<this.stack.length-1;i++)this.stack[i].stale=true;},
  push(view,data){
    if(data instanceof Element)data=null; // страховка
    if(!this.machine.send('PUSH'))return;
    haptic();
    const prevEl=this.current()?.el||null;
    const el=document.createElement('div');el.className='screen';
    $('#app').appendChild(el);
    this.stack.push({view,data:data??null,el,stale:false});
    render();
    const w=innerWidth;
    this.anim?.cancel();this.liveX=w;
    this.anim=springAnimate({from:w,to:0,velocity:0,...Motion.nav,
      onUpdate:x=>{this.liveX=x;applyNav(el,prevEl,x);},
      onComplete:()=>{this.anim=null;this.liveX=0;el.style.transform='';hideEl(prevEl);this.machine.send('PUSH_DONE');focusHeading(el);}});
  },
  goBack(){
    if(this.stack.length<=1)return;
    if(!this.machine.send('POP'))return;
    haptic();
    const entry=this.stack.pop();this._pending=entry;
    animatePopOut(entry.el,this.current()?.el||null,0,0);
  },
  restorePending(){
    if(this._pending){this.stack.push(this._pending);this._pending=null;}
  }
};
function hideEl(p){if(!p)return;p.style.display='none';p.style.visibility='hidden';clearEl(p);}
function showEl(p){if(!p)return;p.style.display='';p.style.visibility='';}
function clearEl(p){if(!p)return;p.style.transform='';p.style.opacity='';}
function applyNav(cur,prev,x){
  Nav.liveX=x;
  cur.style.transform=`translateX(${x}px)`;
  if(prev){
    const p=clamp(x/innerWidth,0,1.2);
    prev.style.transform=`translateX(${(p*30-30)}%)`;
    prev.style.opacity=String(Math.max(0.45,1-p*0.55));
  }
}
function animatePopOut(curEl,prevEl,from,vel){
  showEl(prevEl);
  Nav.anim?.cancel();
  Nav.anim=springAnimate({from,to:innerWidth,velocity:vel,...Motion.navFlick(vel),
    onUpdate:x=>applyNav(curEl,prevEl,x),
    onComplete:()=>{
      Nav.anim=null;Nav.liveX=0;
      curEl.remove();Nav._pending=null;clearEl(prevEl);
      Nav.machine.send('POP_DONE');
      const cur=Nav.current();
      if(cur?.stale){const st=cur.el.scrollTop;render();cur.el.scrollTop=st;cur.stale=false;}
      focusHeading(cur?.el);
    }});
}
function focusHeading(el){
  const h=el?.querySelector('h1');
  if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});}
}
/* Interactive pop gesture */
const sb={id:null,startX:0,startY:0,baseX:0,x:0,engaged:false,cur:null,prev:null,fromPop:false,history:[]};
function initSwipeBack(){
  document.addEventListener('pointerdown',e=>{
    if(Panel.count()||Nav.stack.length<=1)return;
    if(e.clientX>44)return;
    const ms=Nav.machine.state;
    if(ms!=='Idle'&&ms!=='Pushing'&&ms!=='Popping')return;
    if(ms==='Popping'&&!Nav._pending)return;
    if(Nav.anim){Nav.anim.cancel();Nav.anim=null;}
    let cur,prev,fromPop=false;
    if(ms==='Popping'){cur=Nav._pending.el;prev=Nav.current()?.el||null;fromPop=true;}
    else{cur=Nav.current().el;prev=Nav.prev()?.el||null;}
    sb.id=e.pointerId;sb.startX=e.clientX;sb.startY=e.clientY;
    sb.baseX=Nav.liveX||0;sb.x=sb.baseX;sb.engaged=false;
    sb.cur=cur;sb.prev=prev;sb.fromPop=fromPop;sb.history=[];
    showEl(prev);
    if(!Nav.machine.send('GRAB')){sb.id=null;hideEl(prev);return;}
    applyNav(cur,prev,sb.x);
  },true);
  document.addEventListener('pointermove',e=>{
    if(sb.id!==e.pointerId)return;
    const dx=e.clientX-sb.startX,dy=e.clientY-sb.startY;
    if(!sb.engaged){
      if(dx<0||(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10)){sbAbort();return;}
      if(dx>12&&Math.abs(dx)>Math.abs(dy)*1.3){
        sb.engaged=true;
        try{sb.cur.setPointerCapture(e.pointerId);}catch(_){}
      }else return;
    }
    e.preventDefault();
    sb.history.push({x:e.clientX,t:performance.now()});
    if(sb.history.length>8)sb.history.shift();
    sb.x=Math.max(0,sb.baseX+dx);
    applyNav(sb.cur,sb.prev,sb.x);
  },{passive:false});
  document.addEventListener('pointerup',e=>{if(sb.id===e.pointerId)finishSwipe();});
  document.addEventListener('pointercancel',e=>{if(sb.id===e.pointerId)sbAbort();});
}
function sbAbort(){
  if(sb.id===null)return;
  const cur=sb.cur,prev=sb.prev,x=sb.x,fromPop=sb.fromPop;
  sb.id=null;sb.engaged=false;
  Nav.machine.send('CANCEL');
  if(fromPop)Nav.restorePending();
  if(x>2){
    Nav.anim=springAnimate({from:x,to:0,velocity:0,...Motion.nav,
      onUpdate:v=>applyNav(cur,prev,v),
      onComplete:()=>{Nav.anim=null;Nav.liveX=0;clearEl(cur);if(!fromPop)hideEl(prev);else clearEl(prev);}});
  }else{clearEl(cur);if(!fromPop)hideEl(prev);else clearEl(prev);}
}
function finishSwipe(){
  const x=sb.x,cur=sb.cur,prev=sb.prev,fromPop=sb.fromPop;
  const v=velFromHistory(sb.history.map(h=>({y:h.x,t:h.t})));
  sb.id=null;sb.engaged=false;
  const commit=v>900||(v>-300&&x+project(v)>innerWidth*0.5);
  if(commit){
    if(!Nav.machine.send('COMMIT'))return;
    if(!fromPop){Nav._pending=Nav.stack.pop();}
    animatePopOut(cur,prev,x,Math.max(0,v));
  }else{
    Nav.machine.send('CANCEL');
    if(fromPop)Nav.restorePending();
    Nav.anim?.cancel();
    Nav.anim=springAnimate({from:x,to:0,velocity:v,...Motion.navCancel,
      onUpdate:vx=>applyNav(cur,prev,vx),
      onComplete:()=>{Nav.anim=null;Nav.liveX=0;clearEl(cur);if(!fromPop)hideEl(prev);else clearEl(prev);}});
  }
}

/* ============================================================
   PANEL: machine, focus, защита данных
============================================================ */
const Panel={
  stack:[],
  count(){return this.stack.length;},
  top(){return this.stack[this.stack.length-1];},
  byId(id){return this.stack.find(s=>s.id===id);},
  open(opts){
    this.killInstant(opts.id);
    const root=document.createElement('div');root.className='panel-root';
    root.innerHTML=`
      <div class="scrim"></div>
      <div class="panel panel--${opts.variant||'sheet'}" role="dialog" aria-modal="true" aria-labelledby="pt-${opts.id}" tabindex="-1">
        <div class="panel-grip">
          <div class="sheet-handle"></div>
          <div class="panel-header">
            <div class="panel-title" id="pt-${opts.id}">${opts.title}</div>
            <button class="sheet-close hit" ${act('Panel.requestClose')} aria-label="Закрыть">✕</button>
          </div>
        </div>
        <div class="panel-body">${opts.body}</div>
      </div>`;
    document.body.appendChild(root);
    const st={
      id:opts.id,root,
      panel:root.querySelector('.panel'),
      scrim:root.querySelector('.scrim'),
      H:0,y:0,anim:null,drag:null,dirty:false,
      protected:!!opts.protected,onClose:opts.onClose,
      trigger:document.activeElement,
      machine:SM.create({id:'Panel:'+opts.id,initial:'Closed',states:{
        Closed:{on:{OPEN:'Opening'}},
        Opening:{on:{OPEN_DONE:'Open',GRAB:'Dragging',CLOSE:'Closing'}},
        Open:{on:{GRAB:'Dragging',CLOSE:'Closing'}},
        Dragging:{on:{RELEASE_SETTLE:'Settling',RELEASE_DISMISS:'Closing'}},
        Settling:{on:{SETTLE_DONE:'Open',GRAB:'Dragging',CLOSE:'Closing'}},
        Closing:{on:{CLOSE_DONE:'Closed',GRAB:'Dragging'}}
      }})
    };
    st.H=st.panel.offsetHeight;st.y=st.H;
    st.panel.style.transform=`translateY(${st.H}px)`;
    this.stack.push(st);
    this._wire(st);
    st.scrim.addEventListener('pointerdown',e=>{e.preventDefault();this.tryClose(st);});
    root.addEventListener('keydown',e=>{if(e.key==='Tab')this._trap(st.panel,e);});
    root.addEventListener('input',()=>{st.dirty=true;},true);
    st.machine.send('OPEN');
    if(RM.matches){
      st.panel.style.transform='';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        root.classList.add('rm-in');st.machine.send('OPEN_DONE');this._focusIn(st);
      }));
    }else{
      requestAnimationFrame(()=>{
        st.anim=springAnimate({from:st.H,to:0,velocity:0,...Motion.sheetOpen,
          onUpdate:y=>this._setY(st,y),
          onComplete:()=>{st.anim=null;st.machine.send('OPEN_DONE');this._focusIn(st);}});
      });
    }
    if(opts.afterRender)opts.afterRender(root);
    return st;
  },
  _focusIn(st){
    const f=st.panel.querySelector('input,select,textarea,button:not(.sheet-close)');
    (f||st.panel).focus({preventScroll:true});
  },
  _trap(root,e){
    const f=[...root.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
      .filter(el=>!el.disabled&&el.offsetParent!==null);
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  },
  _setY(st,y){
    st.y=y;
    st.panel.style.transform=`translateY(${y}px)`;
    const f=clamp(1-y/st.H,0,1);
    st.scrim.style.opacity=(0.55*f).toFixed(3);
    const idx=this.stack.indexOf(st);
    const below=idx>0?this.stack[idx-1].panel:Nav.current()?.el;
    this._push(below,f);
    if(idx>1)this._push(this.stack[idx-2].panel,f*0.5);
  },
  _push(el,f){
    if(!el)return;
    if(f<=0.01){el.style.scale='';el.style.opacity='';el.style.borderRadius='';return;}
    el.style.scale=String(1-0.045*f);
    el.style.opacity=String(1-0.25*f);
    el.style.borderRadius=(16*f)+'px';
  },
  _refreshPush(){
    const st=this.top();
    if(st)this._setY(st,st.y);
    else{const s=Nav.current()?.el;if(s){s.style.scale='';s.style.opacity='';s.style.borderRadius='';}}
  },
  _wire(st){
    const grip=st.root.querySelector('.panel-grip');
    grip.addEventListener('pointerdown',e=>{
      if(e.target.closest('[data-action]'))return;
      const ms=st.machine.state;
      if(ms!=='Open'&&ms!=='Opening'&&ms!=='Settling'&&ms!=='Closing')return;
      e.preventDefault();
      try{grip.setPointerCapture(e.pointerId);}catch(_){}
      if(st.anim){st.anim.cancel();st.anim=null;}
      st.machine.send('GRAB');
      st.drag={id:e.pointerId,startY:e.clientY,baseY:st.y,history:[]};
    });
    grip.addEventListener('pointermove',e=>{
      const d=st.drag;
      if(!d||e.pointerId!==d.id||st.machine.state!=='Dragging')return;
      let y=d.baseY+(e.clientY-d.startY);
      if(y<0)y=-rubberband(-y,st.H*0.6,0.55);
      d.history.push({y:e.clientY,t:performance.now()});
      if(d.history.length>8)d.history.shift();
      this._setY(st,y);
    });
    const release=(e,cancel)=>{
      const d=st.drag;
      if(!d||e.pointerId!==d.id)return;
      st.drag=null;
      if(st.machine.state!=='Dragging')return;
      const v=cancel?0:velFromHistory(d.history);
      const dismiss=v>1100||(v>-250&&st.y+project(v)>st.H*0.45);
      if(dismiss){st.machine.send('RELEASE_DISMISS');this._animateOut(st,Math.max(0,v));}
      else{
        st.machine.send('RELEASE_SETTLE');
        st.anim=springAnimate({from:st.y,to:0,velocity:v,...Motion.sheetSettle(v),
          onUpdate:y=>this._setY(st,y),
          onComplete:()=>{st.anim=null;st.machine.send('SETTLE_DONE');}});
      }
    };
    grip.addEventListener('pointerup',e=>release(e,false));
    grip.addEventListener('pointercancel',e=>release(e,true));
  },
  requestClose(){const st=this.top();if(st)this.tryClose(st);},
  tryClose(st,force=false){
    if(st.protected&&st.dirty&&!force){
      Snackbar.show('Есть несохранённые изменения',{
        action:{label:'Закрыть без сохранения',fn:()=>this.dismiss(st,0,true)},
        duration:6000
      });
      return;
    }
    this.dismiss(st,0,force);
  },
  dismiss(st,velocity,force=false){
    if(st.protected&&st.dirty&&!force){this.tryClose(st);return;}
    const ms=st.machine.state;
    if(ms==='Closing'||ms==='Closed')return;
    st.machine.send('CLOSE');
    if(st.anim){st.anim.cancel();st.anim=null;}
    if(RM.matches){
      st.root.classList.remove('rm-in');
      setTimeout(()=>this._cleanup(st),180);
      return;
    }
    this._animateOut(st,velocity);
  },
  _animateOut(st,velocity){
    st.anim=springAnimate({from:st.y,to:st.H,velocity,...Motion.sheetDismiss,
      onUpdate:y=>this._setY(st,y),
      onComplete:()=>this._cleanup(st)});
  },
  _cleanup(st){
    st.machine.send('CLOSE_DONE');
    st.root.remove();
    const i=this.stack.indexOf(st);if(i>=0)this.stack.splice(i,1);
    this._refreshPush();
    if(st.trigger&&document.contains(st.trigger))st.trigger.focus({preventScroll:true});
    if(st.onClose)st.onClose();
  },
  killInstant(id){
    const st=this.byId(id);
    if(st){st.root.remove();const i=this.stack.indexOf(st);if(i>=0)this.stack.splice(i,1);this._refreshPush();}
  },
  updateBody(id,html){const st=this.byId(id);if(st)st.root.querySelector('.panel-body').innerHTML=html;},
  updateTitle(id,html){const st=this.byId(id);if(st)st.root.querySelector('.panel-title').innerHTML=html;}
};

function personRow(p,sub){
  const init=p.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();

async function fetchScheduleData(force=false,silent=false){
  if(isLoading)return;
  isLoading=true;
  if(!force&&scheduleData){isLoading=false;return;}
  try{
    const res=await fetch(SHEET_URL+'&t='+Date.now());
    if(!res.ok)throw new Error('Ошибка сети: '+res.status);
    const parsed=parseComplexCSV(await res.text());
    if(parsed?.locations?.length){scheduleData=parsed;if(!silent)Toast.show('Данные обновлены','success');}
    else throw new Error('Неверный формат');
  }catch(e){
    if(!scheduleData)scheduleData=DEFAULT_LOCAL_DATA;
    if(!silent)Toast.show('Нет связи с сервером. Показаны локальные данные.','error');
  }finally{isLoading=false;}
}
function parseComplexCSV(csvText){
  const rows=csvText.split('\n').map(row=>{
    const result=[];let cell='',inQ=false;
    for(let i=0;i<row.length;i++){
      const ch=row[i];
      if(ch==='"')inQ=!inQ;
      else if(ch===','&&!inQ){result.push(cell.trim());cell='';}
      else cell+=ch;
    }
    result.push(cell.trim());return result;
  }).filter(r=>r.length>2);
  if(rows.length<5)return null;
  const locations=[];let cur=null;
  for(const row of rows){
    const first=(row[0]||'').trim().toLowerCase();
    if(first.includes('итого')||first.includes('дата')||first.includes('локация')||first===''||!isNaN(first)||first.includes('вск')||first.includes('пн'))continue;
    const second=(row[1]||'').trim();
    if(second==='Должность'||second===''){
      if(row[0]&&row[0].trim()!==''&&!row[0].includes('итого')){cur={name:row[0].trim(),staff:[]};locations.push(cur);}
    }else if(cur){
      const shifts=[];
      for(let d=2;d<Math.min(row.length-2,33);d++){
        let val=row[d];if(val&&val.includes(','))val=val.replace(',','.');
        let num=parseFloat(val);if(isNaN(num))num=0;shifts.push(num);
      }
      cur.staff.push({name:row[0].trim(),role:second,shifts,total:shifts.reduce((a,b)=>a+b,0)});
    }
  }
  return locations.length?{month:'Август 2026',locations}:null;
}

        <select class="form-select" id="cl-manager">
          <option value="">-- Не выбран --</option>
          ${managers.map(m=>`<option value="${esc(m.name)}" ${manager===m.name?'selected':''}>${esc(m.name)} (${esc(m.role)})</option>`).join('')}
        </select>
        ${manager?`<div style="margin-top:var(--sp-2);font-size:var(--fs-md);color:var(--success)">✅ Ответственный: <b>${esc(manager)}</b></div>`:''}
      </div>
      <div class="mults">
        <button class="mult hit ${this.tab==='open'?'on':''}" ${act('CL.setTab','open')}>Открытие (${(saved.open||[]).length}/${CHECKLISTS.open.length})</button>
        <button class="mult hit ${this.tab==='close'?'on':''}" ${act('CL.setTab','close')}>Закрытие (${(saved.close||[]).length}/${CHECKLISTS.close.length})</button>
      </div>
      <div class="card">
        ${list.map((item,i)=>{
          const isDone=(saved[this.tab]||[]).includes(i);
          return `<button class="check-item ${isDone?'done':''}" data-check="${this.tab}-${i}" ${act('CL.toggleItem',this.loc,this.tab,i)}>
            <div class="check-box">✓</div><span class="check-label">${esc(item)}</span>
          </button>`;
        }).join('')}
      </div>`;
    document.getElementById('cl-manager').addEventListener('change',e=>this.saveManager(e.target.value));
  },
  openLoc(name){this.loc=name;this.render();},
  backLoc(){this.loc=null;this.render();},
  setTab(t){this.tab=t;this.render();},
  saveManager(name){
    const key='cl_'+new Date().toISOString().slice(0,10)+'_'+this.loc;
    const saved=JSON.parse(localStorage.getItem(key)||'{}');
    saved.manager=name;
    localStorage.setItem(key,JSON.stringify(saved));
    this.render();
  },
  toggleItem(loc,type,i){
    const key='cl_'+new Date().toISOString().slice(0,10)+'_'+loc;
    const saved=JSON.parse(localStorage.getItem(key)||'{}');
    if(!saved[type])saved[type]=[];
    const idx=saved[type].indexOf(i);
    if(idx>=0)saved[type].splice(idx,1);else saved[type].push(i);
    localStorage.setItem(key,JSON.stringify(saved));
    this.render();
    popEl(document.querySelector(`[data-check="${type}-${i}"] .check-box`),0.5);
  }
};

const Matrix={

    }).filter(Boolean);
    const listHtml=filtered.length?filtered.map(sup=>`
      <div class="supplier-block">

            return `<div class="matrix-item">
              <div class="matrix-name">${esc(it.name)}</div>
              <div class="matrix-meta">
                <span class="matrix-unit">${esc(it.unit)}</span>

                  ${act('Matrix.toggle',sup.supplier,it.name)}>${inCart?'✓':'+'}</button>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`).join(''):'<div class="card" style="text-align:center;color:var(--text-2)">Ничего не найдено 🔍</div>';

/* ---------- Корзина ---------- */
const CartUI={
  bodyHtml(){
    const grouped={};
    Store.cart.forEach((c,i)=>{(grouped[c.supplier]=grouped[c.supplier]||[]).push({...c,idx:i});});
    return Object.entries(grouped).map(([sup,items])=>`
      <div style="margin-bottom:var(--sp-4)">
        <div class="loc-section" style="margin-top:var(--sp-2)">${esc(sup)}</div>
        ${items.map(it=>`
          <div class="cart-item">
            <div class="cart-name"><div class="ellipsis">${esc(it.name)}</div><span class="cart-supplier">${esc(it.unit)}</span></div>
            <div class="cart-qty-wrap">
              <button class="cart-qty-btn hit" ${act('CartUI.changeQty',it.idx,-1)} aria-label="Уменьшить: ${esc(it.name)}">−</button>
              <input class="cart-qty-input" type="text" inputmode="decimal" data-idx="${it.idx}" value="${it.qty}" aria-label="Количество: ${esc(it.name)}">
              <button class="cart-qty-btn hit" ${act('CartUI.changeQty',it.idx,1)} aria-label="Увеличить: ${esc(it.name)}">+</button>
            </div>
            <button class="icon-btn danger hit" style="width:2rem;height:2rem" ${act('CartUI.deleteItem',it.idx)} aria-label="Удалить: ${esc(it.name)}">✕</button>
          </div>`).join('')}
      </div>`).join('')+`
      <button class="btn" ${act('CartUI.copy')} data-haptic="hard" style="margin-top:var(--sp-2)">📋 Скопировать заявку</button>
      <button class="btn btn-sec" ${act('CartUI.clear')}>🗑 Очистить</button>`;
  },
  wire(root){
    (root||document).querySelectorAll('.cart-qty-input').forEach(inp=>{
      inp.addEventListener('focus',()=>inp.select());
      inp.addEventListener('change',()=>Cart.setQty(parseInt(inp.dataset.idx),inp.value));
    });
  },
  open(){
    const st=Panel.byId('cart');
    if(st){
      Panel.updateTitle('cart',`📋 Заявка (${Store.cart.length})`);
      Panel.updateBody('cart',this.bodyHtml());
      this.wire(st.root);
    }else{
      Panel.open({id:'cart',variant:'sheet',title:`📋 Заявка (${Store.cart.length})`,body:this.bodyHtml(),afterRender:r=>this.wire(r)});
    }
  },
  changeQty(i,d){Cart.changeQty(i,d);},
  deleteItem(i){
    Cart.remove(i);
    if(!Store.cart.length){const st=Panel.byId('cart');if(st)Panel.dismiss(st,0,true);}
  },
  clear(){
    Cart.clear();
    const st=Panel.byId('cart');if(st)Panel.dismiss(st,0,true);
  },
  copy(){
    if(!Store.cart.length){Toast.show('Корзина пуста','error');return;}
    const date=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    const grouped={};
    Store.cart.forEach(c=>{(grouped[c.supplier]=grouped[c.supplier]||[]).push(c);});
    let text=`📋 ЗАЯВКА НА ПОСТАВКУ\n${date}\n\n`;
    for(const [sup,items] of Object.entries(grouped)){
      text+=`📦 ${sup}\n`;
      items.forEach(it=>{text+=`• ${it.name} — ${it.qty} ${it.unit}\n`;});
      text+='\n';
    }
    text+='—\nОтправлено из ШефБук';
    if(navigator.clipboard?.writeText){
      navigator.clipboard.writeText(text)
        .then(()=>Toast.show('Скопировано! Вставьте в заметки','success'))
        .catch(()=>fallbackCopy(text));
    }else fallbackCopy(text);
  },
  refresh(){
    updateCartFab();
    const st=Panel.byId('cart');
    if(st){
      Panel.updateTitle('cart',`📋 Заявка (${Store.cart.length})`);
      if(Store.cart.length){Panel.updateBody('cart',this.bodyHtml());this.wire(st.root);}
      else Panel.dismiss(st,0,true);
    }
  }
};
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');Toast.show('Скопировано! Вставьте в заметки','success');}
  catch{Toast.show('Не удалось скопировать','error');}
  ta.remove();
}
let fabShown=false;
const cartFab=document.createElement('button');
cartFab.className='cart-fab';cartFab.style.display='none';
cartFab.setAttribute('data-action','CartUI.open');
cartFab.setAttribute('data-haptic','hard');
cartFab.setAttribute('aria-label','Корзина');
cartFab.innerHTML='<span>📋</span>';
document.body.appendChild(cartFab);
function updateCartFab(){
  if(Store.cart.length>0){
    cartFab.style.display='flex';
    let badge=cartFab.querySelector('.cart-badge');
    if(!badge){badge=document.createElement('span');badge.className='cart-badge';cartFab.appendChild(badge);}
    badge.textContent=Store.cart.length;
    if(!fabShown){fabShown=true;popEl(cartFab,0.4);}
  }else{cartFab.style.display='none';fabShown=false;}
}

    const isEdit=i!==undefined&&i!==null;
    const u=isEdit?Store.team[i]:{name:'',role:'',init:'??'};
    Panel.open({id:'edit-modal',variant:'modal',protected:true,title:(isEdit?'Редактировать':'Новый')+' сотрудник',
      body:`
        <div class="form-field"><label class="form-label" for="u-name">Имя</label><input class="form-input" id="u-name" value="${esc(u.name)}"></div>
        <div class="form-field"><label class="form-label" for="u-role">Должность</label><input class="form-input" id="u-role" value="${esc(u.role)}"></div>
        <div class="form-field"><label class="form-label" for="u-init">Инициалы</label><input class="form-input" id="u-init" value="${esc(u.init)}" maxlength="2"></div>
        <button class="btn" ${act('Admin.saveTeamMember',isEdit?i:null)} data-haptic="hard">💾 Сохранить</button>`});
  },
  saveTeamMember(i){
    const u={name:$('#u-name').value,role:$('#u-role').value,init:$('#u-init').value.toUpperCase()};
    if(!u.name){Toast.show('Введите имя','error');return;}
    if(i!==null&&i!==undefined)Store.team[i]=u;else Store.team.push(u);
    Store.save();FB.sync();
    Panel.dismiss(Panel.byId('edit-modal'),0,true);
    this.renderContent();Toast.show('Сохранено','success');
  },
  deleteTeamMember(i){
    const [removed]=Store.team.splice(i,1);
    Store.save();FB.sync();this.renderContent();
    Snackbar.show(`Удалено: ${removed.name}`,{action:{label:'Отменить',fn:()=>{
      Store.team.splice(i,0,removed);Store.save();FB.sync();this.renderContent();
    }}});
  },
  editSupplier(index){
    Panel.killInstant('edit-supplier-modal');
    const isEdit=index!==undefined&&index!==null;
    const s=isEdit?Store.matrix[index]:{supplier:'',schedule:'',items:[]};
    Panel.open({id:'edit-supplier-modal',variant:'modal',protected:true,
      title:(isEdit?'✏️ Редактировать':'✨ Новый')+' поставщик',
      body:`
        <div class="form-field"><label class="form-label" for="m-supplier">Название поставщика</label><input class="form-input" id="m-supplier" value="${esc(s.supplier)}"></div>
        <div class="form-field"><label class="form-label" for="m-schedule">График доставки</label><input class="form-input" id="m-schedule" value="${esc(s.schedule)}"></div>
        <div class="form-field">
          <label class="form-label">Товары <button class="btn btn-sm btn-sec" style="margin-left:var(--sp-2)" ${act('Admin.addMatrixItem')}>+ Добавить</button></label>
          <div id="matrix-items-list">${s.items.map((it,idx)=>supplierItemRow(it,idx)).join('')}</div>
        </div>
        <button class="btn" ${act('Admin.saveSupplier',isEdit?index:null)} data-haptic="hard">💾 Сохранить</button>`});
  },
  addMatrixItem(){
    const list=document.getElementById('matrix-items-list');
    list.insertAdjacentHTML('beforeend',supplierItemRow({name:'',unit:'',limit:null},list.querySelectorAll('.ing-editor').length));
  },
  saveSupplier(index){
    const supplierName=$('#m-supplier').value,schedule=$('#m-schedule').value;
    if(!supplierName){Toast.show('Введите название поставщика','error');return;}
    const items=Array.from(document.querySelectorAll('[data-midx]')).reduce((acc,el)=>{
      const idx=el.dataset.midx,f=el.dataset.f;
      acc[idx]=acc[idx]||{};
      acc[idx][f]=f==='limit'?(el.value===''?null:parseFloat(el.value)):el.value;
      return acc;
    },[]).filter(x=>x.name&&x.name.trim()!=='');
    const ns={supplier:supplierName,schedule,items};
    if(index!==null&&index!==undefined)Store.matrix[index]=ns;else Store.matrix.push(ns);
    Store.save();FB.sync();
    Panel.dismiss(Panel.byId('edit-supplier-modal'),0,true);
    Toast.show('Сохранено','success');
    this.renderContent();
  },
  deleteSupplier(index){
    const [removed]=Store.matrix.splice(index,1);
    Store.save();FB.sync();this.renderContent();
    Snackbar.show(`Удалено: ${removed.supplier}`,{action:{label:'Отменить',fn:()=>{
      Store.matrix.splice(index,0,removed);Store.save();FB.sync();this.renderContent();
    }}});
  }
};
function ingrRow(i,idx){
  return `<div class="ing-editor"><div style="display:grid;grid-template-columns:1fr 4.375rem 4.375rem 2rem;gap:var(--sp-1)">
    <input class="form-input" placeholder="Продукт" aria-label="Продукт" data-ing="${idx}" data-f="name" value="${esc(i[0]||'')}">
    <input class="form-input" placeholder="Брутто" aria-label="Брутто" type="number" data-ing="${idx}" data-f="brutto" value="${i[1]||0}">
    <input class="form-input" placeholder="Нетто" aria-label="Нетто" type="number" data-ing="${idx}" data-f="netto" value="${i[2]||0}">
    <button class="icon-btn danger hit" ${act('Admin.removeRow',EL)} aria-label="Удалить строку">✕</button>
  </div></div>`;
}
function stepRow(s,idx){
  return `<div style="display:flex;gap:var(--sp-1);margin-bottom:var(--sp-2);align-items:flex-start">
    <textarea class="form-textarea" data-step="${idx}" placeholder="Шаг ${idx+1}" aria-label="Шаг ${idx+1}" style="flex:1;min-height:2.625rem">${esc(s||'')}</textarea>
    <button class="icon-btn danger hit" ${act('Admin.removeRow',EL)} aria-label="Удалить шаг">✕</button>
  </div>`;
}
function supplierItemRow(it,idx){
  return `<div class="ing-editor"><div style="display:grid;grid-template-columns:2fr 1fr 1fr 2rem;gap:var(--sp-1)">
    <input class="form-input" placeholder="Продукт" aria-label="Продукт" value="${esc(it.name)}" data-midx="${idx}" data-f="name">
    <input class="form-input" placeholder="Ед." aria-label="Единица" value="${esc(it.unit)}" data-midx="${idx}" data-f="unit">
    <input class="form-input" placeholder="Лимит" aria-label="Лимит" type="number" value="${it.limit!==null?it.limit:''}" data-midx="${idx}" data-f="limit">
    <button class="icon-btn danger hit" ${act('Admin.removeRow',EL)} aria-label="Удалить товар">✕</button>
  </div></div>`;
}

/* ============================================================
   ГЛОБАЛЬНЫЕ ОБРАБОТЧИКИ
============================================================ */
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(Panel.count())Panel.requestClose();
    else if(Nav.stack.length>1)Nav.goBack();
  }
});
document.addEventListener('focusout',e=>{
  if(e.target.classList?.contains('cart-qty-input')){
    const scroller=Nav.current()?.el;
    if(!scroller)return;
    const st=scroller.scrollTop;
    requestAnimationFrame(()=>{scroller.scrollTop=st;requestAnimationFrame(()=>scroller.scrollTop=st);});
  }
});
document.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  if(t.clientY<80&&Nav.stack.length>1&&!Panel.count()){
    const scroller=Nav.current()?.el;
    if(scroller){scroller.scrollTo({top:0,behavior:'smooth'});haptic();}
  }
},{passive:true});
window.addEventListener('storage',()=>{
  Store.load();
  CartUI.refresh();
  render();
});

/* ============================================================
   СТАРТ
============================================================ */
Nav.init();
Tap.init();
initSwipeBack();
Cart.onChange(()=>{updateCartFab();CartUI.refresh();});
Store.load();
const homeEl=document.createElement('div');homeEl.className='screen';
$('#app').appendChild(homeEl);
Nav.stack.push({view:'home',data:null,el:homeEl,stale:false});
updateCartFab();
(async function init(){
  await FB.load();
  render();
})();
</script>
</body>
</html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
:root {
    --bg-dark: #05060A;
    --bg-gradient: radial-gradient(circle at 10% 10%, rgba(79, 107, 255, 0.15) 0%, transparent 40%),
                   radial-gradient(circle at 90% 90%, rgba(79, 107, 255, 0.1) 0%, transparent 40%),
                   linear-gradient(180deg, #0A0E1A 0%, #05060A 100%);
    --glass-bg: rgba(17, 24, 39, 0.65);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --text-main: #F3F4F6;
    --text-muted: #9CA3AF;
    --accent: #4F6BFF;
    --accent-glow: rgba(79, 107, 255, 0.5);
    --success: #10B981;
    --danger: #EF4444;
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100dvh;
    padding: calc(var(--safe-top) + 10px) 16px calc(var(--safe-bottom) + 20px);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

h1 { font-weight: 800; font-size: 28px; margin-bottom: 20px; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
h2 { font-weight: 700; font-size: 20px; margin: 24px 0 14px; letter-spacing: -0.3px; }

/* Glass Cards */
.card, .tile, .recipe, .item-card, .modal, .day-cell {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    border-top: 1px solid var(--glass-highlight);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

/* Grid & Tiles */
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.tile {
    padding: 20px 16px;
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    width: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
}
.tile:active { transform: scale(0.96); background: rgba(17, 24, 39, 0.8); }
.tile-emoji { font-size: 32px; margin-bottom: 10px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3)); }
.tile-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.tile-desc { font-size: 13px; color: var(--text-muted); }

/* Buttons */
.btn {
    display: block; width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--accent), #3b5bdb);
    color: #fff; border: none; border-radius: 16px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    margin-bottom: 12px; text-align: center;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.97); box-shadow: 0 2px 8px var(--accent-glow); }
.btn-sec {
    background: rgba(255,255,255,0.05); color: var(--text-main);
    border: 1px solid var(--glass-border); box-shadow: none;
}
.btn-sm { padding: 10px 16px; font-size: 14px; width: auto; display: inline-flex; align-items: center; gap: 6px; }

.back {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; background: rgba(255,255,255,0.05);
    border-radius: 14px; color: var(--text-main);
    margin-bottom: 20px; cursor: pointer; border: 1px solid var(--glass-border);
    font-size: 15px; font-weight: 600; backdrop-filter: blur(10px);
}

/* Lists & Items */
.recipe {
    padding: 16px; margin-bottom: 10px;
    cursor: pointer; border: none; width: 100%;
    text-align: left; color: inherit; font: inherit;
    transition: background 0.2s;
}
.recipe:active { background: rgba(255,255,255,0.08); }
.recipe-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.recipe-meta { font-size: 13px; color: var(--text-muted); }

.ingredient {
    padding: 12px 0; border-bottom: 1px solid var(--glass-border);
    display: flex; justify-content: space-between; font-size: 15px;
}
.ingredient:last-child { border: none; }
.ingredient b { color: var(--accent); font-weight: 700; }

.step {
    padding: 14px; margin-bottom: 10px;
    background: rgba(255,255,255,0.03);
    border-radius: 14px; border-left: 3px solid var(--accent);
    font-size: 15px; line-height: 1.5;
}
.step-num {
    display: inline-block; width: 22px; height: 22px;
    background: rgba(79, 107, 255, 0.2); color: var(--accent);
    border-radius: 6px; text-align: center; line-height: 22px;
    font-weight: 700; font-size: 12px; margin-right: 8px;
}

/* Filters & Mults */
.mults { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.mult {
    padding: 8px 16px; background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border); border-radius: 99px;
    font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-main);
    white-space: nowrap; backdrop-filter: blur(5px);
}
.mult.on { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

/* Inputs */
.form-input, .form-textarea, .form-select, input[type="search"] {
    width: 100%; padding: 14px 16px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--glass-border);
    border-radius: 14px; color: var(--text-main);
    font-size: 16px; font-family: inherit; outline: none;
    backdrop-filter: blur(5px);
}
.form-input:focus, .form-textarea:focus, input[type="search"]:focus {
    border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79, 107, 255, 0.2);
}
.form-textarea { min-height: 80px; resize: vertical; }

/* Modal */
.modal-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    z-index: 1000;
    display: flex; align-items: flex-end; justify-content: center;
}
.modal {
    width: 100%; max-width: 600px;
    max-height: 90vh;
    display: flex; flex-direction: column;
    border-radius: 24px 24px 0 0;
    border: 1px solid var(--glass-border);
    border-bottom: none;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px; border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
}
.modal-title { font-weight: 800; font-size: 18px; }
.modal-close {
    background: rgba(255,255,255,0.1); border: none; color: var(--text-main);
    width: 32px; height: 32px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.modal-body {
    flex: 1; overflow-y: auto; padding: 20px;
    -webkit-overflow-scrolling: touch;
}

/* Admin & Items */
.item-card { padding: 14px; margin-bottom: 10px; }
.item-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item-card-title { font-weight: 700; font-size: 16px; }
.icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(255,255,255,0.08); border: none;
    color: var(--text-main); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: rgba(255,255,255,0.2); }
.icon-btn.danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

/* Toast */
.toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 20px); left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(20, 20, 20, 0.9);
    backdrop-filter: blur(10px);
    color: #fff; padding: 12px 24px; border-radius: 99px;
    font-weight: 600; font-size: 14px; opacity: 0;
    transition: all 0.3s; z-index: 2000;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Schedule Specific */
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 10px; }
.week-nav-btn {
    background: rgba(255,255,255,0.1); border: none; color: var(--text-main);
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; backdrop-filter: blur(5px);
}
.week-nav-btn:active { background: var(--accent); color: #fff; }
.week-nav-title { font-weight: 700; font-size: 16px; text-align: center; flex: 1; }

.day-cell {
    flex: 1; text-align: center; padding: 10px 4px;
    cursor: pointer; transition: all 0.2s;
    border: 1px solid transparent;
}
.day-cell.active {
    background: var(--accent); color: #fff;
    border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow);
}
.day-cell.today { border-color: var(--success); }
.day-cell .dow { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
.day-cell.active .dow { color: rgba(255,255,255,0.8); }
.day-cell .num { font-weight: 800; font-size: 18px; margin-bottom: 4px; }
.day-cell .count { font-size: 11px; color: var(--text-muted); }
.day-cell.active .count { color: rgba(255,255,255,0.9); }

/* Matrix & Supplier */
.supplier-block { margin-bottom: 24px; }
.supplier-header {
    background: rgba(79, 107, 255, 0.1);
    border-left: 3px solid var(--accent);
    padding: 14px; border-radius: 14px; margin-bottom: 12px;
    backdrop-filter: blur(5px);
}
.supplier-name { font-weight: 700; font-size: 16px; color: var(--accent); margin-bottom: 4px; }
.supplier-schedule { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
.matrix-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--glass-border);
}
.matrix-item:last-child { border: none; }
.matrix-name { font-size: 15px; font-weight: 500; flex: 1; padding-right: 10px; }
.matrix-meta { text-align: right; flex-shrink: 0; }
.matrix-unit { font-size: 11px; color: var(--text-muted); display: block; }
.matrix-limit { font-size: 13px; font-weight: 700; color: var(--success); }

/* Checklist */
.check-item {
    display: flex; align-items: center; padding: 14px 0;
    border-bottom: 1px solid var(--glass-border); cursor: pointer;
}
.check-item:last-child { border: none; }
.check-box {
    width: 24px; height: 24px; border: 2px solid var(--text-muted);
    border-radius: 7px; margin-right: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: bold; color: transparent;
    transition: all 0.2s;
}
.check-item.done .check-box {
    background: var(--success); border-color: var(--success); color: #000;
}
.check-item.done span { text-decoration: line-through; color: var(--text-muted); }

/* User & Team */
.user {
    padding: 14px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
}
.avatar {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, #60A5FA, var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #fff; flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(79, 107, 255, 0.3);
}
.user-info b { display: block; font-size: 16px; }
.user-info span { font-size: 13px; color: var(--text-muted); }

/* Utilities */
.fade { animation: fade 0.3s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.loader-inline {
    border: 3px solid rgba(255,255,255,0.1); border-left-color: var(--accent);
    border-radius: 50%; width: 32px; height: 32px;
    animation: spin 1s linear infinite; margin: 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

.refresh-btn {
    background: rgba(255,255,255,0.1); color: var(--text-main);
    border: none; padding: 8px 14px; border-radius: 12px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    backdrop-filter: blur(5px);
}
.refresh-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }

.tab-btn {
    flex: 1; padding: 12px; background: rgba(255,255,255,0.05);
    border: none; color: var(--text-muted); font-weight: 600;
    border-radius: 12px; margin-right: 6px; cursor: pointer;
    backdrop-filter: blur(5px); white-space: nowrap;
}
.tab-btn.on { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent-glow); }

/* Scrollbar hide */
::-webkit-scrollbar { width: 0px; background: transparent; }
</style>
</head>

  t.className = 'toast';
  t.textContent = msg;
  if(type === 'error') t.style.background = 'rgba(239, 68, 68, 0.9)', t.style.color = '#fff';

async function fetchScheduleData(force = false) {
    if (isLoading) return;
    isLoading = true;
    if (!force && scheduleData) { isLoading = false; return; }
    try {
        const response = await fetch(SHEET_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Ошибка сети');
        const text = await response.text();
        const parsed = parseComplexCSV(text);
        if (parsed && parsed.locations && parsed.locations.length > 0) {
            scheduleData = parsed; useLocalSchedule = false;
        } else { throw new Error('Неверный формат'); }
    } catch (e) {
        console.warn('Offline mode', e);
        if (!scheduleData) { scheduleData = DEFAULT_LOCAL_DATA; useLocalSchedule = true; }
    } finally { isLoading = false; }
}

function parseComplexCSV(csvText) {
    const rows = csvText.split('\n').map(row => {
        const result = []; let cell = ''; let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
            else cell += char;
        }
        result.push(cell.trim()); return result;
    }).filter(r => r.length > 2);
    if (rows.length < 5) return null;
    const locations = []; let currentLoc = null;
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCell = (row[0] || '').trim().toLowerCase();
        if (firstCell.includes('итого') || firstCell.includes('дата') || firstCell.includes('локация') || firstCell === '' || !isNaN(firstCell) || firstCell.includes('вск') || firstCell.includes('пн')) continue;
        const secondCell = (row[1] || '').trim();
        if (secondCell === 'Должность' || secondCell === '') {
             if (row[0] && row[0].trim() !== '' && !row[0].includes('итого')) {
                 currentLoc = { name: row[0].trim(), staff: [] }; locations.push(currentLoc);
             }
        } else if (currentLoc) {
            const name = row[0].trim(); const role = secondCell; const shifts = [];
            for (let d = 2; d < Math.min(row.length - 2, 33); d++) {
                let val = row[d]; if (val && val.includes(',')) val = val.replace(',', '.');
                let num = parseFloat(val); if (isNaN(num)) num = 0; shifts.push(num);
            }
            currentLoc.staff.push({ name, role, shifts, total: shifts.reduce((a,b)=>a+b,0) });
        }
    }
    return locations.length ? { month: 'Август 2026', locations } : null;
}

        const dayOfWeek = today.getDay();

function renderScheduleContent() {
    const source = scheduleData || DEFAULT_LOCAL_DATA;
    const today = new Date(); const currentDay = today.getDate();
    const weekDays = [];
    for(let i=0; i<7; i++){
        const d = new Date(currentWeekStart); d.setDate(currentWeekStart.getDate() + i);
        const dayNum = d.getDate(); const idx = dayNum - 1;
        const isToday = dayNum === currentDay && d.getMonth() === today.getMonth();
        const isSelected = selectedDayIndex === idx;
        let count = 0;
        if(source && source.locations) {
            source.locations.forEach(loc => loc.staff.forEach(p => { if(p.shifts && p.shifts[idx] > 0) count++; }));
        }
        weekDays.push({ dayNum, idx, isToday, isSelected, count, dowName: ['пн','вт','ср','чт','пт','сб','вск'][i] });
    }
    const endOfWeek = new Date(currentWeekStart); endOfWeek.setDate(currentWeekStart.getDate() + 6);
    const rangeTitle = `${currentWeekStart.getDate()} — ${endOfWeek.getDate()} августа`;

    let locationsWithStaff = [];
    if (selectedDayIndex !== null && source && source.locations) {
        source.locations.forEach(loc => {
            const workingToday = loc.staff.filter(p => p.shifts && p.shifts[selectedDayIndex] > 0);
            if (loc.staff.length > 0) locationsWithStaff.push({ name: loc.name, staff: loc.staff, workingToday });
        });
    }

    app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><h1 style="margin:0">${source.month||'Август 2026'}</h1><button class="refresh-btn" onclick="handleRefresh()">⟳</button></div>
    <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1);haptic()">←</button>
        <div class="week-nav-title">${rangeTitle}</div>
        <button class="week-nav-btn" onclick="changeWeek(1);haptic()">→</button>
    </div>
    <div style="text-align:center;margin-bottom:16px"><button class="btn-sm btn-sec" onclick="resetToToday();haptic()">Сегодня</button></div>
    <div style="display:flex;gap:6px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px">
      ${weekDays.map(d => `<div class="day-cell ${d.isSelected?'active':''} ${d.isToday?'today':''}" onclick="selectDay(${d.idx});haptic()"><div class="dow">${d.dowName}</div><div class="num">${d.dayNum}</div><div class="count">${d.count}</div></div>`).join('')}
    </div>
    ${selectedDayIndex !== null ? `
        <h2>Локации (${selectedDayIndex + 1} число)</h2>
        ${locationsWithStaff.length ? locationsWithStaff.map(loc => {
          const isOpen = expandedLocations.has(loc.name);
          const workCount = loc.workingToday.length;
          const sortedStaff = [...loc.staff].sort((a,b) => (b.shifts[selectedDayIndex]>0) - (a.shifts[selectedDayIndex]>0));
          return `
            <div class="card" style="padding:0;margin-bottom:12px;overflow:hidden">
              <button onclick="toggleLoc('${loc.name}');haptic()" style="width:100%;padding:16px;background:transparent;border:none;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center">
                <div><div style="font-weight:700;font-size:16px">${loc.name}</div><div style="font-size:12px;color:var(--text-muted)">👥 <span style="color:var(--accent)">${workCount}</span> из ${loc.staff.length}</div></div>
                <div style="transform:rotate(${isOpen?180:0}deg);transition:0.3s">▼</div>
              </button>
              <div style="max-height:${isOpen?'5000px':'0'};overflow:hidden;transition:0.4s">
                <div style="padding:0 16px 16px;border-top:1px solid var(--glass-border)">
                  ${sortedStaff.map(s => { const isWork = s.shifts[selectedDayIndex]>0; return `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--glass-border);opacity:${isWork?1:0.5}"><div><div style="font-weight:600">${s.name}</div><div style="font-size:12px;color:var(--text-muted)">${s.role}</div></div><div style="font-weight:700;color:var(--accent)">${isWork?s.shifts[selectedDayIndex]:'-'}</div></div>`}).join('')}
                </div>
              </div>
            </div>
          `;
        }).join('') : '<div class="card" style="text-align:center;padding:20px;color:var(--text-muted)">Нет данных</div>'}
    ` : '<div class="card" style="text-align:center;padding:20px;color:var(--text-muted)">Выберите день</div>'}
    <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}" target="_blank" class="btn btn-sec" style="margin-top:20px;text-decoration:none;text-align:center">📝 Открыть таблицу</a>
  `;
}

function changeWeek(delta) {
    const newStart = new Date(currentWeekStart); newStart.setDate(currentWeekStart.getDate() + delta*7);
    if (newStart.getMonth() !== 7) return;
    currentWeekStart = newStart;
    const end = new Date(currentWeekStart); end.setDate(end.getDate()+6);
    if (selectedDayIndex < currentWeekStart.getDate()-1 || selectedDayIndex > end.getDate()-1) selectedDayIndex = currentWeekStart.getDate()-1;
    renderScheduleContent();
}
function resetToToday() {
    const today = new Date(); const d = today.getDay(); const off = d===0?-6:1-d;
    currentWeekStart = new Date(today); currentWeekStart.setDate(today.getDate()+off);
    selectedDayIndex = today.getDate()-1; renderScheduleContent();
}
function selectDay(idx) {
    selectedDayIndex = idx;
    const d = new Date(); d.setDate(idx+1); const dw = d.getDay(); const off = dw===0?-6:1-dw;
    const ns = new Date(d); ns.setDate(d.getDate()+off);
    if (ns.getMonth() === 7) currentWeekStart = ns;
    renderScheduleContent();
}
function toggleLoc(name) { if(expandedLocations.has(name)) expandedLocations.delete(name); else expandedLocations.add(name); renderScheduleContent(); }

function renderChecklist(){
  if (!window._clLoc) {
    const source = scheduleData || DEFAULT_LOCAL_DATA;
    app.innerHTML = `<button class="back" onclick="navigate('home');haptic()">← Назад</button><h1>Чек-листы</h1><div style="display:grid;gap:12px">${source.locations.map(loc => `<button class="tile" onclick="window._clLoc='${loc.name}';renderChecklist();haptic()"><div class="tile-title">${loc.name}</div><div class="tile-desc">Открыть чек-лист</div></button>`).join('')}</div>`;
    return;
  }
  const locName = window._clLoc; const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('cl_'+today+'_'+locName) || '{}');
  const manager = saved.manager || '';
  const doneOpen = (saved.open||[]).length; const doneClose = (saved.close||[]).length;
  
  let allLocStaff = [];
  const source = scheduleData || DEFAULT_LOCAL_DATA;
  if(source && source.locations) {
      const locData = source.locations.find(l => l.name === locName);
      if(locData) allLocStaff = locData.staff;
  }
  if (!allLocStaff.length) allLocStaff = TEAM;
  const managers = allLocStaff.filter(p => p.role && (p.role.includes('Су-шеф') || p.role.includes('ИО') || p.role.includes('Верховный')));

  app.innerHTML = `
    <button class="back" onclick="window._clLoc=null;renderChecklist();haptic()">← Назад</button>
    <h1>${locName}</h1>
    <div class="card" style="padding:16px;margin-bottom:20px">
      <div style="font-size:12px;color:var(--text-muted);text-transform:uppercase;font-weight:700;margin-bottom:8px">Ответственный</div>
      <select class="form-select" onchange="saveManager('${locName}', this.value);haptic()">
        <option value="">-- Не выбран --</option>
        ${managers.length ? managers.map(m => `<option value="${m.name}" ${manager===m.name?'selected':''}>${m.name} (${m.role})</option>`).join('') : '<option disabled>Нет сотрудников</option>'}
      </select>
      ${manager ? `<div style="margin-top:10px;font-size:13px;color:var(--success)">✅ <b>${manager}</b></div>` : ''}
    </div>
    <div class="mults">
      <button class="mult ${!window._clTab||window._clTab==='open'?'on':''}" onclick="window._clTab='open';renderChecklist()">Открытие (${doneOpen}/${CHECKLISTS.open.length})</button>
      <button class="mult ${window._clTab==='close'?'on':''}" onclick="window._clTab='close';renderChecklist()">Закрытие (${doneClose}/${CHECKLISTS.close.length})</button>
    </div>
    <div class="card" style="padding:0 16px">
      ${(window._clTab==='close'?CHECKLISTS.close:CHECKLISTS.open).map((item,i) => {
        const k = window._clTab==='close'?'close':'open'; const isDone = (saved[k]||[]).includes(i);
        return `<div class="check-item ${isDone?'done':''}" onclick="toggleCheckItem('${locName}','${k}',${i});haptic()"><div class="check-box">✓</div><span>${item}</span></div>`;
      }).join('')}
    </div>
  `;
}
window.saveManager = function(loc, name){ const k='cl_'+new Date().toISOString().slice(0,10)+'_'+loc; const s=JSON.parse(localStorage.getItem(k)||'{}'); s.manager=name; localStorage.setItem(k,JSON.stringify(s)); renderChecklist(); };
window.toggleCheckItem = function(loc, type, i){ const k='cl_'+new Date().toISOString().slice(0,10)+'_'+loc; const s=JSON.parse(localStorage.getItem(k)||'{}'); if(!s[type])s[type]=[]; const idx=s[type].indexOf(i); if(idx>=0)s[type].splice(idx,1);else s[type].push(i); localStorage.setItem(k,JSON.stringify(s)); renderChecklist(); };

function renderTeam(){
  const user = tg?.initDataUnsafe?.user;
  const source = scheduleData || DEFAULT_LOCAL_DATA;
  
  let html = `<button class="back" onclick="navigate('home');haptic()">← Назад</button><h1>Команда</h1>`;
  if(user) html += `<div class="user" style="background:rgba(79,107,255,0.1);border:1px solid var(--accent)"><div class="avatar">${user.first_name[0]}</div><div class="user-info"><b>${user.first_name}</b><span>Вы</span></div></div>`;

  if(source && source.locations) {
      source.locations.forEach(loc => {
          if(loc.staff && loc.staff.length) {
              html += `<h2>${loc.name}</h2>`;
              loc.staff.forEach(u => {
                  html += `<div class="user"><div class="avatar">${u.name.charAt(0)}</div><div class="user-info"><b>${u.name}</b><span>${u.role}</span></div></div>`;
              });
          }
      });
  } else {
      TEAM.forEach(u => html += `<div class="user"><div class="avatar">${u.init}</div><div class="user-info"><b>${u.name}</b><span>${u.role}</span></div></div>`);
  }
  app.innerHTML = html;
}

function renderMatrix(){
  window._matrixQ = window._matrixQ || '';
  const q = window._matrixQ.toLowerCase();
  const filtered = MATRIX_DATA.map(sup => {
    const items = sup.items.filter(it => it.name.toLowerCase().includes(q));
    if(sup.supplier.toLowerCase().includes(q) || items.length) return {...sup, items: items.length ? items : sup.items};
    return null;
  }).filter(s => s);

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Матрица заявок</h1>
    <input type="search" id="matrix-search-input" placeholder="🔍 Продукт или поставщик..." value="${window._matrixQ}" style="margin-bottom:16px">
    <div id="matrix-list-container" style="padding-bottom:20px"></div>
  `;
  
  renderMatrixList(filtered);
  
  const input = document.getElementById('matrix-search-input');
  input.addEventListener('input', (e) => {
      window._matrixQ = e.target.value;
      const q = window._matrixQ.toLowerCase();
      const filtered = MATRIX_DATA.map(sup => {
        const items = sup.items.filter(it => it.name.toLowerCase().includes(q));
        if(sup.supplier.toLowerCase().includes(q) || items.length) return {...sup, items: items.length ? items : sup.items};
        return null;
      }).filter(s => s);
      renderMatrixList(filtered);
  });
}

window.renderMatrixList = function(data) {
    const container = document.getElementById('matrix-list-container');
    if(!container) return;
    container.innerHTML = data.length ? data.map(sup => `
      <div class="supplier-block">
        <div class="supplier-header"><div class="supplier-name">${sup.supplier}</div><div class="supplier-schedule">🕒 ${sup.schedule}</div></div>
        <div class="card" style="padding:10px 16px">
          ${sup.items.map(it => `<div class="matrix-item"><div class="matrix-name">${it.name}</div><div class="matrix-meta"><span class="matrix-unit">${it.unit}</span>${it.limit!==null?`<span class="matrix-limit">Макс: ${it.limit}</span>`:''}</div></div>`).join('')}
        </div>
      </div>
    `).join('') : '<div class="card" style="text-align:center;padding:20px;color:var(--text-muted)">Ничего не найдено</div>';
};

/* ============================================================
   🔐 АДМИНКА
   ============================================================ */
let adminTab = 'recipes';
function openAdmin(){ showAdminModal(); }
function showAdminModal(){
  const old = document.getElementById('admin-modal'); if(old) old.remove();
  adminTab = adminTab || 'recipes';
  const modal = document.createElement('div'); modal.className = 'modal-bg'; modal.id = 'admin-modal';
  modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header"><div class="modal-title">⚙️ Редактор</div><button class="modal-close" onclick="document.getElementById('admin-modal').remove()">✕</button></div>
      <div style="display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding:0 20px;flex-shrink:0">
        <button class="tab-btn ${adminTab==='recipes'?'on':''}" onclick="adminTab='recipes';showAdminModal()">ТТК</button>
        <button class="tab-btn ${adminTab==='cats'?'on':''}" onclick="adminTab='cats';showAdminModal()">Категории</button>
        <button class="tab-btn ${adminTab==='matrix'?'on':''}" onclick="adminTab='matrix';showAdminModal()">Матрица</button>
        <button class="tab-btn ${adminTab==='news'?'on':''}" onclick="adminTab='news';showAdminModal()">Новости</button>
        <button class="tab-btn ${adminTab==='team'?'on':''}" onclick="adminTab='team';showAdminModal()">Команда</button>
      </div>
      <div id="admin-content" class="modal-body"></div>
    </div>
  `;
  document.body.appendChild(modal); renderAdminContent();
}
function renderAdminContent(){
  const c = document.getElementById('admin-content'); if(!c) return;
  if(adminTab === 'recipes'){
    c.innerHTML = `<button class="btn" onclick="editRecipe()">+ Техкарта</button>${RECIPES.map(r=>`<div class="item-card"><div class="item-card-head"><div><div class="item-card-title">${r.name}</div><div style="font-size:12px;color:var(--text-muted)">${r.cat}</div></div><div><button class="icon-btn" onclick="editRecipe(${r.id})">✏️</button><button class="icon-btn danger" onclick="deleteRecipe(${r.id})">🗑</button></div></div></div>`).join('')}`;
  } else if(adminTab === 'cats'){
    c.innerHTML = `<button class="btn" onclick="addCategory()">+ Категория</button>${RECIPE_CATEGORIES.map((cat,i)=>`<div class="item-card"><div class="item-card-head"><div class="item-card-title">${cat}</div><div><button class="icon-btn" onclick="moveCat(${i},-1)">↑</button><button class="icon-btn" onclick="moveCat(${i},1)">↓</button><button class="icon-btn danger" onclick="deleteCat(${i})">🗑</button></div></div></div>`).join('')}`;
  } else if(adminTab === 'matrix'){
    c.innerHTML = `<button class="btn" onclick="editSupplier()">+ Поставщик</button>${MATRIX_DATA.map((s,i)=>`<div class="item-card"><div class="item-card-head"><div><div class="item-card-title">${s.supplier}</div><div style="font-size:12px;color:var(--text-muted)">${s.items.length} тов.</div></div><div><button class="icon-btn" onclick="editSupplier(${i})">✏️</button><button class="icon-btn danger" onclick="deleteSupplier(${i})">🗑</button></div></div></div>`).join('')}`;
  } else if(adminTab === 'news'){
    c.innerHTML = `<button class="btn" onclick="editNews()">+ Новость</button>${NEWS.map((n,i)=>`<div class="item-card"><div class="item-card-head"><div><div class="item-card-title">${n.title}</div><div style="font-size:12px;color:var(--text-muted)">${n.date}</div></div><div><button class="icon-btn" onclick="editNews(${i})">✏️</button><button class="icon-btn danger" onclick="deleteNews(${i})">🗑</button></div></div></div>`).join('')}`;
  } else if(adminTab === 'team'){
    c.innerHTML = `<button class="btn" onclick="editTeamMember()">+ Сотрудник</button>${TEAM.map((u,i)=>`<div class="item-card"><div class="item-card-head"><div><div class="item-card-title">${u.name}</div><div style="font-size:12px;color:var(--text-muted)">${u.role}</div></div><div><button class="icon-btn" onclick="editTeamMember(${i})">✏️</button><button class="icon-btn danger" onclick="deleteTeamMember(${i})">🗑</button></div></div></div>`).join('')}`;
  }
}
// Helpers Admin
window.addCategory = function(){ const n=prompt('Название:'); if(n&&!RECIPE_CATEGORIES.includes(n)){RECIPE_CATEGORIES.push(n);saveData();renderAdminContent();} };
window.moveCat = function(i,d){ const n=i+d; if(n<0||n>=RECIPE_CATEGORIES.length)return; [RECIPE_CATEGORIES[i],RECIPE_CATEGORIES[n]]=[RECIPE_CATEGORIES[n],RECIPE_CATEGORIES[i]]; saveData();renderAdminContent(); };
window.deleteCat = function(i){ if(RECIPES.some(r=>r.cat===RECIPE_CATEGORIES[i])){toast('Есть техкарты','error');return;} if(confirm('Удалить?')){RECIPE_CATEGORIES.splice(i,1);saveData();renderAdminContent();} };
window.editSupplier = function(i){
    const s = i!==undefined ? MATRIX_DATA[i] : {supplier:'',schedule:'',items:[]};
    const m = document.createElement('div'); m.className='modal-bg'; m.id='edit-modal';
    let itemsHtml = s.items.map((it,idx)=>`<div style="display:grid;grid-template-columns:2fr 1fr 1fr 30px;gap:5px;margin-bottom:8px"><input class="form-input" value="${it.name}" id="mi-n-${idx}"><input class="form-input" value="${it.unit}" id="mi-u-${idx}"><input class="form-input" type="number" value="${it.limit||''}" id="mi-l-${idx}"><button class="icon-btn danger" onclick="this.parentElement.remove()">×</button></div>`).join('');
    m.innerHTML = `<div class="modal"><div class="modal-header"><div class="modal-title">${i!==undefined?'Ред.':'Новый'} поставщик</div><button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button></div><div class="modal-body" style="padding:20px"><div class="form-field"><label class="form-label">Название</label><input class="form-input" id="ms-n" value="${s.supplier}"></div><div class="form-field"><label class="form-label">График</label><input class="form-input" id="ms-s" value="${s.schedule}"></div><label class="form-label">Товары <button class="btn-sm btn-sec" onclick="addMatItem()">+</button></label><div id="mi-list" style="margin-top:10px">${itemsHtml}</div><button class="btn" style="margin-top:20px" onclick="saveSupplier(${i!==undefined?i:'null'})">Save</button></div></div>`;
    document.body.appendChild(m);
};
window.addMatItem = function(){ const d=document.createElement('div'); d.style.cssText="display:grid;grid-template-columns:2fr 1fr 1fr 30px;gap:5px;margin-bottom:8px"; d.innerHTML=`<input class="form-input" id="mi-n-new"><input class="form-input" value="шт" id="mi-u-new"><input class="form-input" type="number" id="mi-l-new"><button class="icon-btn danger" onclick="this.parentElement.remove()">×</button>`; document.getElementById('mi-list').appendChild(d); };
window.saveSupplier = function(i){
    const n=document.getElementById('ms-n').value, s=document.getElementById('ms-s').value;
    const items=[]; document.querySelectorAll('#mi-list>div').forEach(r=>{ const inp=r.querySelectorAll('input'); if(inp[0].value) items.push({name:inp[0].value,unit:inp[1].value,limit:inp[2].value?parseFloat(inp[2].value):null}); });
    if(i!==null) MATRIX_DATA[i]={supplier:n,schedule:s,items}; else MATRIX_DATA.push({supplier:n,schedule:s,items});
    saveData(); document.getElementById('edit-modal').remove(); renderAdminContent();
};
window.deleteSupplier = function(i){ if(confirm('Удалить?')){MATRIX_DATA.splice(i,1);saveData();renderAdminContent();} };

function editRecipe(id){ /* ... стандартный код редактора рецепта ... */ const r=id?RECIPES.find(x=>x.id===id):{id:Date.now(),name:'',cat:RECIPE_CATEGORIES[0],time:'',yield:'',kcal:0,note:'',ingr:[['',0,0]],steps:['']}; const m=document.createElement('div');m.className='modal-bg';m.id='edit-modal';m.innerHTML=`<div class="modal"><div class="modal-header"><div class="modal-title">${id?'Ред.':'Новая'} ТТК</div><button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button></div><div class="modal-body" style="padding:20px"><div class="form-field"><label class="form-label">Название</label><input class="form-input" id="r-n" value="${r.name}"></div><div class="form-field"><label class="form-label">Категория</label><select class="form-select" id="r-c">${RECIPE_CATEGORIES.map(c=>`<option ${r.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div class="form-field"><label class="form-label">Время</label><input class="form-input" id="r-t" value="${r.time}"></div><div class="form-field"><label class="form-label">Выход</label><input class="form-input" id="r-y" value="${r.yield}"></div><div class="form-field"><label class="form-label">Ккал</label><input class="form-input" type="number" id="r-k" value="${r.kcal}"></div></div><button class="btn" style="margin-top:20px" onclick="saveRecipe(${id||'null'})">Save</button></div></div>`;document.body.appendChild(m);}
window.saveRecipe = function(id){ const r={id:id||Date.now(),name:$('#r-n').value,cat:$('#r-c').value,time:$('#r-t').value,yield:$('#r-y').value,kcal:parseInt($('#r-k').value),note:'',ingr:r.ingr,steps:r.steps}; if(id){const i=RECIPES.findIndex(x=>x.id===id);RECIPES[i]=r;}else{RECIPES.push(r);} saveData();document.getElementById('edit-modal').remove();renderAdminContent(); };
window.deleteRecipe = function(id){ if(confirm('Удалить?')){RECIPES=RECIPES.filter(r=>r.id!==id);saveData();renderAdminContent();} };
function editNews(i){ /* Аналогично */ }
window.saveNews = function(i){ /* Аналогично */ };
window.deleteNews = function(i){ if(confirm('Удалить?')){NEWS.splice(i,1);saveData();renderAdminContent();} };
function editTeamMember(i){ /* Аналогично */ }
window.saveTeamMember = function(i){ /* Аналогично */ };
window.deleteTeamMember = function(i){ if(confirm('Удалить?')){TEAM.splice(i,1);saveData();renderAdminContent();} };

fetchScheduleData(false);
render();

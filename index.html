<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ШефБук</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
    --bg-dark: #05060A;
    --bg-gradient: radial-gradient(circle at 10% 10%, rgba(20, 30, 60, 0.4) 0%, transparent 40%),
                   radial-gradient(circle at 90% 90%, rgba(20, 30, 60, 0.4) 0%, transparent 40%),
                   linear-gradient(180deg, #0A0E1A 0%, #05060A 100%);
    --glass-bg: rgba(20, 25, 40, 0.4);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-highlight: rgba(255, 255, 255, 0.15);
    --text-main: #F0F4FF;
    --text-muted: #8B9BB4;
    --accent: #4F6BFF;
    --accent-glow: rgba(79, 107, 255, 0.4);
    --green: #34C759;
    --red: #FF453A;
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-dark);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-main);
    height: 100dvh;
    width: 100vw;
    /* overflow: hidden;  <-- УБРАНО: Теперь body не блокирует скролл, если контент вылезает */
    -webkit-font-smoothing: antialiased;
    /* Добавлен отступ сверху для safe area, если контент все же упрется в верх */
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(20px, env(safe-area-inset-bottom));
}

/* Главный контейнер приложения */
#app {
    position: fixed;
    inset: 0;
    top: var(--safe-top);
    bottom: var(--safe-bottom);
    left: var(--safe-left);
    right: var(--safe-right);
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
}

/* Скроллбар скрыт для эстетики */
#app::-webkit-scrollbar { width: 0; }

h1 {
    font-weight: 800;
    font-size: 28px;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    padding-top: 4px;
}

h2 {
    font-weight: 700;
    font-size: 18px;
    margin: 24px 0 12px;
    color: var(--text-main);
}

/* Glass Cards */
.card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: visible; /* Важно: контент не обрезается внутри карточки */
}

/*Inset shine effect*/
.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
    opacity: 0.5;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
}

.tile {
    padding: 20px 16px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 20px;
    border: 1px solid var(--glass-border);
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    width: 100%;
    backdrop-filter: blur(10px);
    transition: transform 0.2s, background 0.2s;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.tile:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.06); }

.tile-emoji { font-size: 32px; margin-bottom: 8px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
.tile-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.tile-desc { font-size: 13px; color: var(--text-muted); }

.pulse {
    display: inline-block; width: 8px; height: 8px;
    background: var(--green); border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 10px var(--green);
    animation: blink 2s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

/* Buttons */
.btn {
    display: block; width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #3b5bdb);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 12px;
    text-align: center;
    box-shadow: 0 4px 15px var(--accent-glow);
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.98); box-shadow: 0 2px 8px var(--accent-glow); }

.btn-sec {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border: 1px solid var(--glass-border);
    box-shadow: none;
}
.btn-sec:active { background: rgba(255, 255, 255, 0.1); }

.btn-sm {
    padding: 10px 16px;
    font-size: 14px;
    width: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 12px;
}

.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    color: var(--text-main);
    margin-bottom: 16px;
    cursor: pointer;
    border: 1px solid var(--glass-border);
    font-size: 15px;
    font-weight: 600;
    backdrop-filter: blur(10px);
}
.back:active { background: rgba(255, 255, 255, 0.1); }

/* Recipe List */
.recipe {
    padding: 16px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid transparent;
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: background 0.2s, border-color 0.2s;
}
.recipe:active { background: rgba(255, 255, 255, 0.05); border-color: var(--glass-border); }
.recipe-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.recipe-meta { font-size: 13px; color: var(--text-muted); }

/* Ingredients & Steps */
.ingredient {
    padding: 12px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    justify-content: space-between;
    font-size: 15px;
}
.ingredient:last-child { border: none; }
.ingredient b { color: var(--accent); font-weight: 700; }

.step {
    padding: 14px;
    margin-bottom: 10px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 14px;
    border-left: 3px solid var(--accent);
    font-size: 15px;
    line-height: 1.5;
}
.step-num {
    display: inline-block;
    width: 22px; height: 22px;
    background: rgba(79, 107, 255, 0.15);
    color: var(--accent);
    border-radius: 6px;
    text-align: center;
    line-height: 22px;
    font-weight: 700;
    font-size: 12px;
    margin-right: 8px;
}

/* News */
.news {
    padding: 16px;
    background: rgba(79, 107, 255, 0.08);
    border-radius: 16px;
    margin-bottom: 12px;
    border-left: 3px solid var(--accent);
    border: 1px solid rgba(79, 107, 255, 0.1);
}
.news-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; color: #aebbf9; }
.news-text { font-size: 14px; color: var(--text-muted); line-height: 1.4; }
.news-date { font-size: 11px; color: var(--text-muted); margin-top: 6px; opacity: 0.7; }

/* Checklists */
.check-item {
    display: flex; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    cursor: pointer;
    min-height: 44px;
}
.check-item:last-child { border: none; }
.check-box {
    width: 24px; height: 24px;
    border: 2px solid var(--text-muted);
    border-radius: 8px;
    margin-right: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-weight: bold; color: transparent;
    transition: all 0.2s;
    background: rgba(255,255,255,0.02);
}
.check-item.done .check-box {
    background: var(--green);
    border-color: var(--green);
    color: #000;
    box-shadow: 0 0 10px rgba(52, 199, 89, 0.4);
}
.check-item.done span { text-decoration: line-through; color: var(--text-muted); }

/* KPI & Mults */
.kpi { display: flex; gap: 10px; margin-bottom: 16px; }
.kpi-box {
    flex: 1;
    padding: 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 14px;
    text-align: center;
    border: 1px solid var(--glass-border);
}
.kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-weight: 800; font-size: 16px; color: var(--text-main); }

.mults { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.mult {
    padding: 8px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--glass-border);
    border-radius: 99px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
}
.mult.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
}

/* User & Team */
.user {
    padding: 16px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 16px;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    border: 1px solid var(--glass-border);
}
.avatar {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #8CA6FF, var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(79, 107, 255, 0.3);
}
.user-info b { display: block; font-size: 16px; color: var(--text-main); }
.user-info span { font-size: 13px; color: var(--text-muted); }

.note {
    padding: 16px;
    background: rgba(52, 199, 89, 0.1);
    border-left: 3px solid var(--green);
    border-radius: 12px;
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.5;
    color: #aef5c7;
}

/* Admin Button */
.admin-btn {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 10px);
    right: calc(var(--safe-right) + 16px);
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--accent-glow);
    font-size: 22px;
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px);
}
.admin-btn:active { transform: scale(0.9); }

/* Modal */
.modal-bg {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    /* Добавлен отступ сверху для safe area */
    padding-top: max(20px, env(safe-area-inset-top));
}
.modal {
    background: #0A0E1A;
    border-radius: 24px 24px 0 0;
    width: 100%;
    /* ИЗМЕНЕНО: Увеличено max-height и добавлен fallback для safe area */
    max-height: calc(95dvh - var(--safe-top) - var(--safe-bottom));
    display: flex; flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border-top: 1px solid var(--glass-border);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

.modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
}
.modal-title { font-weight: 800; font-size: 20px; }
.modal-close {
    background: rgba(255,255,255,0.1); border: none; color: #fff;
    width: 36px; height: 36px; border-radius: 12px;
    cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
}
.modal-body {
    flex: 1; 
    overflow-y: auto; 
    padding: 20px;
    /* Учитываем безопасную зону снизу */
    padding-bottom: calc(var(--safe-bottom) + 20px);
}

/* Forms */
.form-field { margin-bottom: 16px; }
.form-label {
    display: block; font-size: 12px; color: var(--text-muted);
    margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
}
.form-input, .form-textarea, .form-select {
    width: 100%; padding: 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    color: var(--text-main);
    font-size: 16px; font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.08);
}
.form-textarea { min-height: 80px; resize: vertical; }

/* Item Cards (Admin) */
.item-card {
    padding: 16px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px;
    margin-bottom: 10px;
    border: 1px solid var(--glass-border);
}
.item-card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item-card-title { font-weight: 700; font-size: 16px; }
.icon-btn {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(255,255,255,0.08);
    border: none; color: var(--text-main);
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
}
.icon-btn:active { background: rgba(255,255,255,0.15); }
.icon-btn.danger { background: rgba(255, 69, 58, 0.15); color: var(--red); }

/* Toast */
.toast {
    position: fixed; bottom: calc(var(--safe-bottom) + 30px); left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(20, 25, 40, 0.9);
    backdrop-filter: blur(20px);
    color: #fff;
    padding: 14px 24px;
    border-radius: 99px;
    font-weight: 600; font-size: 15px;
    opacity: 0; transition: all 0.3s;
    z-index: 300;
    border: 1px solid var(--glass-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
    white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Fade Animation */
.fade { animation: fade 0.3s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* Loader */
.loader-inline {
    border: 3px solid rgba(255,255,255,0.1);
    border-left-color: var(--accent);
    border-radius: 50%;
    width: 28px; height: 28px;
    animation: spin 1s linear infinite;
    margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Refresh Btn */
.refresh-btn {
    background: rgba(255,255,255,0.05);
    color: var(--text-main);
    border: 1px solid var(--glass-border);
    padding: 8px 14px;
    border-radius: 12px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.2s;
}
.refresh-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

/* Tabs */
.tab-btn {
    flex: 1; padding: 12px;
    background: rgba(255,255,255,0.03);
    border: none; color: var(--text-muted);
    font-weight: 600; border-radius: 12px;
    margin-right: 6px; cursor: pointer;
    transition: all 0.2s;
}
.tab-btn.on {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 12px var(--accent-glow);
}

/* Matrix Styles */
.supplier-block { margin-bottom: 24px; }
.supplier-header {
    background: rgba(79, 107, 255, 0.08);
    border-left: 3px solid var(--accent);
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 12px;
    border: 1px solid rgba(79, 107, 255, 0.1);
}
.supplier-name { font-weight: 800; font-size: 16px; color: #aebbf9; margin-bottom: 4px; }
.supplier-schedule { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
.matrix-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.matrix-item:last-child { border-bottom: none; }
.matrix-name { font-size: 15px; font-weight: 500; flex: 1; padding-right: 10px; }
.matrix-meta { text-align: right; flex-shrink: 0; }
.matrix-unit { font-size: 11px; color: var(--text-muted); display: block; }
.matrix-limit { font-size: 13px; font-weight: 700; color: var(--green); text-shadow: 0 0 10px rgba(52, 199, 89, 0.3); }

/* Schedule Navigation */
.week-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 10px;
}
.week-nav-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    color: var(--text-main);
    width: 40px; height: 40px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px;
    transition: all 0.2s;
}
.week-nav-btn:active { background: var(--accent); color: #fff; border-color: var(--accent); }
.week-nav-title { font-weight: 700; font-size: 15px; text-align: center; flex: 1; }

.day-cell {
    flex: 1; text-align: center;
    padding: 10px 4px;
    background: rgba(255,255,255,0.03);
    border-radius: 14px;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    min-height: 70px;
    display: flex; flex-direction: column; justify-content: center;
}
.day-cell.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 15px var(--accent-glow);
}
.day-cell.today { border-color: var(--green); }
.day-cell .dow { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
.day-cell.active .dow { color: rgba(255,255,255,0.8); }
.day-cell .num { font-weight: 800; font-size: 18px; margin-bottom: 2px; }
.day-cell .count { font-size: 11px; color: var(--text-muted); }
.day-cell.active .count { color: #fff; }

/* Location Accordion in Schedule */
.loc-card {
    background: rgba(255,255,255,0.02);
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: visible; /* ИЗМЕНЕНО: Разрешаем контенту выходить за границы при открытии */
    border: 1px solid var(--glass-border);
}
.loc-header {
    width: 100%; padding: 16px;
    background: transparent; border: none;
    color: inherit; text-align: left;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 16px; font-weight: 600;
    cursor: pointer;
}
.loc-content {
    max-height: 0; 
    overflow: hidden; /* Скрыто по умолчанию */
    transition: max-height 0.4s ease-out;
    background: rgba(0,0,0,0.2);
}
.loc-content-inner { padding: 0 16px 16px; }
.loc-arrow {
    width: 24px; height: 24px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.3s;
}
.loc-open .loc-arrow { transform: rotate(180deg); }
.loc-open .loc-content { max-height: 2000px; /* Достаточно большое значение */ }

/* Search Input Stable */
.search-container {
    position: relative;
    margin-bottom: 16px;
}
.search-input {
    width: 100%; padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    color: var(--text-main);
    font-size: 16px;
    outline: none;
}
.search-input:focus {
    border-color: var(--accent);
    background: rgba(255,255,255,0.08);
}
</style>
</head>
<body>

<div id="app"></div>
<button id="admin-btn" class="admin-btn" onclick="haptic('hard');openAdmin()">✏️</button>

<script>
/* ============================================================
   🔗 НАСТРОЙКИ И ДАННЫЕ
   ============================================================ */
const SHEET_ID = '1qwcKV8_0bmbj1OSLPPMmTHke6t2U8fFz94xHE6iriIk';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;

let RECIPE_CATEGORIES = JSON.parse(localStorage.getItem('chef_recipe_cats')) || ['Горячее', 'Салаты', 'Десерты', 'Напитки', 'Заготовки'];

function haptic(kind){ try{ if(tg?.HapticFeedback){ tg.HapticFeedback.impactOccurred(kind==='hard'?'medium':'light'); } }catch(e){} }

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if(type === 'error') { t.style.background = 'rgba(255, 69, 58, 0.9)'; t.style.color = '#fff'; }
  if(type === 'success') { t.style.background = 'rgba(52, 199, 89, 0.9)'; t.style.color = '#000'; }
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'), 10);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2500);
}

function navigate(view, data){
  currentView = view;

  render();
  app.scrollTop = 0;
}

  else if(currentView === 'matrix') renderMatrix();
  app.classList.add('fade');
  setTimeout(()=>app.classList.remove('fade'), 300);
}

window.setTtkCat = function(cat) {
    window._ttkCat = cat;
    // Обновляем кнопки визуально
    document.querySelectorAll('.mult').forEach(b => {
        b.classList.toggle('on', b.textContent === cat);
    });
    updateTtkList();
    haptic();
};

function updateTtkList() {
    const q = window._ttkQ.toLowerCase();
    const items = RECIPES.filter(r => 
        (window._ttkCat === 'Все' || r.cat === window._ttkCat) &&
        (!q || r.name.toLowerCase().includes(q))
    );
    
    const container = document.getElementById('ttk-list-container');
    if(!container) return;
    
    container.innerHTML = items.length ? items.map(r => `
      <button class="recipe" onclick="navigate('recipe',${r.id});haptic()">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">${r.cat} · ${r.time} · ${r.yield}</div>
      </button>
    `).join('') : '<div class="card" style="text-align:center;color:var(--text-muted)">Ничего не найдено 🔍</div>';
}

// --- SCHEDULE ---
async function fetchScheduleData(force = false) {
    if (isLoading) return;
    isLoading = true;
    if (!force && scheduleData) { isLoading = false; return; }
    try {
        const response = await fetch(SHEET_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Network error');
        const text = await response.text();
        const parsed = parseComplexCSV(text);
        if (parsed && parsed.locations && parsed.locations.length > 0) {
            scheduleData = parsed; useLocalSchedule = false;
        } else { throw new Error('Bad format'); }
    } catch (e) {
        console.warn(e);
        if (!scheduleData) { scheduleData = DEFAULT_LOCAL_DATA; useLocalSchedule = true; }
    } finally { isLoading = false; }
}

function parseComplexCSV(csvText) {
    const rows = csvText.split('\n').map(row => {
        const result = []; let cell = ''; let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') inQuotes = !inQuotes;
            else if (char === ',' && !inQuotes) { result.push(cell.trim()); cell = ''; }
            else cell += char;
        }
        result.push(cell.trim());
        return result;
    }).filter(r => r.length > 2);

    if (rows.length < 5) return null;
    const locations = []; let currentLoc = null;
    
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCell = (row[0] || '').trim().toLowerCase();
        if (firstCell.includes('итого') || firstCell.includes('дата') || firstCell.includes('локация') || firstCell === '' || !isNaN(firstCell) || firstCell.includes('вск') || firstCell.includes('пн')) continue;

        const secondCell = (row[1] || '').trim();
        if (secondCell === 'Должность' || secondCell === '') {
             if (row[0] && row[0].trim() !== '' && !row[0].includes('итого')) {
                 currentLoc = { name: row[0].trim(), staff: [] };
                 locations.push(currentLoc);
             }
        } else if (currentLoc) {
            const name = row[0].trim(); const role = secondCell; const shifts = [];
            for (let d = 2; d < Math.min(row.length - 2, 33); d++) {
                let val = row[d];
                if (val && val.includes(',')) val = val.replace(',', '.');
                let num = parseFloat(val); if (isNaN(num)) num = 0;
                shifts.push(num);
            }
            currentLoc.staff.push({ name, role, shifts, total: shifts.reduce((a,b)=>a+b,0) });
        }
    }
    return { month: 'Август 2026', locations };
}

async function renderSchedule(){
    if (!currentWeekStart) {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        currentWeekStart = new Date(today);
        currentWeekStart.setDate(today.getDate() + mondayOffset);
        selectedDayIndex = today.getDate() - 1;
    }
    
    app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1 style="margin:0">График</h1>
        <button class="refresh-btn" onclick="handleRefresh();haptic('hard')">↻</button>
    </div>
    <div class="card" style="text-align:center;padding:30px"><div class="loader-inline"></div><div style="margin-top:14px;color:var(--text-muted)">Загрузка...</div></div>
  `;
    await fetchScheduleData(true);
    renderScheduleContent();
}

function handleRefresh() { currentWeekStart = null; selectedDayIndex = null; renderSchedule(); }

function renderScheduleContent() {
    const source = scheduleData || DEFAULT_LOCAL_DATA;
    const today = new Date();
    const currentDay = today.getDate();
    
    const weekDays = [];
    for(let i=0; i<7; i++){
        const d = new Date(currentWeekStart);
        d.setDate(currentWeekStart.getDate() + i);
        const dayNum = d.getDate();
        const idx = dayNum - 1; 
        const isToday = dayNum === currentDay && d.getMonth() === today.getMonth();
        const isSelected = selectedDayIndex === idx;
        let count = 0;
        if(source && source.locations) {
            source.locations.forEach(loc => loc.staff.forEach(p => {
                if(p.shifts && p.shifts[idx] && Number(p.shifts[idx]) > 0) count++;
            }));
        }
        weekDays.push({ dayNum, idx, isToday, isSelected, count, dowName: ['пн','вт','ср','чт','пт','сб','вск'][i] });
    }

    const endOfWeek = new Date(currentWeekStart);
    endOfWeek.setDate(currentWeekStart.getDate() + 6);
    const rangeTitle = `${currentWeekStart.getDate()} — ${endOfWeek.getDate()} августа`;

    let locationsWithStaff = [];
    if (selectedDayIndex !== null && source && source.locations) {
        source.locations.forEach(loc => {
            const workingToday = loc.staff.filter(p => p.shifts && p.shifts[selectedDayIndex] && Number(p.shifts[selectedDayIndex]) > 0);
            if (loc.staff.length > 0) {
                locationsWithStaff.push({ name: loc.name, staff: loc.staff, workingToday });
            }
        });
    }

    app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h1 style="margin:0">${source.month || 'Август 2026'}</h1>
        <button class="refresh-btn" onclick="handleRefresh()">↻</button>
    </div>
    
    <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1);haptic()">←</button>
        <div class="week-nav-title">${rangeTitle}</div>
        <button class="week-nav-btn" onclick="changeWeek(1);haptic()">→</button>
    </div>
    <div style="text-align:center;margin-bottom:16px">
        <button class="btn-sm btn-sec" onclick="resetToToday();haptic()">Сегодня</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px">
      ${weekDays.map(d => `
        <div class="day-cell ${d.isSelected ? 'active' : ''} ${d.isToday ? 'today' : ''}" onclick="selectDay(${d.idx});haptic()">
          <div class="dow">${d.dowName}</div>
          <div class="num">${d.dayNum}</div>
          <div class="count">${d.count}</div>
        </div>
      `).join('')}
    </div>
    
    ${selectedDayIndex !== null ? `
        <h2>Локации (${selectedDayIndex + 1} число)</h2>
        ${locationsWithStaff.length > 0 ? locationsWithStaff.map(loc => {
          const isOpen = expandedLocations.has(loc.name);
          const workCount = loc.workingToday.length;
          const sortedStaff = [...loc.staff].sort((a,b) => {
              const aW = a.shifts && a.shifts[selectedDayIndex] > 0;
              const bW = b.shifts && b.shifts[selectedDayIndex] > 0;
              if (aW && !bW) return -1; if (!aW && bW) return 1; return 0;
          });
          return `
            <div class="loc-card ${isOpen ? 'loc-open' : ''}">
              <button class="loc-header" onclick="toggleLoc('${loc.name}');haptic()">
                <div>
                    <div style="font-size:16px;font-weight:700">${loc.name}</div>
                    <div style="font-size:12px;color:var(--text-muted)">На смене: <span style="color:var(--accent)">${workCount}</span></div>
                </div>
                <div class="loc-arrow">▼</div>
              </button>
              <div class="loc-content"><div class="loc-content-inner">
                  ${sortedStaff.map(s => {
                      const isWorking = s.shifts && s.shifts[selectedDayIndex] > 0;
                      return `<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);opacity:${isWorking?1:0.5}">
                        <div><div style="font-weight:600">${s.name}</div><div style="font-size:12px;color:var(--text-muted)">${s.role}</div></div>
                        <div style="color:${isWorking?'var(--accent)':'var(--text-muted)'};font-weight:700">${isWorking ? s.shifts[selectedDayIndex] : 'Отдых'}</div>
                      </div>`;
                  }).join('')}
              </div></div>
            </div>
          `;
        }).join('') : '<div class="card" style="text-align:center;color:var(--text-muted)">Нет данных</div>'}
    ` : '<div class="card" style="text-align:center;color:var(--text-muted)">Выберите день</div>'}
    
    <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}" target="_blank" class="btn btn-sec" style="margin-top:20px;text-decoration:none;text-align:center">📝 Открыть таблицу</a>
  `;
}

window.changeWeek = function(delta) {
    const newStart = new Date(currentWeekStart);
    newStart.setDate(currentWeekStart.getDate() + (delta * 7));
    if (newStart.getMonth() !== 7) return;
    currentWeekStart = newStart;
    const endOfWeek = new Date(currentWeekStart); endOfWeek.setDate(currentWeekStart.getDate() + 6);
    if (selectedDayIndex < currentWeekStart.getDate() - 1 || selectedDayIndex > endOfWeek.getDate() - 1) selectedDayIndex = currentWeekStart.getDate() - 1;
    renderScheduleContent();
};
window.resetToToday = function() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    currentWeekStart = new Date(today); currentWeekStart.setDate(today.getDate() + mondayOffset);
    selectedDayIndex = today.getDate() - 1;
    renderScheduleContent();
};
window.selectDay = function(idx) {
    selectedDayIndex = idx;
    const d = new Date(); d.setDate(idx + 1);
    const dayOfWeek = d.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    const newWeekStart = new Date(d); newWeekStart.setDate(d.getDate() + mondayOffset);
    if (newWeekStart.getMonth() === 7) currentWeekStart = newWeekStart;
    renderScheduleContent();
};
window.toggleLoc = function(name) {
  if (expandedLocations.has(name)) expandedLocations.delete(name);
  else expandedLocations.add(name);
  renderScheduleContent();
};

window.saveManager = function(loc, name){
  const today = new Date().toISOString().slice(0,10);
  const key = 'cl_'+today+'_'+loc;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  saved.manager = name;
  localStorage.setItem(key, JSON.stringify(saved));
  renderChecklist();
};
window.toggleCheckItem = function(loc, type, i){
  const today = new Date().toISOString().slice(0,10);
  const key = 'cl_'+today+'_'+loc;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if(!saved[type]) saved[type] = [];
  const idx = saved[type].indexOf(i);
  if(idx>=0) saved[type].splice(idx,1); else saved[type].push(i);
  localStorage.setItem(key, JSON.stringify(saved));
  renderChecklist();
};

function updateMatrixList() {
    const q = window._matrixQ.toLowerCase();
    const filtered = MATRIX_DATA.map(sup => {
        const items = sup.items.filter(it => it.name.toLowerCase().includes(q));
        if(sup.supplier.toLowerCase().includes(q) || items.length > 0) {
            return {...sup, items: items.length > 0 ? items : sup.items};
        }
        return null;
    }).filter(s => s !== null);

    const container = document.getElementById('matrix-list-container');
    if(!container) return;
    
    container.innerHTML = filtered.length > 0 ? filtered.map(sup => `
      <div class="supplier-block">
        <div class="supplier-header">

          <div class="supplier-schedule">🕒 ${sup.schedule}</div>

}

  const modal = document.createElement('div'); modal.className='modal-bg'; modal.id='edit-modal';
  modal.innerHTML = `<div class="modal"><div class="modal-header"><div class="modal-title">ТТК</div><button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button></div>
  <div class="modal-body" style="padding:20px">
    <div class="form-field"><label class="form-label">Название</label><input class="form-input" id="r-name" value="${r.name}"></div>
    <div class="form-field"><label class="form-label">Категория</label><select class="form-select" id="r-cat">${RECIPE_CATEGORIES.map(c=>`<option ${r.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="form-field"><label class="form-label">Время</label><input class="form-input" id="r-time" value="${r.time}"></div>
      <div class="form-field"><label class="form-label">Выход</label><input class="form-input" id="r-yield" value="${r.yield}"></div>
      <div class="form-field"><label class="form-label">Ккал</label><input class="form-input" id="r-kcal" type="number" value="${r.kcal}"></div>
    </div>
    <button class="btn" onclick="saveRecipe(${id||'null'})">Save</button></div></div>`;
  document.body.appendChild(modal);
}
window.saveRecipe = function(id){
    const r={id:id||Date.now(), name:$('#r-name').value, cat:$('#r-cat').value, time:$('#r-time').value, yield:$('#r-yield').value, kcal:parseInt($('#r-kcal').value)||0, note:'', ingr:[], steps:[]};
    if(!r.name){toast('Название!','error');return;}
    if(id){const i=RECIPES.findIndex(x=>x.id===id); RECIPES[i]=r;} else RECIPES.push(r);
    saveData(); document.getElementById('edit-modal').remove(); renderAdminContent(); toast('OK','success');
};
window.deleteRecipe = function(id){ if(confirm('Delete?')){RECIPES=RECIPES.filter(r=>r.id!==id);saveData();renderAdminContent();}};

// News & Team (Simple)
function editNews(i){ const n=i!==undefined?NEWS[i]:{tag:'',title:'',text:'',date:'Сегодня'}; alert('Edit News: '+n.title); } // Simplified for brevity
function editTeamMember(i){ const u=i!==undefined?TEAM[i]:{name:'',role:'',init:''}; alert('Edit Member: '+u.name); } // Simplified
window.deleteNews = function(i){ if(confirm('Delete?')){NEWS.splice(i,1);saveData();renderAdminContent();}};
window.deleteTeamMember = function(i){ if(confirm('Delete?')){TEAM.splice(i,1);saveData();renderAdminContent();}};

/* ============================================================
   🚀 СТАРТ
   ============================================================ */
fetchScheduleData(false);
render();
</script>

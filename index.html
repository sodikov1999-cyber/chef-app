<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<style>
:root {
    --bg-dark: #05060A;
    --bg-card: rgba(17, 24, 39, 0.6);
    --bg-glass: rgba(10, 14, 26, 0.5);
    --text-main: #F3F4F6;
    --text-muted: #9CA3AF;
    --accent: #4F6BFF;
    --accent-glow: rgba(79, 107, 255, 0.4);
    --green: #10B981;
    --red: #EF4444;
    --border: rgba(255, 255, 255, 0.08);
    --safe-top: env(safe-area-inset-top, 20px);
    --safe-bottom: env(safe-area-inset-bottom, 20px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(circle at 10% 10%, rgba(79, 107, 255, 0.15), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(79, 107, 255, 0.1), transparent 40%);
    color: var(--text-main);
    min-height: 100dvh;
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 20px);
    overflow-x: hidden;
}

h1 { font-weight: 800; font-size: 28px; margin-bottom: 20px; letter-spacing: -0.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
h2 { font-weight: 700; font-size: 20px; margin: 24px 0 14px; letter-spacing: -0.3px; }

/* Liquid Glass Card */
.card {
    background: var(--bg-card);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
}
.card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    opacity: 0.5;
}

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }

.tile {
    padding: 20px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 20px;
    border: 1px solid var(--border);
    cursor: pointer;
    text-align: left;
    color: inherit;
    font: inherit;
    width: 100%;
    transition: transform 0.2s, background 0.2s;
    backdrop-filter: blur(10px);
}
.tile:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.06); }
.tile-emoji { font-size: 32px; margin-bottom: 10px; display: block; }
.tile-title { font-weight: 700; font-size: 16px; display: block; }
.tile-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; display: block; }

.pulse { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 8px; animation: blink 2s infinite; box-shadow: 0 0 10px var(--green); }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

.btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: linear-gradient(135deg, var(--accent), #3b5bdb);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 12px;
    text-align: center;
    box-shadow: 0 4px 20px var(--accent-glow);
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn:active { transform: scale(0.98); box-shadow: 0 2px 10px var(--accent-glow); }

.btn-sec {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border: 1px solid var(--border);
    box-shadow: none;
}
.btn-sm { padding: 10px 16px; font-size: 14px; width: auto; display: inline-flex; align-items: center; gap: 6px; border-radius: 12px; }

.back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 14px;
    color: var(--text-main);
    margin-bottom: 20px;
    cursor: pointer;
    border: 1px solid var(--border);
    font-size: 15px;
    font-weight: 600;
    backdrop-filter: blur(10px);
}

.recipe {
    padding: 16px;
    background: rgba(255, 255, 255, 0.02);
    border-radius: 18px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    width: 100%;
    text-align: left;
    color: inherit;
    font: inherit;
    transition: background 0.2s;
}
.recipe:active { background: rgba(255, 255, 255, 0.05); }
.recipe-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.recipe-meta { font-size: 13px; color: var(--text-muted); }

.ingredient { padding: 12px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 15px; }
.ingredient:last-child { border: none; }
.ingredient b { color: var(--accent); font-weight: 700; }

.step { padding: 14px; margin-bottom: 10px; background: rgba(255, 255, 255, 0.03); border-radius: 16px; border-left: 3px solid var(--accent); font-size: 15px; line-height: 1.5; }
.step-num { display: inline-block; width: 24px; height: 24px; background: rgba(79, 107, 255, 0.2); color: var(--accent); border-radius: 8px; text-align: center; line-height: 24px; font-weight: 700; font-size: 12px; margin-right: 10px; }

.news { padding: 16px; background: rgba(79, 107, 255, 0.1); border-radius: 18px; margin-bottom: 12px; border: 1px solid rgba(79, 107, 255, 0.2); }
.news-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; color: #aebcff; }
.news-text { font-size: 14px; color: var(--text-muted); line-height: 1.4; }
.news-date { font-size: 12px; color: var(--text-muted); margin-top: 6px; opacity: 0.7; }

.check-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.check-item:last-child { border: none; }
.check-box { width: 24px; height: 24px; border: 2px solid var(--text-muted); border-radius: 8px; margin-right: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: bold; color: transparent; font-size: 14px; transition: all 0.2s; background: rgba(255,255,255,0.02); }
.check-item.done .check-box { background: var(--green); border-color: var(--green); color: #000; box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); }
.check-item.done span { text-decoration: line-through; color: var(--text-muted); opacity: 0.6; }

.kpi { display: flex; gap: 10px; margin-bottom: 20px; }
.kpi-box { flex: 1; padding: 12px; background: rgba(255, 255, 255, 0.03); border-radius: 16px; text-align: center; border: 1px solid var(--border); }
.kpi-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-weight: 800; font-size: 16px; color: var(--text-main); }

.mults { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.mult { padding: 8px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 99px; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--text-main); backdrop-filter: blur(5px); transition: all 0.2s; }
.mult:active { transform: scale(0.95); }
.mult.on { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

.user { padding: 16px; background: rgba(255, 255, 255, 0.03); border-radius: 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); }
.avatar { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, #60A5FA, var(--accent)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; flex-shrink: 0; box-shadow: 0 4px 15px rgba(79, 107, 255, 0.3); }
.user-info b { display: block; font-size: 16px; color: var(--text-main); }
.user-info span { font-size: 13px; color: var(--text-muted); }

.note { padding: 16px; background: rgba(16, 185, 129, 0.1); border-left: 3px solid var(--green); border-radius: 16px; margin-top: 20px; font-size: 14px; line-height: 1.5; border: 1px solid rgba(16, 185, 129, 0.2); }

.admin-btn {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 20px);
    right: calc(16px + env(safe-area-inset-right, 0px));
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #3b5bdb);
    color: #fff;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--accent-glow);
    font-size: 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
}
.admin-btn:active { transform: scale(0.9); }

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(5, 6, 10, 0.85);
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
}
.modal {
    background: rgba(17, 24, 39, 0.95);
    border-radius: 28px 28px 0 0;
    width: 100%;
    max-width: 600px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    border-top: 1px solid rgba(255,255,255,0.1);
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }

.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 10px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.modal-title { font-weight: 800; font-size: 20px; color: var(--text-main); }
.modal-close { background: rgba(255, 255, 255, 0.1); border: none; color: var(--text-main); width: 36px; height: 36px; border-radius: 12px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

.form-field { margin-bottom: 16px; }
.form-label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.form-input, .form-textarea, .form-select {
    width: 100%;
    padding: 14px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text-main);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
}
.form-input:focus, .form-textarea:focus, .form-select:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.3); }
.form-textarea { min-height: 90px; resize: vertical; }

.item-card { padding: 16px; background: rgba(255, 255, 255, 0.03); border-radius: 18px; margin-bottom: 12px; border: 1px solid var(--border); }
.item-card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.item-card-title { font-weight: 700; font-size: 16px; color: var(--text-main); }

.icon-btn { width: 38px; height: 38px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); border: none; color: var(--text-main); cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.icon-btn:active { background: rgba(255, 255, 255, 0.15); }
.icon-btn.danger { background: rgba(239, 68, 68, 0.15); color: var(--red); }
.icon-btn.danger:active { background: rgba(239, 68, 68, 0.25); }

.toast {
    position: fixed;
    bottom: calc(var(--safe-bottom) + 40px);
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(17, 24, 39, 0.9);
    backdrop-filter: blur(20px);
    color: #fff;
    padding: 14px 24px;
    border-radius: 99px;
    font-weight: 600;
    font-size: 15px;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 300;
    max-width: 85vw;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: rgba(239, 68, 68, 0.9); border-color: rgba(239, 68, 68, 0.3); }
.toast.success { background: rgba(16, 185, 129, 0.9); border-color: rgba(16, 185, 129, 0.3); }

.fade { animation: fade 0.3s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.loader-inline { border: 3px solid rgba(255,255,255,0.1); border-left-color: var(--accent); border-radius: 50%; width: 32px; height: 32px; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.refresh-btn {
    background: rgba(255, 255, 255, 0.05);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    margin-left: auto;
    backdrop-filter: blur(5px);
}
.refresh-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.1); }

.tab-btn {
    flex: 1;
    padding: 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-weight: 600;
    border-radius: 14px;
    margin-right: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
}
.tab-btn.on {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
}

.modal-body { flex: 1; overflow-y: auto; padding: 20px; padding-bottom: 40px; }

/* Matrix Styles */
.supplier-block { margin-bottom: 24px; }
.supplier-header { 
    background: rgba(79, 107, 255, 0.05); 
    border-left: 3px solid var(--accent); 
    padding: 16px; 
    border-radius: 16px; 
    margin-bottom: 12px;
    border: 1px solid rgba(79, 107, 255, 0.1);
}
.supplier-name { font-weight: 800; font-size: 16px; color: #aebcff; margin-bottom: 6px; }
.supplier-schedule { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
.matrix-item { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    padding: 12px 0; 
    border-bottom: 1px solid var(--border); 
}
.matrix-item:last-child { border-bottom: none; }
.matrix-name { font-size: 15px; font-weight: 500; flex: 1; padding-right: 12px; color: var(--text-main); }
.matrix-meta { text-align: right; flex-shrink: 0; }
.matrix-unit { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 2px; }
.matrix-limit { font-size: 14px; font-weight: 700; color: var(--green); text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }

/* Schedule Navigation */
.week-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 12px;
    background: rgba(255,255,255,0.03);
    padding: 8px;
    border-radius: 16px;
    border: 1px solid var(--border);
}
.week-nav-btn {
    background: rgba(255,255,255,0.05);
    border: none;
    color: var(--text-main);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.2s;
}
.week-nav-btn:active { background: var(--accent); color: #fff; }
.week-nav-title { font-weight: 700; font-size: 15px; text-align: center; flex: 1; color: var(--text-main); }

.day-cell {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    background: rgba(255,255,255,0.02);
    border-radius: 14px;
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
}
.day-cell.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    box-shadow: 0 4px 15px var(--accent-glow);
}
.day-cell.today { border-color: var(--green); }
.day-cell .dow { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
.day-cell.active .dow { color: rgba(255,255,255,0.8); }
.day-cell .num { font-weight: 800; font-size: 18px; margin-bottom: 4px; }
.day-cell .count { font-size: 11px; color: var(--text-muted); }
.day-cell.active .count { color: rgba(255,255,255,0.9); }

/* Location Group in Team */
.loc-group-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin: 20px 0 10px;
    padding-left: 4px;
    font-weight: 700;
}
</style>
</head>

function haptic(kind){ try{ if(tg?.HapticFeedback){ tg.HapticFeedback.impactOccurred(kind==='hard'?'medium':'light'); } }catch(e){} }

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'), 10);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2500);
}

function navigate(view, data){
  currentView = view;
  if(data !== undefined) currentRecipeId = data;
  render();
  window.scrollTo(0,0);
}

function render(){
  if(currentView === 'home') renderHome();
  else if(currentView === 'ttk') renderTTK();
  else if(currentView === 'recipe') renderRecipe();
  else if(currentView === 'schedule') renderSchedule();
  else if(currentView === 'checklist') renderChecklist();
  else if(currentView === 'team') renderTeam();
  else if(currentView === 'matrix') renderMatrix();
  app.classList.add('fade');
  setTimeout(()=>app.classList.remove('fade'), 300);
}

async function fetchScheduleData(force = false) {
    if (isLoading) return;
    isLoading = true;
    if (!force && scheduleData) {
        isLoading = false;
        return;
    }
    try {
        const response = await fetch(SHEET_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
        const text = await response.text();
        const parsed = parseComplexCSV(text);
        if (parsed && parsed.locations && parsed.locations.length > 0) {
            scheduleData = parsed;
            useLocalSchedule = false;
            toast('Данные обновлены', 'success');
        } else {
            throw new Error('Неверный формат данных');
        }
    } catch (e) {
        console.warn('Онлайн загрузка не удалась:', e);
        if (!scheduleData) {
            scheduleData = DEFAULT_LOCAL_DATA;
            useLocalSchedule = true;
        }
        toast('Нет связи с сервером. Показаны локальные данные.', 'error');
    } finally {
        isLoading = false;
    }
}

function parseComplexCSV(csvText) {
    const rows = csvText.split('\n').map(row => {
        const result = [];
        let cell = '';
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cell.trim());
                cell = '';
            } else {
                cell += char;
            }
        }
        result.push(cell.trim());
        return result;
    }).filter(r => r.length > 2);

    if (rows.length < 5) return null;
    const locations = [];
    let currentLoc = null;
    
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCell = (row[0] || '').trim().toLowerCase();
        
        if (firstCell.includes('итого') || firstCell.includes('дата') || 
            firstCell.includes('локация') || firstCell === '' || 
            !isNaN(firstCell) || firstCell.includes('вск') || firstCell.includes('пн')) {
            continue;
        }

        const secondCell = (row[1] || '').trim();
        if (secondCell === 'Должность' || secondCell === '') {
             if (row[0] && row[0].trim() !== '' && !row[0].includes('итого')) {
                 currentLoc = { name: row[0].trim(), staff: [] };
                 locations.push(currentLoc);
             }
        } else if (currentLoc) {
            const name = row[0].trim();
            const role = secondCell;
            const shifts = [];
            for (let d = 2; d < Math.min(row.length - 2, 33); d++) {
                let val = row[d];
                if (val && val.includes(',')) val = val.replace(',', '.');
                let num = parseFloat(val);
                if (isNaN(num)) num = 0;
                shifts.push(num);
            }
            const total = shifts.reduce((a, b) => a + b, 0);
            currentLoc.staff.push({ name, role, shifts, total });
        }
    }
    if (locations.length === 0) return null;
    return { month: 'Август 2026', locations: locations };
}

async function renderSchedule(){
    if (!currentWeekStart) {
        const today = new Date();
        const dayOfWeek = today.getDay();
        const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
        currentWeekStart = new Date(today);
        currentWeekStart.setDate(today.getDate() + mondayOffset);
        selectedDayIndex = today.getDate() - 1;
    }
    
    app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h1 style="margin:0">График</h1>
        <button class="refresh-btn" onclick="handleRefresh();haptic('hard')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
    </div>
    <div class="card" style="text-align:center;padding:40px">
      <div class="loader-inline"></div>
      <div style="margin-top:16px;color:var(--text-muted)">Загрузка данных...</div>
    </div>
  `;
    await fetchScheduleData(true);
    renderScheduleContent();
}

function handleRefresh() { 
    currentWeekStart = null; 
    selectedDayIndex = null;
    renderSchedule(); 
}

function renderScheduleContent() {
    const source = scheduleData || DEFAULT_LOCAL_DATA;
    const today = new Date();
    const currentDay = today.getDate();
    
    const weekDays = [];
    for(let i=0; i<7; i++){
        const d = new Date(currentWeekStart);
        d.setDate(currentWeekStart.getDate() + i);
        const dayNum = d.getDate();
        const idx = dayNum - 1; 
        const isToday = dayNum === currentDay && d.getMonth() === today.getMonth();
        const isSelected = selectedDayIndex === idx;
        
        let count = 0;
        if(source && source.locations) {
            source.locations.forEach(loc => {
                loc.staff.forEach(p => {
                    if(p.shifts && p.shifts[idx] && Number(p.shifts[idx]) > 0) count++;
                });
            });
        }
        weekDays.push({ dayNum, idx, isToday, isSelected, count, dowName: ['пн','вт','ср','чт','пт','сб','вск'][i] });
    }

    const endOfWeek = new Date(currentWeekStart);
    endOfWeek.setDate(currentWeekStart.getDate() + 6);
    const rangeTitle = `${currentWeekStart.getDate()} — ${endOfWeek.getDate()} августа`;

    let locationsWithStaff = [];
    
    if (selectedDayIndex !== null && source && source.locations) {
        source.locations.forEach(loc => {
            const workingToday = loc.staff.filter(p => p.shifts && p.shifts[selectedDayIndex] && Number(p.shifts[selectedDayIndex]) > 0);
            if (workingToday.length > 0 || loc.staff.length > 0) {
                locationsWithStaff.push({
                    name: loc.name,
                    staff: loc.staff,
                    workingToday: workingToday
                });
            }
        });
    }

    app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h1 style="margin:0">${source.month || 'Август 2026'}</h1>
        <button class="refresh-btn" onclick="handleRefresh();haptic('hard')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
    </div>
    
    <div class="week-nav">
        <button class="week-nav-btn" onclick="changeWeek(-1);haptic()">←</button>
        <div class="week-nav-title">${rangeTitle}</div>
        <button class="week-nav-btn" onclick="changeWeek(1);haptic()">→</button>
    </div>
    <div style="text-align:center;margin-bottom:20px">
        <button class="btn-sm btn-sec" onclick="resetToToday();haptic()">Сегодня</button>
    </div>

    <div style="display:flex;gap:8px;margin-bottom:24px">
      ${weekDays.map(d => `
        <div class="day-cell ${d.isSelected ? 'active' : ''} ${d.isToday ? 'today' : ''}" 
             onclick="selectDay(${d.idx});haptic()">
          <div class="dow">${d.dowName}</div>
          <div class="num">${d.dayNum}</div>
          <div class="count">${d.count}</div>
        </div>
      `).join('')}
    </div>
    
    ${selectedDayIndex !== null ? `
        <h2>Локации (${selectedDayIndex + 1} число)</h2>
        ${locationsWithStaff.length > 0 ? locationsWithStaff.map(loc => {
          const isOpen = expandedLocations.has(loc.name);
          const workCount = loc.workingToday.length;
          const totalCount = loc.staff.length;
          
          const sortedStaff = [...loc.staff].sort((a,b) => {
              const aWork = a.shifts && a.shifts[selectedDayIndex] > 0;
              const bWork = b.shifts && b.shifts[selectedDayIndex] > 0;
              if (aWork && !bWork) return -1;
              if (!aWork && bWork) return 1;
              return 0;
          });

          return `
            <div class="card" style="padding:0;overflow:hidden;margin-bottom:16px">
              <button onclick="toggleLoc('${loc.name}');haptic()" style="width:100%;padding:18px;background:transparent;border:none;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px">
                <div style="flex:1;min-width:0">
                  <div style="font-weight:700;font-size:17px;margin-bottom:6px">${loc.name}</div>
                  <div style="font-size:13px;color:var(--text-muted)">
                    👥 На смене: <span style="color:var(--accent);font-weight:700">${workCount}</span> из ${totalCount}
                  </div>
                </div>
                <div style="width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;transition:transform .3s;transform:rotate(${isOpen?180:0}deg);flex-shrink:0">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
                </div>
              </button>
              <div style="max-height:${isOpen?'5000px':'0'};overflow:hidden;transition:max-height .4s ease-out">
                <div style="padding:0 18px 18px;border-top:1px solid var(--border)">
                  ${sortedStaff.map(s => {
                      const isWorking = s.shifts && s.shifts[selectedDayIndex] && Number(s.shifts[selectedDayIndex]) > 0;
                      const shiftVal = isWorking ? s.shifts[selectedDayIndex] : 0;
                      return `
                      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);opacity:${isWorking?1:0.5}">
                        <div style="flex:1;min-width:0">
                          <div style="font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name}</div>
                          <div style="font-size:13px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.role}</div>
                        </div>
                        <div style="text-align:right;margin-left:12px">
                          ${isWorking ? `<div style="font-weight:800;font-size:17px;color:var(--accent)">${shiftVal}</div>` : '<div style="font-size:13px;color:var(--text-muted)">Отдых</div>'}
                        </div>
                      </div>
                      `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }).join('') : '<div class="card" style="text-align:center;color:var(--text-muted)">Нет данных по локациям</div>'}
    ` : '<div class="card" style="text-align:center;color:var(--text-muted)">Выберите день, чтобы увидеть список сотрудников</div>'}
    
    <a href="https://docs.google.com/spreadsheets/d/${SHEET_ID}" target="_blank" class="btn btn-sec" style="margin-top:20px;text-decoration:none;text-align:center">
      📝 Открыть таблицу
    </a>
  `;
}

function changeWeek(delta) {
    const newStart = new Date(currentWeekStart);
    newStart.setDate(currentWeekStart.getDate() + (delta * 7));
    if (newStart.getMonth() !== 7) return;
    
    currentWeekStart = newStart;
    const endOfWeek = new Date(currentWeekStart);
    endOfWeek.setDate(currentWeekStart.getDate() + 6);
    
    if (selectedDayIndex < currentWeekStart.getDate() - 1 || selectedDayIndex > endOfWeek.getDate() - 1) {
        selectedDayIndex = currentWeekStart.getDate() - 1;
    }
    
    renderScheduleContent();
}

function resetToToday() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    currentWeekStart = new Date(today);
    currentWeekStart.setDate(today.getDate() + mondayOffset);
    selectedDayIndex = today.getDate() - 1;
    renderScheduleContent();
}

function selectDay(idx) {
    selectedDayIndex = idx;
    const d = new Date();
    d.setDate(idx + 1);
    const dayOfWeek = d.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    
    const newWeekStart = new Date(d);
    newWeekStart.setDate(d.getDate() + mondayOffset);
    
    if (newWeekStart.getMonth() === 7) {
        currentWeekStart = newWeekStart;
    }
    
    renderScheduleContent();
}

function toggleLoc(name) {
  if (expandedLocations.has(name)) expandedLocations.delete(name);
  else expandedLocations.add(name);
  renderScheduleContent();
}

function renderChecklist(){
  if (!window._clLoc) {
    const source = scheduleData || DEFAULT_LOCAL_DATA;
    app.innerHTML = `
      <button class="back" onclick="navigate('home');haptic()">← Назад</button>
      <h1>Чек-листы</h1>
      <div style="display:grid;gap:12px">
        ${source.locations.map(loc => `
          <button class="tile" onclick="window._clLoc='${loc.name}';renderChecklist();haptic()">
            <div class="tile-title">${loc.name}</div>
            <div class="tile-desc">Открыть чек-лист локации</div>
          </button>
        `).join('')}
      </div>
    `;
    return;
  }

  const locName = window._clLoc;
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('cl_'+today+'_'+locName) || '{}');
  const manager = saved.manager || '';
  const doneOpen = (saved.open || []).length;
  const doneClose = (saved.close || []).length;
  const totalOpen = CHECKLISTS.open.length;
  const totalClose = CHECKLISTS.close.length;

  const source = scheduleData || DEFAULT_LOCAL_DATA;
  let allLocStaff = [];
  
  if(source && source.locations) {
    const locData = source.locations.find(l => l.name === locName);
    if(locData && locData.staff) {
      allLocStaff = locData.staff;
    }
  }
  
  if (allLocStaff.length === 0) {
      allLocStaff = TEAM;
  }

  const managers = allLocStaff.filter(p => p.role && (p.role.includes('Су-шеф') || p.role.includes('ИО') || p.role.includes('Верховный')));

  app.innerHTML = `
    <button class="back" onclick="window._clLoc=null;renderChecklist();haptic()">← Назад</button>
    <h1>${locName}</h1>
    
    <div class="card" style="margin-bottom:20px">
      <div class="form-label">Ответственный сегодня</div>
      <select class="form-select" onchange="saveManager('${locName}', this.value);haptic()">
        <option value="">-- Не выбран --</option>
        ${managers.length > 0 ? managers.map(m => `<option value="${m.name}" ${manager===m.name?'selected':''}>${m.name} (${m.role})</option>`).join('') : '<option disabled>Нет подходящих сотрудников</option>'}
      </select>
      ${manager ? `<div style="margin-top:10px;font-size:14px;color:var(--green)">✅ Ответственный: <b>${manager}</b></div>` : ''}
    </div>

    <div class="mults">
      <button class="mult ${(!window._clTab || window._clTab==='open')?'on':''}" onclick="window._clTab='open';renderChecklist()">Открытие (${doneOpen}/${totalOpen})</button>
      <button class="mult ${window._clTab==='close'?'on':''}" onclick="window._clTab='close';renderChecklist()">Закрытие (${doneClose}/${totalClose})</button>
    </div>
    
    <div class="card">
      ${(window._clTab === 'close' ? CHECKLISTS.close : CHECKLISTS.open).map((item,i) => {
        const key = window._clTab === 'close' ? 'close' : 'open';
        const isDone = (saved[key] || []).includes(i);
        return `
        <div class="check-item ${isDone?'done':''}" onclick="toggleCheckItem('${locName}', '${key}', ${i});haptic()">
          <div class="check-box">✓</div>
          <span>${item}</span>
        </div>
      `}).join('')}
    </div>
  `;
}

window.saveManager = function(loc, name){
  const today = new Date().toISOString().slice(0,10);
  const key = 'cl_'+today+'_'+loc;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  saved.manager = name;
  localStorage.setItem(key, JSON.stringify(saved));
  renderChecklist();
};

window.toggleCheckItem = function(loc, type, i){
  const today = new Date().toISOString().slice(0,10);
  const key = 'cl_'+today+'_'+loc;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if(!saved[type]) saved[type] = [];
  
  const idx = saved[type].indexOf(i);
  if(idx>=0) saved[type].splice(idx,1); else saved[type].push(i);
  
  localStorage.setItem(key, JSON.stringify(saved));
  renderChecklist();
};

function renderMatrix(){
  window._matrixQ = window._matrixQ || '';
  const q = window._matrixQ.toLowerCase();
  
  const filteredSuppliers = MATRIX_DATA.map(sup => {
    const items = sup.items.filter(it => it.name.toLowerCase().includes(q));
    if(sup.supplier.toLowerCase().includes(q) || items.length > 0) {
      return {...sup, items: items.length > 0 ? items : sup.items};
    }
    return null;
  }).filter(s => s !== null);

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Матрица заявок</h1>
    <input type="search" id="matrix-search" placeholder="🔍 Поиск продукта или поставщика..." 
           value="${window._matrixQ}" 
           style="width:100%;padding:14px 18px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:16px;color:var(--text-main);font-size:16px;margin-bottom:20px;outline:none">
    
    <div id="matrix-list">
    ${filteredSuppliers.length > 0 ? filteredSuppliers.map(sup => `
      <div class="supplier-block">
        <div class="supplier-header">
          <div class="supplier-name">${sup.supplier}</div>
          <div class="supplier-schedule">🕒 ${sup.schedule}</div>
        </div>
        <div class="card" style="padding:12px 16px">
          ${sup.items.map(it => `
            <div class="matrix-item">
              <div class="matrix-name">${it.name}</div>
              <div class="matrix-meta">
                <span class="matrix-unit">${it.unit}</span>
                ${it.limit !== null ? `<span class="matrix-limit">Макс: ${it.limit}</span>` : '<span class="matrix-unit" style="color:var(--text-muted)">-</span>'}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('') : '<div class="card" style="text-align:center;color:var(--text-muted)">Ничего не найдено 🔍</div>'}
    </div>
  `;

  const input = document.getElementById('matrix-search');
  input.addEventListener('input', (e) => {
      window._matrixQ = e.target.value;
      renderMatrix();
      const val = e.target.value;
      e.target.value = ''; 
      e.target.value = val;
      e.target.setSelectionRange(val.length, val.length);
  });
}

// --- Управление категориями ---
window.addCategory = function() {
    const name = prompt('Название новой категории:');
    if (name && name.trim() !== '') {
        if (RECIPE_CATEGORIES.includes(name.trim())) {
            toast('Такая категория уже есть', 'error');
            return;
        }
        RECIPE_CATEGORIES.push(name.trim());
        saveData();
        renderAdminContent();
        toast('Категория добавлена', 'success');
    }
};

window.moveCat = function(index, direction) {
    const newIndex = index + direction;
    if (newIndex < 0 || newIndex >= RECIPE_CATEGORIES.length) return;
    [RECIPE_CATEGORIES[index], RECIPE_CATEGORIES[newIndex]] = [RECIPE_CATEGORIES[newIndex], RECIPE_CATEGORIES[index]];
    saveData();
    renderAdminContent();
};

window.deleteCat = function(index) {
    const cat = RECIPE_CATEGORIES[index];
    const hasRecipes = RECIPES.some(r => r.cat === cat);
    if (hasRecipes) {
        toast(`Нельзя удалить: в категории "${cat}" есть техкарты`, 'error');
        return;
    }
    if(confirm(`Удалить категорию "${cat}"?`)) {
        RECIPE_CATEGORIES.splice(index, 1);
        saveData();
        renderAdminContent();
        toast('Категория удалена', 'success');
    }
};

window.saveSupplier = function(index) {
    const supName = document.getElementById('mat-sup').value.trim();
    const supSched = document.getElementById('mat-sched').value.trim();
    
    if (!supName) { toast('Введите название поставщика', 'error'); return; }
    
    const items = [];
    const itemRows = document.querySelectorAll('#mat-items-list > div');
    itemRows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        if (inputs.length >= 3) {
            const name = inputs[0].value.trim();
            const unit = inputs[1].value.trim();
            const limitVal = inputs[2].value.trim();
            if (name) {
                items.push({
                    name: name,
                    unit: unit || 'шт',
                    limit: limitVal === '' ? null : parseFloat(limitVal)
                });
            }
        }
    });
    
    const newSup = { supplier: supName, schedule: supSched, items: items };
    
    if (index !== null) {
        MATRIX_DATA[index] = newSup;
    } else {
        MATRIX_DATA.push(newSup);
    }
    
    saveData();
    document.getElementById('edit-modal').remove();
    toast('Сохранено', 'success');
    renderAdminContent();
};

window.deleteSupplier = function(index) {
    if (confirm('Удалить этого поставщика и все его товары?')) {
        MATRIX_DATA.splice(index, 1);
        saveData();
        renderAdminContent();
        toast('Удалено', 'success');
    }
};

function ingrRow(i, idx){
  return `<div class="ing-editor" style="background:rgba(255,255,255,.03);padding:12px;border-radius:12px;margin-bottom:8px"><div style="display:grid;grid-template-columns:1fr 70px 70px 34px;gap:6px">

    <input class="form-input" placeholder="Брутто" type="number" data-ing="${idx}" data-f="brutto" value="${i[1]||0}">
    <input class="form-input" placeholder="Нетто" type="number" data-ing="${idx}" data-f="netto" value="${i[2]||0}">
    <button class="icon-btn danger" onclick="this.closest('.ing-editor').remove()">✕</button>
  </div></div>`;
}

function stepRow(s, idx){
  return `<div style="display:flex;gap:6px;margin-bottom:8px;align-items:flex-start">
    <textarea class="form-textarea" data-step="${idx}" placeholder="Шаг ${idx+1}" style="flex:1;min-height:44px">${s||''}</textarea>
    <button class="icon-btn danger" onclick="this.parentElement.remove()">✕</button>
  </div>`;
}

window.addIngr = function(){
  const list = document.getElementById('ingr-list');
  const idx = list.querySelectorAll('.ing-editor').length;
  list.insertAdjacentHTML('beforeend', ingrRow(['',0,0], idx));
};
window.addStep = function(){
  const list = document.getElementById('steps-list');
  const idx = list.querySelectorAll('[data-step]').length;
  list.insertAdjacentHTML('beforeend', stepRow('', idx));
};

window.saveRecipe = function(editId){
  const r = {
    id: editId || Date.now(),
    name: $('#r-name').value,
    cat: $('#r-cat').value,
    time: $('#r-time').value,
    yield: $('#r-yield').value,
    kcal: parseInt($('#r-kcal').value) || 0,
    note: $('#r-note').value,
    ingr: Array.from(document.querySelectorAll('[data-ing]')).reduce((acc, el)=>{
      const idx = el.dataset.ing;
      const f = el.dataset.f;
      acc[idx] = acc[idx] || [];
      const val = f==='name' ? el.value : parseFloat(el.value)||0;
      const pos = f==='name'?0:f==='brutto'?1:2;
      acc[idx][pos] = val;
      return acc;
    }, []).filter(x=>x && x[0]),
    steps: Array.from(document.querySelectorAll('[data-step]')).map(el=>el.value).filter(x=>x.trim())
  };
  if(!r.name){ toast('Введите название', 'error'); return; }
  if(editId){
    const idx = RECIPES.findIndex(x=>x.id===editId);
    RECIPES[idx] = r;
  } else {
    RECIPES.push(r);
  }
  saveData();
  document.getElementById('edit-modal').remove();
  toast('Сохранено ✓', 'success');
  renderAdminContent();
};

window.deleteRecipe = function(id){
  if(!confirm('Удалить техкарту?')) return;
  const idx = RECIPES.findIndex(r=>r.id===id);
  if(idx>=0) RECIPES.splice(idx,1);
  saveData();
  renderAdminContent();
  toast('Удалено', 'success');
};

  const u = isEdit ? TEAM[i] : {name:'', role:'', init:'??'};
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${isEdit?'Редактировать':'Новый'} сотрудник</div>
        <button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button>
      </div>
      <div class="modal-body" style="padding:0 20px">
        <div class="form-field"><label class="form-label">Имя</label><input class="form-input" id="u-name" value="${u.name}"></div>
        <div class="form-field"><label class="form-label">Должность</label><input class="form-input" id="u-role" value="${u.role}"></div>
        <div class="form-field"><label class="form-label">Инициалы</label><input class="form-input" id="u-init" value="${u.init}" maxlength="2"></div>
        <button class="btn" onclick="saveTeamMember(${isEdit?i:'null'})">💾 Сохранить</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveTeamMember = function(i){
  const u = {name: $('#u-name').value, role: $('#u-role').value, init: $('#u-init').value.toUpperCase()};
  if(!u.name){ toast('Введите имя', 'error'); return; }
  if(i !== null) TEAM[i] = u; else TEAM.push(u);
  saveData();
  document.getElementById('edit-modal').remove();
  renderAdminContent();
  toast('Сохранено', 'success');
};

window.deleteTeamMember = function(i){
  if(!confirm('Удалить сотрудника?')) return;
  TEAM.splice(i,1);
  saveData();
  renderAdminContent();
  toast('Удалено', 'success');
};

/* ============================================================
   🚀 СТАРТ
   ============================================================ */
fetchScheduleData(false);
render();
</script>
</body>
</html>

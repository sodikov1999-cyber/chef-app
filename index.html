async function syncToFirebase(){
  if(FIREBASE_URL.includes('ВАШ-ПРОЕКТ')){
    console.warn('Firebase URL не настроен. Данные сохранены только локально.');
    return;
  }
  try{
    const data = {
      recipes: RECIPES,
      news: NEWS,
      team: TEAM,
      matrix: MATRIX_DATA,
      favorites: FAVORITES,
      updatedAt: Date.now()
    };
    const url = `${FIREBASE_URL}${FB_PATH}.json`;
    console.log('☁️ Отправка в Firebase:', url);
    const res = await fetch(url, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });
    console.log('☁️ Ответ Firebase:', res.status, res.statusText);
    if(res.ok){
      console.log('☁️ Успешно синхронизировано');
    }else{
      console.warn('☁️ Firebase вернул ошибку:', res.status, await res.text());
    }
  }catch(e){
    console.warn('☁️ Ошибка синхронизации:', e.message);
  }
}

async function loadFromFirebase(){
  if(FIREBASE_URL.includes('ВАШ-ПРОЕКТ')){
    console.log('Firebase не настроен — используем локальные данные');
    return false;
  }
  try{
    const url = `${FIREBASE_URL}${FB_PATH}.json?t=${Date.now()}`;
    console.log('☁️ Загрузка из Firebase:', url);
    const res = await fetch(url);
    console.log('☁️ Ответ Firebase:', res.status, res.statusText);
    if(!res.ok){
      console.warn('☁️ Firebase вернул ошибку:', res.status);
      return false;
    }
    const data = await res.json();
    console.log('☁️ Данные из Firebase:', data === null ? 'null (база пустая)' : 'получены');
    if(data && data.recipes){
      RECIPES = data.recipes;
      NEWS = data.news || DEFAULT_NEWS;
      TEAM = data.team || DEFAULT_TEAM;
      MATRIX_DATA = data.matrix || DEFAULT_MATRIX;
      FAVORITES = data.favorites || [];
      localStorage.setItem('chef_recipes', JSON.stringify(RECIPES));
      localStorage.setItem('chef_news', JSON.stringify(NEWS));
      localStorage.setItem('chef_team', JSON.stringify(TEAM));
      localStorage.setItem('chef_matrix', JSON.stringify(MATRIX_DATA));
      console.log('☁️ Данные загружены из Firebase, рецептов:', RECIPES.length);
      return true;
    }else{
      console.log('☁️ База пустая или нет рецептов');
    }
  }catch(e){
    console.warn('☁️ Не удалось загрузить из Firebase:', e.message);
  }
  return false;
}

/* ============================================================
   🌀 PHYSICS ENGINE
   ============================================================ */
const PHYS = {
  stiffness: 520,
  damping: 28,
  mass: 1,
  decelerationRate: 0.998
};

function springAnimate({ from, to, velocity = 0, onUpdate, onComplete, stiffness = PHYS.stiffness, damping = PHYS.damping, mass = PHYS.mass }) {
  let current = from;
  let vel = velocity;
  let rafId = null;
  let lastTime = performance.now();
  let running = true;

  function tick(now) {
    if (!running) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const displacement = current - to;
    const springForce = -stiffness * displacement;
    const dampingForce = -damping * vel;
    const acceleration = (springForce + dampingForce) / mass;
    vel += acceleration * dt;
    current += vel * dt;
    onUpdate(current);
    if (Math.abs(displacement) < 0.5 && Math.abs(vel) < 0.5) {
      onUpdate(to);
      if (onComplete) onComplete();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
  return {
    cancel() { running = false; if (rafId) cancelAnimationFrame(rafId); },
    getVelocity() { return vel; }
  };
}

function rubberband(overshoot, dimension, constant = 0.55) {
  return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));
}

function project(initialVelocity, decelerationRate = PHYS.decelerationRate) {
  return (initialVelocity / 1000) * decelerationRate / (1 - decelerationRate);
}

/* ============================================================
   ⬅️ GLOBAL SWIPE-BACK (iOS-style interactive pop)
   ============================================================ */
(function initSwipeBack(){
  let sbStartX = 0, sbStartY = 0, sbStartTime = 0, sbDragging = false, sbAnim = null;
  let sbCurrentScreen = null, sbPrevScreen = null;

  document.body.addEventListener('touchstart', e => {
    if(viewStack.length <= 1) return;
    const t = e.touches[0];
    if(t.clientX > 50) return;
    const cur = app.querySelector('.screen.current');
    if(!cur) return;
    sbDragging = true;
    sbStartX = t.clientX;
    sbStartY = t.clientY;
    sbStartTime = e.timeStamp;
    sbCurrentScreen = cur;
    sbPrevScreen = app.querySelector('.screen:not(.current)');
    if(sbAnim) sbAnim.cancel();
  }, {passive: true});

  document.body.addEventListener('touchmove', e => {
    if(!sbDragging || !sbCurrentScreen) return;
    const t = e.touches[0];
    const dx = t.clientX - sbStartX;
    const dy = t.clientY - sbStartY;
    // Cancel swipe-back if vertical scroll dominates
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 8){ sbDragging = false; return; }
    if(dx < 0){ sbDragging = false; return; }
    // Only prevent scroll if we're clearly going horizontal
    if(dx > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) e.preventDefault();
    const pct = dx / window.innerWidth;
    sbCurrentScreen.style.transition = 'none';
    sbCurrentScreen.style.transform = `translateX(${dx}px)`;
    if(sbPrevScreen){
      sbPrevScreen.style.display = '';
      sbPrevScreen.style.visibility = '';
      sbPrevScreen.style.transition = 'none';
      sbPrevScreen.style.transform = `translateX(${(pct * 30 - 30)}%)`;
      sbPrevScreen.style.opacity = Math.max(0.4, 1 - pct * 0.6);
    }
  }, {passive: false});

  document.body.addEventListener('touchend', e => {
    if(!sbDragging || !sbCurrentScreen) return;
    sbDragging = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sbStartX;
    const dt = e.timeStamp - sbStartTime;
    const threshold = window.innerWidth * 0.28;
    const velocity = dt > 0 ? dx / dt * 1000 : 0;
    const commit = dx > threshold || (dx > 60 && velocity > 400);

    if(commit){
      if(sbAnim) sbAnim.cancel();
      sbAnim = springAnimate({
        from: dx, to: window.innerWidth, velocity: velocity * 0.3,
        stiffness: 520, damping: 28,
        onUpdate: x => {
          sbCurrentScreen.style.transform = `translateX(${x}px)`;
          if(sbPrevScreen){
            const p = x / window.innerWidth;
            sbPrevScreen.style.transform = `translateX(${(p * 30 - 30)}%)`;
            sbPrevScreen.style.opacity = Math.max(0.4, 1 - p * 0.6);
          }
        },
        onComplete: () => {
          viewStack.pop();
          const prevState = viewStack[viewStack.length - 1];
          currentView = prevState.view;
          if(prevState.data !== undefined) currentRecipeId = prevState.data;
          sbCurrentScreen.remove();
          if(sbPrevScreen){
            sbPrevScreen.classList.add('current');
            sbPrevScreen.style.transform = ''; sbPrevScreen.style.opacity = '';
            currentScreen = sbPrevScreen;
          }
          sbCurrentScreen = null; sbPrevScreen = null;
        }
      });
    } else {
      if(sbAnim) sbAnim.cancel();
      sbAnim = springAnimate({
        from: dx, to: 0, velocity: 0,
        stiffness: 520, damping: 28,
        onUpdate: x => {
          sbCurrentScreen.style.transform = `translateX(${x}px)`;
          if(sbPrevScreen){
            const p = x / window.innerWidth;
            sbPrevScreen.style.transform = `translateX(${(p * 30 - 30)}%)`;
            sbPrevScreen.style.opacity = Math.max(0.4, 1 - p * 0.6);
          }
        },
        onComplete: () => {
          if(sbPrevScreen){ sbPrevScreen.style.display = 'none'; sbPrevScreen.style.visibility = 'hidden'; }
          sbCurrentScreen.style.transform = '';
          sbCurrentScreen = null; sbPrevScreen = null;
        }
      });
    }
  }, {passive: true});
})();

function getCurrentScreen() {
  const screens = app.querySelectorAll('.screen');
  return screens[screens.length - 1] || app;
}

function navigate(view, data){
  haptic();
  if(data !== undefined) currentRecipeId = data;

  const prevScreen = getCurrentScreen();
  if (prevScreen && prevScreen !== app) {
    prevScreen.classList.remove('current');
  }

  const newScreen = document.createElement('div');
  newScreen.className = 'screen';
  newScreen.style.transform = 'translateX(100%)';
  app.appendChild(newScreen);
  currentScreen = newScreen;

  currentView = view;
  render();
  window.scrollTo(0,0);

  if(prevScreen && prevScreen !== app){
    if(screenAnim) screenAnim.cancel();
    screenAnim = springAnimate({
      from: 100, to: 0, velocity: 0,
      onUpdate: x => {
        newScreen.style.transform = `translateX(${x}%)`;
        prevScreen.style.transform = `translateX(${x * 0.3 - 30}%)`;
        prevScreen.style.opacity = Math.max(0.4, 1 - x/150);
      },
      onComplete: () => {
        if(prevScreen){
          prevScreen.style.display = 'none';
          prevScreen.style.visibility = 'hidden';
          prevScreen.style.transform = '';
          prevScreen.style.opacity = '';
        }
        newScreen.style.transform = '';
      }
    });
  } else {
    newScreen.style.transform = '';
  }
  newScreen.classList.add('current');
  viewStack.push({view, data});

}

function goBack(){
  console.log('goBack called, stack:', viewStack.length);
  if(viewStack.length <= 1) { console.log('goBack: stack too short'); return; }
  haptic();
  viewStack.pop();
  const prevState = viewStack[viewStack.length - 1];
  if (!prevState) { console.error('goBack: no prev state'); return; }
  currentView = prevState.view;
  if(prevState.data !== undefined) currentRecipeId = prevState.data;

  const screens = app.querySelectorAll('.screen');
  console.log('goBack: screens found', screens.length);
  if (screens.length < 2) {
    console.log('goBack: fallback to app render');
    currentScreen = app;
    render();
    return;
  }

  const curScreen = screens[screens.length - 1];
  const prevScreen = screens[screens.length - 2];
  if (!curScreen || !prevScreen) { console.error('goBack: missing screens'); return; }

  prevScreen.style.display = '';
  prevScreen.style.visibility = '';
  prevScreen.classList.add('current');
  currentScreen = prevScreen;

  if(screenAnim) screenAnim.cancel();
  screenAnim = springAnimate({
    from: 0, to: 100, velocity: 0,
    onUpdate: x => {
      if (curScreen) curScreen.style.transform = `translateX(${x}%)`;
      if (prevScreen) {
        prevScreen.style.transform = `translateX(${x * 0.3 - 30}%)`;
        prevScreen.style.opacity = Math.max(0.4, 1 - x/150);
      }
    },
    onComplete: () => {
      if (curScreen) curScreen.remove();
      if (prevScreen) {
        prevScreen.style.transform = '';
        prevScreen.style.opacity = '';
      }
    }
  });
}

async function fetchScheduleData(force = false, silent = false) {
    if (isLoading) return;
    isLoading = true;
    if (!force && scheduleData) {
        isLoading = false;
        return;
    }
    try {
        const response = await fetch(SHEET_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
        const text = await response.text();
        const parsed = parseComplexCSV(text);
        if (parsed && parsed.locations && parsed.locations.length > 0) {
            scheduleData = parsed;
            useLocalSchedule = false;
            if (!silent) toast('Данные обновлены', 'success');
        } else {
            throw new Error('Неверный формат данных');
        }
    } catch (e) {
        console.warn('Онлайн загрузка не удалась:', e);
        if (!scheduleData) {
            scheduleData = DEFAULT_LOCAL_DATA;
            useLocalSchedule = true;
        }
        if (!silent) toast('Нет связи с сервером. Показаны локальные данные.', 'error');
    } finally {
        isLoading = false;
    }
}

function parseComplexCSV(csvText) {
    const rows = csvText.split('\n').map(row => {
        const result = [];
        let cell = '';
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cell.trim());
                cell = '';
            } else {
                cell += char;
            }
        }
        result.push(cell.trim());
        return result;
    }).filter(r => r.length > 2);

    if (rows.length < 5) return null;
    const locations = [];
    let currentLoc = null;
    
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCell = (row[0] || '').trim().toLowerCase();
        
        if (firstCell.includes('итого') || firstCell.includes('дата') || 
            firstCell.includes('локация') || firstCell === '' || 
            !isNaN(firstCell) || firstCell.includes('вск') || firstCell.includes('пн')) {
            continue;
        }

        const secondCell = (row[1] || '').trim();
        if (secondCell === 'Должность' || secondCell === '') {
             if (row[0] && row[0].trim() !== '' && !row[0].includes('итого')) {
                 currentLoc = { name: row[0].trim(), staff: [] };
                 locations.push(currentLoc);
             }
        } else if (currentLoc) {
            const name = row[0].trim();
            const role = secondCell;
            const shifts = [];
            for (let d = 2; d < Math.min(row.length - 2, 33); d++) {
                let val = row[d];
                if (val && val.includes(',')) val = val.replace(',', '.');
                let num = parseFloat(val);
                if (isNaN(num)) num = 0;
                shifts.push(num);
            }
            const total = shifts.reduce((a, b) => a + b, 0);
            currentLoc.staff.push({ name, role, shifts, total });
        }
    }
    if (locations.length === 0) return null;
    return { month: 'Август 2026', locations: locations };
}

window.changeWeek = function(offset) {
    if (!currentWeekStart) return;
    const newDate = new Date(currentWeekStart);
    newDate.setDate(currentWeekStart.getDate() + (offset * 7));
    if (newDate.getMonth() !== 7 && newDate.getMonth() !== 6 && newDate.getMonth() !== 8) {}
    currentWeekStart = newDate;
    selectedDayIndex = null;
    renderScheduleContent();
};

window.selectDay = function(dayIndex) {
    selectedDayIndex = dayIndex;
    renderScheduleContent();
};

window.goToToday = function() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    currentWeekStart = new Date(today);
    currentWeekStart.setDate(today.getDate() + mondayOffset);
    selectedDayIndex = today.getDate() - 1;
    renderScheduleContent();
};

window.toggleCheckItem = function(loc, type, i){
  const today = new Date().toISOString().slice(0,10);
  const key = 'cl_'+today+'_'+loc;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if(!saved[type]) saved[type] = [];

function getCartItem(supplier, name){
  return orderCart.find(c => c.supplier === supplier && c.name === name);
}

function addToCart(supplier, item){
  orderCart = _chef.domain.cartAdd(orderCart, supplier, item, null);
  saveData();
  updateCartFab();
  haptic('hard');
  renderMatrix();
  toast('Добавлено в заявку', 'success');
}

function removeFromCart(supplier, name){
  orderCart = _chef.domain.cartRemove(orderCart, supplier, name);
  saveData();
  updateCartFab();
  haptic();
  renderMatrix();
}

function updateCartQty(idx, delta){
  orderCart[idx].qty = Math.max(0.01, parseFloat((orderCart[idx].qty + delta).toFixed(3)));
  if(orderCart[idx].qty <= 0) orderCart.splice(idx, 1);
  saveData();
  renderCartSheet();
}

function setCartQty(idx, rawVal){
  const val = rawVal.replace(',', '.').replace(/[^0-9.]/g, '');
  const num = parseFloat(val);
  if(isNaN(num) || num <= 0){
    orderCart.splice(idx, 1);
  } else {
    orderCart[idx].qty = Math.round(num * 1000) / 1000;
  }
  saveData();
  updateCartFab();
  renderCartSheet();
  if(orderCart.length === 0) closeCartSheet();
}

function deleteCartItem(idx){
  orderCart.splice(idx, 1);
  saveData();
  updateCartFab();
  renderCartSheet();
  if(orderCart.length === 0) closeCartSheet();
}

function closeCartSheet(){
  const bg = document.getElementById('cart-sheet-bg');
  if(bg) bg.remove();
}

function copyOrder(){
  if(!orderCart.length){ toast('Корзина пуста', 'error'); return; }
  const date = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
  // Group by supplier
  const grouped = {};
  orderCart.forEach(c => {
    if(!grouped[c.supplier]) grouped[c.supplier] = [];
    grouped[c.supplier].push(c);
  });
  let text = `📋 ЗАЯВКА НА ПОСТАВКУ\n${date}\n\n`;
  for(const [sup, items] of Object.entries(grouped)){
    text += `📦 ${sup}\n`;
    items.forEach(it => {
      text += `• ${it.name} — ${it.qty} ${it.unit}\n`;
    });
    text += `\n`;
  }
  text += `—\nОтправлено из ШефБук`;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => {
      toast('Скопировано! Вставьте в заметки', 'success');
      haptic('hard');
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('Скопировано! Вставьте в заметки', 'success'); haptic('hard'); }
  catch{ toast('Не удалось скопировать', 'error'); }
  ta.remove();
}

/* ============================================================
   🌀 iOS SPRING SHEET SYSTEM v2
   Проценты вместо пикселей. Fallback если анимация не сработает.
   ============================================================ */
const SheetSystem = {
  activeSheet: null,
  activeBg: null,
  activeAnim: null,
  dragState: null,
  triggerEl: null,
  sheetState: 'closed',
  currentPct: 100,

  open({ title, contentHtml, onClose, onMount, maxHeight = '85vh' }) {
    this.closeImmediate();
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;transition:background .25s ease';

    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.style.cssText = `position:relative;width:100%;max-width:500px;background:var(--glass);border-radius:20px 20px 0 0;transform:translateY(100%);will-change:transform;touch-action:none;box-shadow:0 -8px 32px rgba(0,0,0,.5),inset 0 1px 0 var(--glass-border);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border);max-height:${maxHeight};display:flex;flex-direction:column;`;

    sheet.innerHTML = `
      <div class="sheet-handle" style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:8px;z-index:10;pointer-events:none"></div>
      <div class="sheet-drag-area" style="position:absolute;top:0;left:0;right:0;height:40px;z-index:5;cursor:grab;touch-action:none"></div>
      <div class="sheet-header" style="display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;flex-shrink:0">
        <div class="sheet-title" style="font-weight:800;font-size:18px">${_chef.esc(title)}</div>
        <button class="sheet-close" style="background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center" aria-label="Закрыть">✕</button>
      </div>
      <div class="sheet-body" style="flex:1;overflow-y:auto;padding:0 20px 30px">${contentHtml}</div>
    `;

    bg.appendChild(sheet);
    document.body.appendChild(bg);

    this.activeSheet = sheet;
    this.activeBg = bg;
    this.onCloseCallback = onClose;
    this.triggerEl = document.activeElement;
    this.sheetState = 'opening';
    this.currentPct = 100;

    // Focus trap
    this._focusin = (e) => { if (this.activeSheet && !this.activeSheet.contains(e.target)) { e.stopPropagation(); this.focusFirst(this.activeSheet); } };
    document.addEventListener('focusin', this._focusin);

    // Escape
    this._esc = (e) => { if (e.key === 'Escape') this.close(); };
    document.addEventListener('keydown', this._esc);

    // Backdrop click
    bg.addEventListener('click', (e) => { if (e.target === bg) this.close(); });
    sheet.querySelector('.sheet-close').addEventListener('click', () => this.close());

    // Drag
    const dragArea = sheet.querySelector('.sheet-drag-area');
    dragArea.addEventListener('pointerdown', (e) => this.onPointerDown(e));
    sheet.addEventListener('pointermove', (e) => this.onPointerMove(e));
    sheet.addEventListener('pointerup', (e) => this.onPointerUp(e));
    sheet.addEventListener('pointercancel', (e) => this.onPointerUp(e));

    // Show backdrop
    requestAnimationFrame(() => {
      bg.style.pointerEvents = 'auto';
      bg.style.background = 'rgba(0,0,0,.55)';
    });

    // Fallback: если анимация не завершится за 600мс, показываем принудительно
    this._fallbackTimer = setTimeout(() => {
      if (this.sheetState === 'opening') {
        console.warn('Sheet fallback: forcing open');
        if (this.activeAnim) { this.activeAnim.cancel(); this.activeAnim = null; }
        this.currentPct = 0;
        if (this.activeSheet) this.activeSheet.style.transform = 'translateY(0%)';
        this.sheetState = 'open';
        if (onMount) onMount();
        this.focusFirst(sheet);
      }
    }, 600);

    if (reduced) {
      sheet.style.transform = 'translateY(0%)';
      this.currentPct = 0;
      this.sheetState = 'open';
      clearTimeout(this._fallbackTimer);
      if (onMount) onMount();
      this.focusFirst(sheet);
    } else {
      this.springTo(100, 0, 0, () => {
        clearTimeout(this._fallbackTimer);
        this.sheetState = 'open';
        if (onMount) onMount();
        this.focusFirst(sheet);
      });
    }
  },

  onPointerDown(e) {
    if (e.target.closest('button, input, textarea, select, .sheet-body')) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.sheetState = 'dragging';
    if (this.activeAnim) { this.activeAnim.cancel(); this.activeAnim = null; }
    this.dragState = { startY: e.clientY, startPct: this.currentPct, history: [] };
    this.activeSheet.setPointerCapture(e.pointerId);
    this.activeSheet.style.cursor = 'grabbing';
    e.preventDefault();
  },

  onPointerMove(e) {
    if (!this.dragState || this.sheetState !== 'dragging') return;
    const y = e.clientY;
    const startY = this.dragState.startY;
    const h = this.activeSheet.offsetHeight || window.innerHeight * 0.5;
    const deltaPct = ((y - startY) / h) * 100;
    let targetPct = this.dragState.startPct + deltaPct;
    if (targetPct < 0) targetPct = -this.rubberband(-targetPct, 50);
    this.dragState.history.push({ y, t: performance.now() });
    if (this.dragState.history.length > 6) this.dragState.history.shift();
    this.currentPct = targetPct;
    this.activeSheet.style.transform = `translateY(${targetPct}%)`;
  },

  onPointerUp(e) {
    if (!this.dragState || this.sheetState !== 'dragging') return;
    this.sheetState = 'settling';
    this.dragState.history.push({ y: e.clientY, t: performance.now() });
    const h = this.activeSheet.offsetHeight || window.innerHeight * 0.5;
    const now = performance.now();
    const recent = this.dragState.history.filter(p => now - p.t < 80);
    let velocity = 0;
    if (recent.length >= 2) {
      const f = recent[0], l = recent[recent.length - 1];
      const dt = l.t - f.t;
      if (dt > 0) velocity = ((l.y - f.y) / dt * 1000) / h * 100;
    }
    const projected = (this.currentPct || 0) + this.project(velocity);
    if (projected > 35 || ((this.currentPct || 0) > 35 && velocity > 0)) {
      this.springTo(this.currentPct || 0, 100, velocity, () => this.closeImmediate());
    } else {
      this.springTo(this.currentPct || 0, 0, velocity, () => { this.sheetState = 'open'; });
    }
    this.dragState = null;
    this.activeSheet.style.cursor = '';
  },

  springTo(fromPct, toPct, velocity, onComplete) {
    if (this.activeAnim) { this.activeAnim.cancel(); this.activeAnim = null; }
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      if (this.activeSheet) this.activeSheet.style.transform = `translateY(${toPct}%)`;
      this.currentPct = toPct;
      if (onComplete) onComplete();
      return;
    }
    this.currentPct = fromPct;
    const self = this;
    const stiffness = 420, damping = 30, mass = 1;
    let cur = fromPct, vel = velocity, raf, last = performance.now(), run = true;
    function tick(now) {
      if (!run) return;
      const dt = Math.min((now - last) / 1000, 0.05); last = now;
      const disp = cur - toPct;
      const acc = (-stiffness * disp - damping * vel) / mass;
      vel += acc * dt; cur += vel * dt;
      self.currentPct = cur;
      if (self.activeSheet) self.activeSheet.style.transform = `translateY(${cur}%)`;
      if (Math.abs(disp) < 0.5 && Math.abs(vel) < 0.5) {
        self.currentPct = toPct;
        if (self.activeSheet) self.activeSheet.style.transform = `translateY(${toPct}%)`;
        if (onComplete) onComplete();
        return;
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    this.activeAnim = { cancel() { run = false; cancelAnimationFrame(raf); } };
  },

  close() {
    if (!this.activeSheet) return;
    clearTimeout(this._fallbackTimer);
    this.springTo(this.currentPct || 0, 100, 0, () => this.closeImmediate());
  },

  closeImmediate() {
    clearTimeout(this._fallbackTimer);
    if (this._esc) { document.removeEventListener('keydown', this._esc); this._esc = null; }
    if (this._focusin) { document.removeEventListener('focusin', this._focusin); this._focusin = null; }
    if (this.triggerEl && typeof this.triggerEl.focus === 'function') { this.triggerEl.focus(); }
    if (this.onCloseCallback) this.onCloseCallback();
    if (this.activeAnim) { this.activeAnim.cancel(); this.activeAnim = null; }
    if (this.activeBg && this.activeBg.parentNode) this.activeBg.remove();
    this.activeSheet = null; this.activeBg = null;
    this.dragState = null; this.sheetState = 'closed'; this.currentPct = 100;
  },

  rubberband(o, d) { return (o * d * 0.55) / (d + 0.55 * Math.abs(o)); },
  project(v) { const d = 0.998; return (v / 1000) * d / (1 - d); },
  focusFirst(s) { const f = s.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'); if (f.length) f[0].focus(); }
};

/* ============================================================
   🎯 MODAL FOCUS TRAP SYSTEM
   Для старых .modal-bg / .modal модалок
   ============================================================ */
const ModalTrap = {
  activeModal: null,
  activeBg: null,
  triggerEl: null,
  listeners: [],
  sheetBgState: null,

  open(bgEl, modalEl, opts = {}) {
    this.close();
    this.activeBg = bgEl;
    this.activeModal = modalEl;
    this.triggerEl = document.activeElement;
    console.log('ModalTrap.open: sheetBg found?', !!document.querySelector('.sheet-bg'));

    // БЛОКИРУЕМ sheet-bg (админку) — она перехватывает клики
    const sheetBg = document.querySelector('.sheet-bg');
    if (sheetBg) {
      this.sheetBgState = sheetBg.style.pointerEvents;
      sheetBg.style.pointerEvents = 'none';
      sheetBg.style.visibility = 'hidden';
      console.log('ModalTrap: sheet-bg blocked');
    }

    // ARIA
    modalEl.setAttribute('role', 'dialog');
    modalEl.setAttribute('aria-modal', 'true');
    if (opts.label) modalEl.setAttribute('aria-label', opts.label);

    // Focus first focusable
    const focusable = this._getFocusable(modalEl);
    if (focusable.length) {
      setTimeout(() => focusable[0].focus(), 50);
    }

    // Escape
    const escHandler = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        this.close();
        if (opts.onClose) opts.onClose();
      }
    };
    document.addEventListener('keydown', escHandler);
    this.listeners.push(() => document.removeEventListener('keydown', escHandler));

    // Tab trap
    const tabHandler = (e) => {
      if (e.key !== 'Tab') return;
      const items = this._getFocusable(this.activeModal);
      if (items.length === 0) { e.preventDefault(); return; }
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault(); last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault(); first.focus();
      }
    };
    document.addEventListener('keydown', tabHandler);
    this.listeners.push(() => document.removeEventListener('keydown', tabHandler));

    // Backdrop click
    const clickHandler = (e) => {
      if (e.target === bgEl) {
        this.close();
        if (opts.onClose) opts.onClose();
      }
    };
    bgEl.addEventListener('click', clickHandler);
    this.listeners.push(() => bgEl.removeEventListener('click', clickHandler));

    // Close button
    const closeBtn = modalEl.querySelector('.modal-close');
    if (closeBtn) {
      const closeHandler = () => { this.close(); if (opts.onClose) opts.onClose(); };
      closeBtn.addEventListener('click', closeHandler);
      this.listeners.push(() => closeBtn.removeEventListener('click', closeHandler));
    }
  },

  close() {
    // Восстанавливаем sheet-bg
    if (this.sheetBgState !== null) {
      const sheetBg = document.querySelector('.sheet-bg');
      if (sheetBg) {
        sheetBg.style.pointerEvents = this.sheetBgState;
        sheetBg.style.visibility = '';
      }
      this.sheetBgState = null;
    }
    if (this.triggerEl && typeof this.triggerEl.focus === 'function') {
      setTimeout(() => this.triggerEl.focus(), 10);
    }
    this.listeners.forEach(fn => fn());
    this.listeners = [];
    if (this.activeBg && this.activeBg.parentNode) this.activeBg.remove();
    this.activeBg = null; this.activeModal = null; this.triggerEl = null;
  },

  _getFocusable(el) {
    return Array.from(el.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
      .filter(x => !x.disabled && x.offsetParent !== null);
  }
};

window.saveRecipe = function(editId){
  const r = {
    id: editId || Date.now(),
    name: $('#r-name').value,
    cat: $('#r-cat').value,
    time: $('#r-time').value,
    yield: $('#r-yield').value,
    kcal: parseInt($('#r-kcal').value) || 0,
    note: $('#r-note').value,
    ingr: Array.from(document.querySelectorAll('[data-ing]')).reduce((acc, el)=>{
      const idx = el.dataset.ing;
      const f = el.dataset.f;
      acc[idx] = acc[idx] || [];
      const val = f==='name' ? el.value : parseFloat(el.value)||0;
      const pos = f==='name'?0:f==='brutto'?1:2;
      acc[idx][pos] = val;
      return acc;
    }, []).filter(x=>x && x[0]),
    steps: Array.from(document.querySelectorAll('[data-step]')).map(el=>el.value).filter(x=>x.trim())

  if(!r.name){ toast('Введите название', 'error'); return; }
  if(editId){
    const idx = RECIPES.findIndex(x=>x.id===editId);
    RECIPES[idx] = r;
  } else {
    RECIPES.push(r);
  }
  saveData();
  syncToFirebase();
  document.getElementById('edit-modal').remove();
  haptic('hard');
  toast('Сохранено ✓', 'success');
  renderAdminContent();
};

  if(i !== null) TEAM[i] = u; else TEAM.push(u);
  saveData();
  syncToFirebase();
  document.getElementById('edit-modal').remove();
  renderAdminContent();
  toast('Сохранено', 'success');
};

window.deleteTeamMember = function(i){
  if(!confirm('Удалить сотрудника?')) return;
  TEAM.splice(i,1);
  saveData();
  syncToFirebase();
  renderAdminContent();
  toast('Удалено', 'success');
};

/* ============================================================
   🚀 СТАРТ
   ============================================================ */
// Сначала пробуем загрузить из Firebase, потом рендерим
// Fix iOS keyboard scroll jump when editing cart qty
document.addEventListener('focusout', e => {
  if(e.target.classList.contains('cart-qty-input')){
    const scroller = app.querySelector('.screen.current');
    if(!scroller) return;
    const st = scroller.scrollTop;
    requestAnimationFrame(() => {
      scroller.scrollTop = st;
      requestAnimationFrame(() => scroller.scrollTop = st);
    });
  }
});

// Tap in top zone to scroll to top (like iOS status bar tap)
document.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  if(t.clientY < 80 && viewStack.length > 1){
    const scroller = app.querySelector('.screen.current');
    if(scroller){
      scroller.scrollTo({ top: 0, behavior: 'smooth' });
      haptic();
    }
  }
}, {passive: true});

updateCartFab();

(async function init(){
  const loaded = await loadFromFirebase();
  if(!loaded){
    // Если Firebase не настроен — используем локальные данные (уже загружены выше)
    console.log('📱 Работаем в offline-режиме');
  }
  render();
  startFirebaseSync();
})();
</script>

<!-- ====== НОВАЯ АРХИТЕКТУРА (встроено) ====== -->
<script type="module">
// === UTILS ===
const bus = new EventTarget();
function emit(name, detail = null) { bus.dispatchEvent(new CustomEvent(name, { detail })); }

const MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(raw) { if (raw == null) return ''; return String(raw).replace(/[&<>"']/g, ch => MAP[ch] || ch); }

const PREF = 'chef_';
const db = {
  get(name, fallback = null) { try { const r = localStorage.getItem(PREF + name); return r ? JSON.parse(r) : fallback; } catch (e) { return fallback; } },
  set(name, value) { try { localStorage.setItem(PREF + name, JSON.stringify(value)); return true; } catch (e) { alert('Память переполнена!'); return false; } }
};

function spring({ from, to, velocity = 0, onUpdate, onComplete, stiffness = 520, damping = 28 }) {
  let cur = from, vel = velocity, raf, last = performance.now(), run = true;
  function tick(now) {
    if (!run) return;
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    const disp = cur - to;
    const acc = (-stiffness * disp - damping * vel);
    vel += acc * dt; cur += vel * dt;
    onUpdate(cur);
    if (Math.abs(disp) < 0.5 && Math.abs(vel) < 0.5) { onUpdate(to); if (onComplete) onComplete(); return; }
    raf = requestAnimationFrame(tick);
  }
  raf = requestAnimationFrame(tick);
  return { cancel() { run = false; cancelAnimationFrame(raf); } };
}

// === DOMAIN ===
function filterRecipes(list, cat, query) {
  const q = (query || '').toLowerCase().trim();
  return list.filter(r => (cat === 'Все' || r.cat === cat) && (!q || r.name.toLowerCase().includes(q)));
}
function scaleIngr(ingr, mult) {
  const m = Math.max(0.01, parseFloat(mult) || 1);
  return ingr.map(([n, b, net]) => [n, Math.round((b || 0) * m), Math.round((net || 0) * m)]);
}
function cartAdd(cart, supplier, item, qty) {
  const exists = cart.find(c => c.supplier === supplier && c.name === item.name);
  if (exists) { exists.qty = qty !== null ? qty : (item.limit || 1); return [...cart]; }
  return [...cart, { supplier, name: item.name, unit: item.unit || 'шт', qty: qty !== null ? qty : (item.limit || 1) }];
}
function cartRemove(cart, supplier, name) {
  return cart.filter(c => !(c.supplier === supplier && c.name === name));
}
function cartHas(cart, supplier, name) {
  return cart.some(c => c.supplier === supplier && c.name === name);
}
function cartGroup(cart) {
  const g = {};
  for (const it of cart) { (g[it.supplier] ||= []).push(it); }
  return g;
}
function cartText(cart) {
  if (!cart.length) return '';
  const date = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const g = cartGroup(cart);
  let t = `📋 ЗАЯВКА НА ПОСТАВКУ\n${date}\n\n`;
  for (const [sup, items] of Object.entries(g)) {
    t += `📦 ${sup}\n`;
    items.forEach(i => t += `• ${i.name} — ${i.qty} ${i.unit}\n`);
    t += `\n`;
  }
  return t + `—\nОтправлено из ШефБук`;
}
function parseCSV(text) {
  const rows = text.split('\n').map(row => {
    const res = []; let cell = '', q = false;
    for (const ch of row) {
      if (ch === '"') q = !q;
      else if (ch === ',' && !q) { res.push(cell.trim()); cell = ''; }
      else cell += ch;
    }
    res.push(cell.trim()); return res;
  }).filter(r => r.length > 2);
  const locs = []; let cur = null;
  for (const row of rows) {
    const f = (row[0] || '').trim().toLowerCase();
    if (f.includes('итого') || f.includes('дата') || f === '') continue;
    if ((row[1] || '').trim() === 'Должность') {
      if (row[0]) { cur = { name: row[0].trim(), staff: [] }; locs.push(cur); }
    } else if (cur) {
      const shifts = row.slice(2, 33).map(v => { const n = parseFloat((v || '').replace(',', '.')); return isNaN(n) ? 0 : n; });
      cur.staff.push({ name: row[0].trim(), role: row[1].trim(), shifts, total: shifts.reduce((a, b) => a + b, 0) });
    }
  }
  return locs.length ? { month: 'Август 2026', locations: locs } : null;
}

// === BRIDGE ===
window._chef = { bus, emit, esc, db, spring, domain: { filterRecipes, scaleIngr, cartAdd, cartRemove, cartHas, cartGroup, cartText, parseCSV } };
bus.addEventListener('toast', e => { if (typeof toast === 'function') toast(e.detail.msg, e.detail.type); });
console.log('✅ Архитектура v2 активна');
</script>
<!-- ====== /НОВАЯ АРХИТЕКТУРА ====== -->

</body>
</html>

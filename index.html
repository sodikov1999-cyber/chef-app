<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ШефБук</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0F0D0B;--card:#1B1613;--text:#F5ECE2;--muted:#9C8D7E;--accent:#FF8A3D;--accent-soft:rgba(255,138,61,.14);--green:#5FD38A;--blue:#6FA8FF;--red:#FF6B5E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;padding-bottom:40px}
h1{font-weight:800;font-size:26px;margin-bottom:16px;letter-spacing:-.5px}
h2{font-weight:700;font-size:18px;margin:22px 0 12px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.tile{padding:18px 14px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.06);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.tile:active{transform:scale(.97)}
.tile-emoji{font-size:28px;margin-bottom:8px}
.tile-title{font-weight:700;font-size:15px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:3px}
.pulse{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.shift-time{font-weight:800;font-size:24px;color:var(--accent);margin-top:6px}
.shift-type{font-size:12px;color:var(--muted);margin-top:4px}
.btn{display:block;width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:center}
.btn:active{transform:scale(.98)}
.btn-sec{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.btn-danger{background:rgba(255,107,94,.15);color:var(--red);border:1px solid rgba(255,107,94,.3)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-flex;align-items:center;gap:6px}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,.06);border-radius:10px;color:var(--text);margin-bottom:16px;cursor:pointer;border:none;font-size:14px;font-weight:600}
.back:active{background:rgba(255,255,255,.1)}
.recipe{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;cursor:pointer;border:none;width:100%;text-align:left;color:inherit;font:inherit}
.recipe:active{background:rgba(255,255,255,.07)}
.recipe-name{font-weight:700;font-size:15px;margin-bottom:3px}
.recipe-meta{font-size:12px;color:var(--muted)}
.ingredient{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;font-size:14px}
.ingredient:last-child{border:none}
.ingredient b{color:var(--accent)}
.step{padding:12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent);font-size:14px;line-height:1.5}
.step-num{display:inline-block;width:20px;height:20px;background:var(--accent-soft);color:var(--accent);border-radius:6px;text-align:center;line-height:20px;font-weight:700;font-size:11px;margin-right:8px}
.shift{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px}
.news{padding:14px;background:rgba(255,138,61,.08);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--accent)}
.news-title{font-weight:700;font-size:14px;margin-bottom:3px}
.news-text{font-size:13px;color:var(--muted);line-height:1.4}
.news-date{font-size:11px;color:var(--muted);margin-top:5px}
.check-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.check-item:last-child{border:none}
.check-box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold;color:transparent;font-size:13px;transition:all .2s}
.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-item.done span{text-decoration:line-through;color:var(--muted)}
.note{padding:14px;background:rgba(95,211,138,.1);border-left:3px solid var(--green);border-radius:10px;margin-top:14px;font-size:13px;line-height:1.5}
.kpi{display:flex;gap:8px;margin-bottom:14px}
.kpi-box{flex:1;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;text-align:center}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.kpi-value{font-weight:700;font-size:14px}
.mults{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mult{padding:7px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.mult.on{background:var(--accent);color:#000;border-color:var(--accent)}
.user{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FFB067,var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;flex-shrink:0}
.user-info b{display:block;font-size:15px}
.user-info span{font-size:12px;color:var(--muted)}
.hidden{display:none}
.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* АДМИНКА */
.admin-btn{position:fixed;bottom:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(255,138,61,.4);font-size:20px;z-index:100}
.admin-btn:active{transform:scale(.9)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;max-height:92vh;overflow-y:auto;padding:20px;padding-bottom:40px;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:sticky;top:-20px;background:var(--bg);padding:4px 0;z-index:1}
.modal-title{font-weight:800;font-size:18px}
.modal-close{background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px}
.form-field{margin-bottom:14px}
.form-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-input,.form-textarea,.form-select{width:100%;padding:12px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.form-input:focus,.form-textarea:focus{border-color:var(--accent)}
.form-textarea{min-height:80px;resize:vertical}
.item-card{padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06)}
.item-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-card-title{font-weight:700;font-size:15px}
.item-card-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:none;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.1)}
.icon-btn.danger{background:rgba(255,107,94,.15);color:var(--red)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:all .3s;z-index:300;max-width:85vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ing-editor{background:rgba(255,255,255,.03);padding:12px;border-radius:10px;margin-bottom:10px}
.ing-row{display:grid;grid-template-columns:1fr 70px 70px 32px;gap:6px;margin-bottom:6px}
.ing-row input{padding:8px;font-size:13px}
.step-editor{display:flex;gap:6px;margin-bottom:8px;align-items:flex-start}
.step-editor textarea{flex:1;padding:10px;font-size:13px;min-height:42px}
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;margin-bottom:16px}
.tab-btn{flex:1;padding:10px;background:transparent;border:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;border-radius:8px}
.tab-btn.on{background:var(--accent);color:#000}
.loader-inline{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.2);border-top-color:#000;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* ============================================================
   ⚙️ НАСТРОЙКИ (замени на свои!)
   ============================================================ */
const GITHUB_CONFIG = {
  owner: 'sodikov1999-cyber',        // ← твой логин на GitHub
  repo: 'chef-app',                   // ← имя репозитория
  path: 'data.json',                  // ← путь к файлу данных
  branch: 'main'
};

/* ============================================================
   📦 СОСТОЯНИЕ
   ============================================================ */
let DATA = null;
let currentView = 'home';
let currentRecipeId = null;
let currentMult = 1;
let adminTab = 'recipes';
let githubToken = localStorage.getItem('gh_token') || '';

const tg = window.Telegram?.WebApp;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

const $ = s => document.querySelector(s);
const app = $('#app');

function haptic(kind){ try{ if(tg?.HapticFeedback){ tg.HapticFeedback.impactOccurred(kind==='hard'?'medium':'light'); } }catch(e){} }

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if(type === 'error') t.style.background = 'var(--red)', t.style.color = '#fff';
  if(type === 'success') t.style.background = 'var(--green)', t.style.color = '#000';
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add('show'), 10);
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(), 300); }, 2500);
}

/* ============================================================
   🌐 GITHUB API
   ============================================================ */
async function loadData(){
  try {
    const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${GITHUB_CONFIG.path}?t=${Date.now()}`);
    if(!res.ok) throw new Error('Не удалось загрузить');
    DATA = await res.json();
    return true;
  } catch(e){
    console.error(e);
    toast('Ошибка загрузки данных', 'error');
    return false;
  }
}

async function saveData(){
  if(!githubToken){
    toast('Сначала настрой GitHub токен', 'error');
    openSettings();
    return false;
  }
  try {
    // Получаем текущий sha файла
    const getRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
    });
    if(!getRes.ok) throw new Error('Нет доступа к репозиторию');
    const fileInfo = await getRes.json();
    
    // Обновляем файл
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(DATA, null, 2))));
    const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.path}`, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: 'Обновление данных из приложения',
        content: content,
        sha: fileInfo.sha,
        branch: GITHUB_CONFIG.branch
      })
    });
    if(!updateRes.ok) throw new Error('Ошибка сохранения');
    toast('Сохранено ✓', 'success');
    return true;
  } catch(e){
    console.error(e);
    toast('Ошибка: ' + e.message, 'error');
    return false;
  }
}

/* ============================================================
   🎨 РЕНДЕРИНГ
   ============================================================ */
function navigate(view, data){
  currentView = view;
  if(data !== undefined) currentRecipeId = data;
  render();
  window.scrollTo(0,0);
}

function render(){
  if(!DATA){ app.innerHTML = '<div class="card" style="text-align:center;padding:40px">Загрузка...</div>'; return; }
  if(currentView === 'home') renderHome();
  else if(currentView === 'ttk') renderTTK();
  else if(currentView === 'recipe') renderRecipe();
  else if(currentView === 'schedule') renderSchedule();
  else if(currentView === 'checklist') renderChecklist();
  else if(currentView === 'team') renderTeam();
  app.classList.add('fade');
  setTimeout(()=>app.classList.remove('fade'), 300);
}

function renderHome(){
  const user = tg?.initDataUnsafe?.user;
  const greet = user ? 'Привет, ' + user.first_name + '!' : 'ШефБук 👨‍🍳';
  const today = new Date().getDay();
  const dayIndex = today === 0 ? 6 : today - 1;
  const todayShift = DATA.shifts[dayIndex] || DATA.shifts[0];
  
  let shiftHtml = '';
  if(todayShift && todayShift.type){
    shiftHtml = `
      <div class="card">
        <span class="pulse"></span>Сегодня · ${todayShift.day}
        <div class="shift-time">${todayShift.time}</div>
        <div class="shift-type">Смена: ${todayShift.type==='open'?'Открытие':todayShift.type==='mid'?'Усиление':'Закрытие'}</div>
        ${todayShift.crew.length ? '<div style="margin-top:10px;font-size:13px;color:var(--muted)">👥 '+todayShift.crew.join(', ')+'</div>' : ''}
      </div>
    `;
  } else {
    shiftHtml = '<div class="card" style="text-align:center;padding:30px">🎉 Сегодня выходной</div>';
  }

  app.innerHTML = `
    <h1>${greet}</h1>
    ${shiftHtml}
    
    <div class="grid">
      <button class="tile" onclick="navigate('ttk');haptic()">
        <div class="tile-emoji">📖</div>
        <div class="tile-title">ТТК</div>
        <div class="tile-desc">${DATA.recipes.length} техкарт</div>
      </button>
      <button class="tile" onclick="navigate('schedule');haptic()">
        <div class="tile-emoji">🗓</div>
        <div class="tile-title">График</div>
        <div class="tile-desc">Смены недели</div>
      </button>
      <button class="tile" onclick="navigate('checklist');haptic()">
        <div class="tile-emoji">✅</div>
        <div class="tile-title">Чек-лист</div>
        <div class="tile-desc">Открытие/закрытие</div>
      </button>
      <button class="tile" onclick="navigate('team');haptic()">
        <div class="tile-emoji">👥</div>
        <div class="tile-title">Команда</div>
        <div class="tile-desc">${DATA.team.length} чел</div>
      </button>
    </div>

    <h2>Объявления</h2>
    ${DATA.news.slice(0,3).map(n => `
      <div class="news">
        <div class="news-title">${n.tag}: ${n.title}</div>
        <div class="news-text">${n.text}</div>
        <div class="news-date">${n.date}</div>
      </div>
    `).join('')}
  `;
}

function renderTTK(){
  const cats = ['Все', ...new Set(DATA.recipes.map(r=>r.cat))];
  window._ttkCat = window._ttkCat || 'Все';
  window._ttkQ = window._ttkQ || '';
  const q = window._ttkQ.toLowerCase();
  const items = DATA.recipes.filter(r => 
    (window._ttkCat === 'Все' || r.cat === window._ttkCat) &&
    (!q || r.name.toLowerCase().includes(q))
  );

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Техкарты</h1>
    <input type="search" placeholder="🔍 Поиск блюда..." 
           value="${window._ttkQ}" 
           oninput="window._ttkQ=this.value;renderTTK()"
           style="width:100%;padding:12px 16px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:var(--text);font-size:15px;margin-bottom:12px;outline:none">
    <div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px">
      ${cats.map(c => `<button class="mult ${c===window._ttkCat?'on':''}" onclick="window._ttkCat='${c}';haptic();renderTTK()">${c}</button>`).join('')}
    </div>
    ${items.length ? items.map(r => `
      <button class="recipe" onclick="navigate('recipe',${r.id});haptic()">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">${r.cat} · ${r.time} · ${r.yield}</div>
      </button>
    `).join('') : '<div class="card" style="text-align:center;color:var(--muted)">Ничего не найдено 🔍</div>'}
  `;
}

function renderRecipe(){
  const r = DATA.recipes.find(x => x.id === currentRecipeId);
  if(!r){ navigate('ttk'); return; }

  app.innerHTML = `
    <button class="back" onclick="navigate('ttk');haptic()">← Назад</button>
    <h1>${r.name}</h1>
    
    <div class="kpi">
      <div class="kpi-box"><div class="kpi-label">Время</div><div class="kpi-value">${r.time}</div></div>
      <div class="kpi-box"><div class="kpi-label">Выход</div><div class="kpi-value">${r.yield}</div></div>
      <div class="kpi-box"><div class="kpi-label">Ккал</div><div class="kpi-value">${r.kcal}</div></div>
    </div>

    <h2>Ингредиенты</h2>
    <div class="mults">
      ${[1,2,5,10].map(m => `<button class="mult ${m===currentMult?'on':''}" onclick="currentMult=${m};haptic();renderRecipe()">×${m}</button>`).join('')}
    </div>
    <div class="card">
      ${r.ingr.map(i => `
        <div class="ingredient">
          <span>${i[0]}</span>
          <b>${Math.round(i[2]*currentMult)} г</b>
        </div>
      `).join('')}
    </div>

    <h2>Приготовление</h2>
    ${r.steps.map((s,i) => `
      <div class="step"><span class="step-num">${i+1}</span>${s}</div>
    `).join('')}

    ${r.note ? `<div class="note">📝 <b>Важно:</b> ${r.note}</div>` : ''}
  `;
}

function renderSchedule(){
  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>График на неделю</h1>
    ${DATA.shifts.map((s,i) => {
      const today = new Date().getDay();
      const dayIndex = today === 0 ? 6 : today - 1;
      const isToday = i === dayIndex;
      return `
      <div class="shift" style="${isToday?'border-left:3px solid var(--accent)':''}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700;font-size:16px">${s.day}${isToday?' · сегодня':''}</div>
            <div style="color:var(--muted);font-size:13px;margin-top:2px">${s.time}</div>
          </div>
          ${s.type ? `<div style="padding:5px 10px;background:var(--accent-soft);color:var(--accent);border-radius:99px;font-size:11px;font-weight:700">${s.type==='open'?'ОТКРЫТИЕ':s.type==='mid'?'УСИЛЕНИЕ':'ЗАКРЫТИЕ'}</div>` : '<div style="color:var(--muted);font-size:12px">выходной</div>'}
        </div>
        ${s.crew && s.crew.length ? `<div style="margin-top:8px;font-size:13px;color:var(--muted)">👥 ${s.crew.join(', ')}</div>` : ''}
      </div>
    `}).join('')}
  `;
}

function renderChecklist(){
  window._clTab = window._clTab || 'open';
  const key = window._clTab;
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('cl_'+today+'_'+key) || '[]');
  const items = DATA.checklists[key];
  const done = saved.length;
  const total = items.length;

  app.innerHTML = `
    <button class="back" onclick="navigate('home');haptic()">← Назад</button>
    <h1>Чек-листы</h1>
    <div class="mults">
      <button class="mult ${key==='open'?'on':''}" onclick="window._clTab='open';renderChecklist()">Открытие (${done}/${total})</button>
      <button class="mult ${key==='close'?'on':''}" onclick="window._clTab='close';renderChecklist()">Закрытие</button>
    </div>
    <div class="card">
      ${items.map((item,i) => `
        <div class="check-item ${saved.includes(i)?'done':''}" onclick="toggleCheck(${i});haptic()">
          <div class="check-box">✓</div>
          <span>${item}</span>
        </div>
      `).join('')}
    </div>
    ${done===total && total>0 ? '<div class="note" style="text-align:center">🎉 Все пункты выполнены!</div>' : ''}
    <button class="back" style="width:100%;justify-content:center;margin-top:12px;background:rgba(255,107,94,.1);color:var(--red);border:1px solid rgba(255,107,94,.3)" onclick="resetChecklist();haptic()">↺ Сбросить</button>
  `;
}

window.toggleCheck = function(i){
  const key = window._clTab;
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('cl_'+today+'_'+key) || '[]');
  const idx = saved.indexOf(i);
  if(idx>=0) saved.splice(idx,1); else saved.push(i);
  localStorage.setItem('cl_'+today+'_'+key, JSON.stringify(saved));
  renderChecklist();
};

window.resetChecklist = function(){
  const key = window._clTab;
  const today = new Date().toISOString().slice(0,10);
  localStorage.removeItem('cl_'+today+'_'+key);
  renderChecklist();
};

        <div class="user-info"><b>${user.first_name} ${user.last_name||''}</b><span>Это вы · Повар</span></div>
      </div>

}

/* ============================================================
   🔐 АДМИНКА
   ============================================================ */
function openAdmin(){
  if(!githubToken && !localStorage.getItem('gh_token')){
    openSettings();
    return;
  }
  githubToken = localStorage.getItem('gh_token');
  showAdminModal();
}

function showAdminModal(){
  adminTab = adminTab || 'recipes';
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'admin-modal';
  modal.onclick = (e) => { if(e.target === modal) modal.remove(); };
  
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">⚙️ Редактор</div>
        <button class="modal-close" onclick="document.getElementById('admin-modal').remove()">✕</button>
      </div>
      <div class="tabs">
        <button class="tab-btn ${adminTab==='recipes'?'on':''}" onclick="adminTab='recipes';showAdminModal()">ТТК</button>
        <button class="tab-btn ${adminTab==='shifts'?'on':''}" onclick="adminTab='shifts';showAdminModal()">График</button>
        <button class="tab-btn ${adminTab==='news'?'on':''}" onclick="adminTab='news';showAdminModal()">Новости</button>
        <button class="tab-btn ${adminTab==='team'?'on':''}" onclick="adminTab='team';showAdminModal()">Команда</button>
      </div>
      <div id="admin-content"></div>
      <div style="margin-top:20px;display:flex;gap:8px">
        <button class="btn btn-sec" style="flex:1" onclick="openSettings()">🔑 Настройки</button>
        <button class="btn" style="flex:2" id="save-btn" onclick="saveFromAdmin()">💾 Сохранить</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  renderAdminContent();
}

function renderAdminContent(){
  const c = document.getElementById('admin-content');
  if(!c) return;
  
  if(adminTab === 'recipes'){
    c.innerHTML = `
      <button class="btn" onclick="editRecipe()">+ Добавить техкарту</button>
      ${DATA.recipes.map(r => `
        <div class="item-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${r.name}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${r.cat} · ${r.time}</div>
            </div>
            <div class="item-card-actions">
              <button class="icon-btn" onclick="editRecipe(${r.id})">✏️</button>
              <button class="icon-btn danger" onclick="deleteRecipe(${r.id})">🗑</button>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  } else if(adminTab === 'shifts'){
    c.innerHTML = DATA.shifts.map((s,i) => `
      <div class="item-card">
        <div class="item-card-head" style="margin-bottom:10px">
          <div class="item-card-title">${s.day}</div>
          <button class="icon-btn" onclick="editShift(${i})">✏️</button>
        </div>
        <div style="font-size:13px;color:var(--muted)">
          ${s.type ? (s.type==='open'?'Открытие':s.type==='mid'?'Усиление':'Закрытие')+' · '+s.time : 'Выходной'}
          ${s.crew && s.crew.length ? '<br>👥 '+s.crew.join(', ') : ''}
        </div>
      </div>
    `).join('');
  } else if(adminTab === 'news'){
    c.innerHTML = `
      <button class="btn" onclick="editNews()">+ Добавить новость</button>
      ${DATA.news.map((n,i) => `
        <div class="item-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${n.tag}: ${n.title}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${n.date}</div>
            </div>
            <div class="item-card-actions">
              <button class="icon-btn" onclick="editNews(${i})">✏️</button>
              <button class="icon-btn danger" onclick="deleteNews(${i})">🗑</button>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  } else if(adminTab === 'team'){
    c.innerHTML = `
      <button class="btn" onclick="editTeamMember()">+ Добавить сотрудника</button>
      ${DATA.team.map((u,i) => `
        <div class="item-card">
          <div class="item-card-head">
            <div>
              <div class="item-card-title">${u.name}</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px">${u.role}</div>
            </div>
            <div class="item-card-actions">
              <button class="icon-btn" onclick="editTeamMember(${i})">✏️</button>
              <button class="icon-btn danger" onclick="deleteTeamMember(${i})">🗑</button>
            </div>
          </div>
        </div>
      `).join('')}
    `;
  }
}

/* ============ РЕДАКТОРЫ ============ */
function editRecipe(id){
  const r = id ? DATA.recipes.find(x=>x.id===id) : {id:Date.now(), name:'', cat:'Горячее', time:'', yield:'', kcal:0, note:'', ingr:[['',0,0]], steps:['']};
  const isEdit = !!id;
  
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${isEdit?'Редактировать':'Новая'} техкарта</div>
        <button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button>
      </div>
      <div class="form-field"><label class="form-label">Название</label><input class="form-input" id="r-name" value="${r.name}"></div>
      <div class="form-field"><label class="form-label">Категория</label>
        <select class="form-select" id="r-cat">
          ${['Горячее','Салаты','Десерты','Напитки','Заготовки'].map(c=>`<option ${r.cat===c?'selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="form-field"><label class="form-label">Время</label><input class="form-input" id="r-time" value="${r.time}" placeholder="30 мин"></div>
        <div class="form-field"><label class="form-label">Выход</label><input class="form-input" id="r-yield" value="${r.yield}" placeholder="200 г"></div>
      </div>
      <div class="form-field"><label class="form-label">Калории (ккал)</label><input class="form-input" id="r-kcal" type="number" value="${r.kcal}"></div>
      
      <div class="form-field">
        <label class="form-label">Ингредиенты <button class="btn btn-sm btn-sec" style="margin-left:8px" onclick="addIngr()">+ Добавить</button></label>
        <div id="ingr-list">
          ${r.ingr.map((i,idx)=>ingrRow(i,idx)).join('')}
        </div>
      </div>
      
      <div class="form-field">
        <label class="form-label">Шаги приготовления <button class="btn btn-sm btn-sec" style="margin-left:8px" onclick="addStep()">+ Добавить</button></label>
        <div id="steps-list">
          ${r.steps.map((s,idx)=>stepRow(s,idx)).join('')}
        </div>
      </div>
      
      <div class="form-field"><label class="form-label">Важное примечание</label><textarea class="form-textarea" id="r-note">${r.note||''}</textarea></div>
      
      <button class="btn" onclick="saveRecipe(${isEdit?r.id:'null'})">💾 Сохранить</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function ingrRow(i, idx){
  return `<div class="ing-editor"><div class="ing-row">
    <input class="form-input" placeholder="Продукт" data-ing="${idx}" data-f="name" value="${i[0]||''}">
    <input class="form-input" placeholder="Брутто" type="number" data-ing="${idx}" data-f="brutto" value="${i[1]||0}">
    <input class="form-input" placeholder="Нетто" type="number" data-ing="${idx}" data-f="netto" value="${i[2]||0}">
    <button class="icon-btn danger" onclick="this.closest('.ing-editor').remove()">✕</button>
  </div></div>`;
}

function stepRow(s, idx){
  return `<div class="step-editor">
    <textarea class="form-textarea" data-step="${idx}" placeholder="Шаг ${idx+1}">${s||''}</textarea>
    <button class="icon-btn danger" onclick="this.closest('.step-editor').remove()">✕</button>
  </div>`;
}

window.addIngr = function(){
  const list = document.getElementById('ingr-list');
  const idx = list.querySelectorAll('.ing-editor').length;
  list.insertAdjacentHTML('beforeend', ingrRow(['',0,0], idx));
};

window.addStep = function(){
  const list = document.getElementById('steps-list');
  const idx = list.querySelectorAll('.step-editor').length;
  list.insertAdjacentHTML('beforeend', stepRow('', idx));
};

window.saveRecipe = function(editId){
  const r = {
    id: editId || Date.now(),
    name: $('#r-name').value,
    cat: $('#r-cat').value,
    time: $('#r-time').value,
    yield: $('#r-yield').value,
    kcal: parseInt($('#r-kcal').value) || 0,
    note: $('#r-note').value,
    ingr: Array.from(document.querySelectorAll('[data-ing]')).reduce((acc, el)=>{
      const idx = el.dataset.ing;
      const f = el.dataset.f;
      acc[idx] = acc[idx] || [];
      const val = f==='name' ? el.value : parseFloat(el.value)||0;
      const pos = f==='name'?0:f==='brutto'?1:2;
      acc[idx][pos] = val;
      return acc;
    }, []).filter(x=>x && x[0]),
    steps: Array.from(document.querySelectorAll('[data-step]')).map(el=>el.value).filter(x=>x.trim())
  };
  if(!r.name){ toast('Введите название', 'error'); return; }
  if(editId){
    const idx = DATA.recipes.findIndex(x=>x.id===editId);
    DATA.recipes[idx] = r;
  } else {
    DATA.recipes.push(r);
  }
  document.getElementById('edit-modal').remove();
  toast('Сохранено локально. Теперь "Сохранить" в админке.', 'success');
  renderAdminContent();
};

window.deleteRecipe = function(id){
  if(!confirm('Удалить техкарту?')) return;
  DATA.recipes = DATA.recipes.filter(r=>r.id!==id);
  renderAdminContent();
  toast('Удалено', 'success');
};

function editShift(i){
  const s = DATA.shifts[i];
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${s.day}</div>
        <button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button>
      </div>
      <div class="form-field"><label class="form-label">Тип смены</label>
        <select class="form-select" id="s-type">
          <option value="" ${!s.type?'selected':''}>Выходной</option>
          <option value="open" ${s.type==='open'?'selected':''}>Открытие</option>
          <option value="mid" ${s.type==='mid'?'selected':''}>Усиление</option>
          <option value="close" ${s.type==='close'?'selected':''}>Закрытие</option>
        </select>
      </div>
      <div class="form-field"><label class="form-label">Время (напр. 09:00–17:00)</label><input class="form-input" id="s-time" value="${s.time}"></div>
      <div class="form-field"><label class="form-label">Команда (через запятую)</label><input class="form-input" id="s-crew" value="${(s.crew||[]).join(', ')}"></div>
      <button class="btn" onclick="saveShift(${i})">💾 Сохранить</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveShift = function(i){
  DATA.shifts[i] = {
    ...DATA.shifts[i],
    type: $('#s-type').value || null,
    time: $('#s-time').value,
    crew: $('#s-crew').value.split(',').map(s=>s.trim()).filter(s=>s)
  };
  document.getElementById('edit-modal').remove();
  renderAdminContent();
  toast('Сохранено', 'success');
};

function editNews(i){
  const isEdit = i !== undefined;
  const n = isEdit ? DATA.news[i] : {tag:'', title:'', text:'', date:'Сегодня'};
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${isEdit?'Редактировать':'Новая'} новость</div>
        <button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button>
      </div>
      <div class="form-field"><label class="form-label">Тег (Поставка, Событие, Важно)</label><input class="form-input" id="n-tag" value="${n.tag}"></div>
      <div class="form-field"><label class="form-label">Заголовок</label><input class="form-input" id="n-title" value="${n.title}"></div>
      <div class="form-field"><label class="form-label">Текст</label><textarea class="form-textarea" id="n-text">${n.text}</textarea></div>
      <div class="form-field"><label class="form-label">Дата</label><input class="form-input" id="n-date" value="${n.date}"></div>
      <button class="btn" onclick="saveNews(${isEdit?i:'null'})">💾 Сохранить</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveNews = function(i){
  const n = {
    tag: $('#n-tag').value,
    title: $('#n-title').value,
    text: $('#n-text').value,
    date: $('#n-date').value
  };
  if(!n.title){ toast('Введите заголовок', 'error'); return; }
  if(i !== null) DATA.news[i] = n; else DATA.news.unshift(n);
  document.getElementById('edit-modal').remove();
  renderAdminContent();
  toast('Сохранено', 'success');
};

window.deleteNews = function(i){
  if(!confirm('Удалить новость?')) return;
  DATA.news.splice(i,1);
  renderAdminContent();
  toast('Удалено', 'success');
};

function editTeamMember(i){
  const isEdit = i !== undefined;
  const u = isEdit ? DATA.team[i] : {name:'', role:'', init:'??'};
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'edit-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">${isEdit?'Редактировать':'Новый'} сотрудник</div>
        <button class="modal-close" onclick="document.getElementById('edit-modal').remove()">✕</button>
      </div>
      <div class="form-field"><label class="form-label">Имя</label><input class="form-input" id="u-name" value="${u.name}"></div>
      <div class="form-field"><label class="form-label">Должность</label><input class="form-input" id="u-role" value="${u.role}"></div>
      <div class="form-field"><label class="form-label">Инициалы (2 буквы)</label><input class="form-input" id="u-init" value="${u.init}" maxlength="2"></div>
      <button class="btn" onclick="saveTeamMember(${isEdit?i:'null'})">💾 Сохранить</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveTeamMember = function(i){
  const u = {
    name: $('#u-name').value,
    role: $('#u-role').value,
    init: $('#u-init').value.toUpperCase()
  };
  if(!u.name){ toast('Введите имя', 'error'); return; }
  if(i !== null) DATA.team[i] = u; else DATA.team.push(u);
  document.getElementById('edit-modal').remove();
  renderAdminContent();
  toast('Сохранено', 'success');
};

window.deleteTeamMember = function(i){
  if(!confirm('Удалить сотрудника?')) return;
  DATA.team.splice(i,1);
  renderAdminContent();
  toast('Удалено', 'success');
};

async function saveFromAdmin(){
  const btn = document.getElementById('save-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader-inline"></span> Сохраняю...';
  const ok = await saveData();
  btn.disabled = false;
  btn.innerHTML = '💾 Сохранить';
  if(ok){
    setTimeout(()=>{ 
      document.getElementById('admin-modal').remove();
      render();
    }, 1000);
  }
}

function openSettings(){
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.id = 'settings-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">🔑 Настройки GitHub</div>
        <button class="modal-close" onclick="document.getElementById('settings-modal').remove()">✕</button>
      </div>
      <div class="form-field">
        <label class="form-label">GitHub Token</label>
        <input class="form-input" id="gh-token-input" type="password" value="${githubToken}" placeholder="ghp_xxxxxxxxxxxx">
        <div style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5">
          Создайте токен на <a href="https://github.com/settings/tokens" target="_blank" style="color:var(--accent)">github.com/settings/tokens</a> → Generate new token (classic) → выберите scope "repo".
        </div>
      </div>
      <button class="btn" onclick="saveToken()">💾 Сохранить токен</button>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveToken = function(){
  const token = document.getElementById('gh-token-input').value.trim();
  if(!token){ toast('Введите токен', 'error'); return; }
  githubToken = token;
  localStorage.setItem('gh_token', token);
  document.getElementById('settings-modal').remove();
  toast('Токен сохранён ✓', 'success');
};

/* ============================================================
   🚀 СТАРТ
   ============================================================ */
(async function(){
  app.innerHTML = '<div class="card" style="text-align:center;padding:40px"><div class="loader-inline" style="width:30px;height:30px;border-width:3px"></div><div style="margin-top:14px;color:var(--muted)">Загрузка данных...</div></div>';
  await loadData();
  render();
  
  // Кнопка админки (плавающая)
  const adminBtn = document.createElement('button');
  adminBtn.className = 'admin-btn';
  adminBtn.innerHTML = '✏️';
  adminBtn.title = 'Редактировать';
  adminBtn.onclick = () => { haptic('hard'); openAdmin(); };
  document.body.appendChild(adminBtn);
})();
</script>

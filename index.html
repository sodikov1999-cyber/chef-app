<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ШефБук</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F0D0B;--card:#1B1613;--text:#F5ECE2;--muted:#9C8D7E;--accent:#FF8A3D;--accent-soft:rgba(255,138,61,.14);--green:#5FD38A;--blue:#6FA8FF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
h1,h2{font-family:'Unbounded',sans-serif;margin-bottom:20px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,.08)}

/* КРАСИВЫЙ ЛОАДЕР */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.loader-spinner{width:50px;height:50px;border:3px solid rgba(255,138,61,.2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{color:var(--muted);font-size:14px;margin-bottom:6px}
.loader-sub{color:var(--muted);font-size:12px;opacity:.6}
.pulse-dot{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin:0 2px;animation:pulseDot 1.4s ease-in-out infinite}
.pulse-dot:nth-child(2){animation-delay:.2s}
.pulse-dot:nth-child(3){animation-delay:.4s}
@keyframes pulseDot{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}

/* СКЕЛЕТОНЫ (серые прямоугольники пока грузится) */
.skeleton{background:linear-gradient(90deg,#1B1613 0%,#221B16 50%,#1B1613 100%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:12px;margin-bottom:12px}
.skeleton.card{height:80px}
.skeleton.title{height:28px;width:60%;margin-bottom:20px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

.btn{display:block;width:100%;padding:16px;background:var(--accent);color:#000;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px;text-align:left}
.btn:active{transform:scale(.98)}
.pulse{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:20px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.08);cursor:pointer;animation:fadeIn .4s both}
.tile:active{transform:scale(.97)}
.tile-emoji{font-size:32px;margin-bottom:8px}
.tile-title{font-weight:600;font-size:14px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:4px}
.recipe{margin-bottom:12px;padding:16px;background:rgba(255,255,255,.03);border-radius:12px;cursor:pointer}
.recipe:active{background:rgba(255,255,255,.06)}
.recipe-name{font-weight:600;margin-bottom:4px}
.recipe-meta{font-size:12px;color:var(--muted)}
.back{display:inline-block;padding:8px 16px;background:rgba(255,255,255,.08);border-radius:10px;color:var(--text);text-decoration:none;margin-bottom:20px;cursor:pointer;border:none;font-size:14px}
.ingredient{padding:12px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between}
.ingredient:last-child{border:none}
.step{padding:12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent)}
.shift{padding:16px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:10px}
.shift-time{font-weight:600;font-size:18px;color:var(--accent)}
.shift-type{font-size:12px;color:var(--muted);margin-top:4px}
.news{padding:14px;background:rgba(255,138,61,.08);border-radius:12px;margin-bottom:10px;border-left:3px solid var(--accent)}
.news-title{font-weight:600;margin-bottom:4px}
.news-text{font-size:13px;color:var(--muted)}
.news-date{font-size:11px;color:var(--muted);margin-top:6px}
.check-item{display:flex;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.check-item:last-child{border:none}
.check-box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.check-item.done .check-box{background:var(--green);border-color:var(--green)}
.check-item.done .check-box::after{content:'✓';color:#000;font-weight:bold}
.check-item.done span{text-decoration:line-through;color:var(--muted)}
.fade-in{animation:fadeIn .4s ease-out both}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div id="app">
  <div class="loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">ШефБук</div>
    <div class="loader-sub">
      <span class="pulse-dot"></span>
      <span class="pulse-dot"></span>
      <span class="pulse-dot"></span>
    </div>
  </div>
</div>

<script>
// ===== ВАЖНО: ЗАМЕНИ ЭТИ ЗНАЧЕНИЯ НА СВОИ =====
const SUPABASE_URL = 'zduiaodltjrmibinysmi';
const SUPABASE_KEY = 'sb_publishable_pf8p6bBcJWnQDJx46lFzCQ_AUZb_rQH';
// ===============================================

const tg = window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand()}

const $ = s => document.querySelector(s);
const app = $('#app');

// API клиент с кэшированием
const CACHE_PREFIX = 'chef_';
const CACHE_TTL = 5 * 60 * 1000; // 5 минут

const api = {
  async get(table, params=''){
    const cacheKey = CACHE_PREFIX + table + '_' + params;
    const cached = localStorage.getItem(cacheKey);
    
    // Если есть свежие данные в кэше — возвращаем их МГНОВЕННО
    if (cached) {
      try {
        const data = JSON.parse(cached);
        if (Date.now() - data.time < CACHE_TTL) {
          // Фоновое обновление (не блокирует показ)
          this.fetchAndCache(table, params, cacheKey);
          return data.value;
        }
      } catch(e) {}
    }
    
    // Иначе грузим с сервера
    return this.fetchAndCache(table, params, cacheKey);
  },
  
  async fetchAndCache(table, params, cacheKey) {
    const url = SUPABASE_URL + '/rest/v1/' + table + (params?'?'+params:'');
    try {
      const res = await fetch(url, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY
        }
      });
      const value = await res.json();
      localStorage.setItem(cacheKey, JSON.stringify({ value, time: Date.now() }));
      return value;
    } catch(e) {
      // Если сервер недоступен — пытаемся вернуть старые данные из кэша
      const cached = localStorage.getItem(cacheKey);
      if (cached) {
        try { return JSON.parse(cached).value; } catch(e2) {}
      }
      return [];
    }
  }
};

// Роутер
let currentView = 'home';
let currentRecipe = null;

function navigate(view, data){
  currentView = view;
  if(data) currentRecipe = data;
  render();
}

function render(){
  if(currentView === 'home') renderHome();
  else if(currentView === 'ttk') renderTTK();
  else if(currentView === 'recipe') renderRecipe();
  else if(currentView === 'schedule') renderSchedule();
  else if(currentView === 'checklist') renderChecklist();
  else if(currentView === 'team') renderTeam();
}

async function renderHome(){
  // СРАЗУ показываем красивые скелетоны вместо текста "Загрузка..."
  app.innerHTML = `
    <div class="skeleton title"></div>
    <div class="skeleton card"></div>
    <div class="grid" style="margin-bottom:20px">
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:100px"></div>
      <div class="skeleton" style="height:100px"></div>
    </div>
    <div class="skeleton title" style="width:40%"></div>
    <div class="skeleton card"></div>
    <div class="skeleton card"></div>
  `;
  
  const [recipes, news] = await Promise.all([
    api.get('recipes', 'order=position.asc'),
    api.get('news', 'order=date.desc')
  ]);

  const today = new Date().toISOString().slice(0,10);
  const shifts = await api.get('shifts', `date=eq.${today}&order=type.asc`);

  let shiftHtml = '';
  if(shifts.length > 0){
    const shift = shifts[0];
    const types = {open:'Открытие',mid:'Усиление',close:'Закрытие'};
    const times = {open:'09:00–17:00',mid:'12:00–20:00',close:'15:00–23:00'};
    shiftHtml = `
      <div class="card fade-in">
        <span class="pulse"></span>Сегодня
        <div style="margin-top:12px">
          <div class="shift-time">${times[shift.type]}</div>
          <div class="shift-type">${types[shift.type]}</div>
        </div>
      </div>
    `;
  } else {
    shiftHtml = '<div class="card fade-in">🎉 Сегодня выходной</div>';
  }

  app.innerHTML = `
    <h1 class="fade-in">ШефБук 👨‍🍳</h1>
    ${shiftHtml}
    
    <div class="grid" style="margin-bottom:20px">
      <div class="tile" style="animation-delay:.05s" onclick="navigate('ttk')">
        <div class="tile-emoji">📖</div>
        <div class="tile-title">ТТК</div>
        <div class="tile-desc">Техкарты</div>
      </div>
      <div class="tile" style="animation-delay:.1s" onclick="navigate('schedule')">
        <div class="tile-emoji">🗓</div>
        <div class="tile-title">График</div>
        <div class="tile-desc">Смены</div>
      </div>
      <div class="tile" style="animation-delay:.15s" onclick="navigate('checklist')">
        <div class="tile-emoji">✅</div>
        <div class="tile-title">Чек-лист</div>
        <div class="tile-desc">Открытие</div>
      </div>
      <div class="tile" style="animation-delay:.2s" onclick="navigate('team')">
        <div class="tile-emoji">👥</div>
        <div class="tile-title">Команда</div>
        <div class="tile-desc">Контакты</div>
      </div>
    </div>

    <h2 class="fade-in">Объявления</h2>
    ${news.length ? news.slice(0,3).map((n,i) => `
      <div class="news fade-in" style="animation-delay:${.25+i*.05}s">
        <div class="news-title">${n.tag}</div>
        <div class="news-text">${n.title}</div>
        <div class="news-date">${new Date(n.date).toLocaleDateString('ru-RU')}</div>
      </div>
    `).join('') : '<div class="card fade-in">Нет объявлений</div>'}
  `;
}

  app.innerHTML = `
    <h1>ШефБук 👨‍🍳</h1>
    ${shiftHtml}
    
    <div class="grid" style="margin-bottom:20px">
      <div class="tile" onclick="navigate('ttk')">
        <div class="tile-emoji">📖</div>
        <div class="tile-title">ТТК</div>
        <div class="tile-desc">Техкарты</div>
      </div>
      <div class="tile" onclick="navigate('schedule')">
        <div class="tile-emoji">🗓</div>
        <div class="tile-title">График</div>
        <div class="tile-desc">Смены</div>
      </div>
      <div class="tile" onclick="navigate('checklist')">
        <div class="tile-emoji">✅</div>
        <div class="tile-title">Чек-лист</div>
        <div class="tile-desc">Открытие</div>
      </div>
      <div class="tile" onclick="navigate('team')">
        <div class="tile-emoji">👥</div>
        <div class="tile-title">Команда</div>
        <div class="tile-desc">Контакты</div>
      </div>
    </div>

    <h2>Объявления</h2>
    ${news.length ? news.slice(0,3).map(n => `
      <div class="news">
        <div class="news-title">${n.tag}</div>
        <div class="news-text">${n.title}</div>
        <div class="news-date">${new Date(n.date).toLocaleDateString('ru-RU')}</div>
      </div>
    `).join('') : '<div class="card">Нет объявлений</div>'}
  `;
}

async function renderTTK(){
  app.innerHTML = '<div class="loading">Загрузка...</div>';
  const recipes = await api.get('recipes', 'order=position.asc');
  
  app.innerHTML = `
    <button class="back" onclick="navigate('home')">← Назад</button>
    <h1>Техкарты</h1>
    ${recipes.map(r => `
      <div class="recipe" onclick="navigate('recipe', ${r.id})">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">${r.time} · ${r.yield_g}</div>
      </div>
    `).join('')}
  `;
}

async function renderRecipe(){
  app.innerHTML = '<div class="loading">Загрузка...</div>';
  
  const [recipe, ingredients, steps] = await Promise.all([
    api.get('recipes', `id=eq.${currentRecipe}&limit=1`).then(r => r[0]),
    api.get('ingredients', `recipe_id=eq.${currentRecipe}&order=position.asc`),
    api.get('steps', `recipe_id=eq.${currentRecipe}&order=position.asc`)
  ]);

  app.innerHTML = `
    <button class="back" onclick="navigate('ttk')">← Назад</button>
    <h1>${recipe.name}</h1>
    
    <div class="card">
      <div style="margin-bottom:12px"><strong>Время:</strong> ${recipe.time}</div>
      <div style="margin-bottom:12px"><strong>Выход:</strong> ${recipe.yield_g}</div>
      <div><strong>Калорийность:</strong> ${recipe.kcal} ккал</div>
    </div>

    <h2>Ингредиенты</h2>
    <div class="card">
      ${ingredients.map(i => `
        <div class="ingredient">
          <span>${i.name}</span>
          <strong>${i.netto} г</strong>
        </div>
      `).join('')}
    </div>

    <h2>Приготовление</h2>
    ${steps.map((s, idx) => `
      <div class="step">
        <strong>${idx + 1}.</strong> ${s.text}
      </div>
    `).join('')}

    ${recipe.note ? `
      <div class="card" style="margin-top:20px;background:rgba(95,211,138,.1);border-left:3px solid var(--green)">
        <strong>📝 Важно:</strong><br>${recipe.note}
      </div>
    ` : ''}
  `;
}

async function renderSchedule(){
  app.innerHTML = '<div class="loading">Загрузка...</div>';
  
  const today = new Date();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - today.getDay() + 1);
  
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  
  const shifts = await api.get('shifts', `date=gte.${weekStart.toISOString().slice(0,10)}&date=lte.${weekEnd.toISOString().slice(0,10)}&order=date.asc,type.asc`);
  
  const byDate = {};
  shifts.forEach(s => {
    if(!byDate[s.date]) byDate[s.date] = [];
    byDate[s.date].push(s);
  });

  const types = {open:'Открытие',mid:'Усиление',close:'Закрытие'};
  const times = {open:'09:00–17:00',mid:'12:00–20:00',close:'15:00–23:00'};

  app.innerHTML = `
    <button class="back" onclick="navigate('home')">← Назад</button>
    <h1>График смен</h1>
    ${Object.keys(byDate).map(date => {
      const d = new Date(date);
      const dayName = d.toLocaleDateString('ru-RU', {weekday:'short', day:'numeric', month:'short'});
      return `
        <h2 style="margin-top:24px">${dayName}</h2>
        ${byDate[date].map(s => `
          <div class="shift">
            <div class="shift-time">${times[s.type]}</div>
            <div class="shift-type">${types[s.type]}</div>
          </div>
        `).join('')}
      `;
    }).join('')}
  `;
}

async function renderChecklist(){
  const items = [
    'Включить вентиляцию, разогреть печи',
    'Проверить температурные листы холодильников',
    'Принять поставку, сверить накладные',
    'Обновить заготовки по стоп-листу',
    'Санобработка поверхностей и инвентаря',
    'Проверить кассу и терминал',
    'Выставить меню-борды и витрину'
  ];

  const saved = JSON.parse(localStorage.getItem('checklist_' + new Date().toISOString().slice(0,10)) || '[]');

  app.innerHTML = `
    <button class="back" onclick="navigate('home')">← Назад</button>
    <h1>Чек-лист открытия</h1>
    <div class="card">
      ${items.map((item, idx) => `
        <div class="check-item ${saved.includes(idx)?'done':''}" onclick="toggleCheck(${idx})">
          <div class="check-box"></div>
          <span>${item}</span>
        </div>
      `).join('')}
    </div>
  `;
}

window.toggleCheck = function(idx){
  const today = new Date().toISOString().slice(0,10);
  const saved = JSON.parse(localStorage.getItem('checklist_' + today) || '[]');
  
  if(saved.includes(idx)){
    saved.splice(saved.indexOf(idx), 1);
  } else {
    saved.push(idx);
  }
  
  localStorage.setItem('checklist_' + today, JSON.stringify(saved));
  renderChecklist();
};

async function renderTeam(){
  app.innerHTML = '<div class="loading">Загрузка...</div>';
  const users = await api.get('users', 'order=position.asc');
  
  app.innerHTML = `
    <button class="back" onclick="navigate('home')">← Назад</button>
    <h1>Команда</h1>
    ${users.map(u => `
      <div class="card">
        <div style="font-weight:600;margin-bottom:4px">${u.first_name} ${u.last_name || ''}</div>
        <div style="color:var(--muted);font-size:14px">${u.role}</div>
      </div>
    `).join('')}
  `;
}

// Старт
render();
</script>

</body>
</html>

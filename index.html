<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#0F0D0B;--card:#1B1613;--text:#F5ECE2;--muted:#9C8D7E;--accent:#FF8A3D;--accent-soft:rgba(255,138,61,.14);--green:#5FD38A;--red:#FF6B5E;--glass:rgba(27,22,19,0.85);--glass-border:rgba(255,255,255,0.1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-user-select:none;user-select:none;touch-action:manipulation}
::-webkit-scrollbar{width:0;height:0}
button{font:inherit;color:inherit}
#app{position:relative;width:100%;height:100vh;overflow:hidden}
.screen{position:absolute;top:0;left:0;right:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:20px;padding-bottom:40px;touch-action:pan-y;overscroll-behavior:contain}
.hscroll{touch-action:pan-x;overscroll-behavior-x:contain}
h1{font-weight:800;font-size:26px;margin-bottom:16px;letter-spacing:-.02em}
h2{font-weight:700;font-size:18px;margin:22px 0 12px;letter-spacing:-.01em}
h3{font-weight:700;font-size:16px;margin:18px 0 10px;color:var(--accent)}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.tile{padding:18px 14px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.06);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;min-height:44px}
.tile:active{transform:scale(.97)}
.tile-emoji{font-size:28px;margin-bottom:8px}
.tile-title{font-weight:700;font-size:15px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
.pulse{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.btn{display:block;width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:center;min-height:44px}
.btn:active{transform:scale(.98)}
.btn-sec{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;background:rgba(255,255,255,.08);border-radius:50%;color:var(--text);margin-bottom:16px;cursor:pointer;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);touch-action:manipulation}
.back svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.recipe{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;cursor:pointer;border:none;width:100%;text-align:left;color:inherit;font:inherit}
.recipe:active{background:rgba(255,255,255,.07)}
.recipe-name{font-weight:700;font-size:15px;margin-bottom:3px}
.recipe-meta{font-size:12px;color:var(--muted);letter-spacing:.01em}
.ingredient{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;font-size:14px}
.ingredient:last-child{border:none}
.ingredient b{color:var(--accent)}
.step{padding:12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent);font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word}
.step-num{display:inline-block;width:20px;height:20px;background:var(--accent-soft);color:var(--accent);border-radius:6px;text-align:center;line-height:20px;font-weight:700;font-size:11px;margin-right:8px;flex-shrink:0}
.news{padding:14px;background:rgba(255,138,61,.08);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--accent)}
.news-title{font-weight:700;font-size:14px;margin-bottom:3px}
.news-text{font-size:13px;color:var(--muted);line-height:1.4}
.news-date{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:.01em}
.check-item{display:flex;align-items:center;width:100%;min-height:44px;padding:12px 0;border:none;border-bottom:1px solid rgba(255,255,255,.06);background:none;cursor:pointer;text-align:left;color:inherit}
.check-item:last-child{border:none}
.check-box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-right:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:bold;color:transparent;font-size:13px}
.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-item.done .check-label{text-decoration:line-through;color:var(--muted)}
.kpi{display:flex;gap:8px;margin-bottom:14px}
.kpi-box{flex:1;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;text-align:center}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.01em}
.kpi-value{font-weight:700;font-size:14px}
.mults{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mult{padding:7px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:99px;font-size:13px;font-weight:700;cursor:pointer;color:var(--text)}
.mult.on{background:var(--accent);color:#000;border-color:var(--accent)}
.user{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#FFB067,var(--accent));display:flex;align-items:center;justify-content:center;font-weight:700;color:#000;flex-shrink:0}
.user-info b{display:block;font-size:15px}
.user-info span{font-size:12px;color:var(--muted)}
.note{padding:14px;background:rgba(95,211,138,.1);border-left:3px solid var(--green);border-radius:10px;margin-top:14px;font-size:13px;line-height:1.5}
.admin-btn{position:fixed;bottom:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(255,138,61,.4);font-size:20px;z-index:100}
.admin-btn:active{transform:scale(.9)}
.order-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.order-btn.on{background:var(--green);border-color:var(--green);color:#000}
.cart-fab{position:fixed;bottom:14px;right:70px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(255,138,61,.4);font-size:18px;z-index:100;display:flex;align-items:center;justify-content:center}
.cart-fab:active{transform:scale(.9)}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--green);color:#000;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.cart-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.cart-item:last-child{border:none}
.cart-name{flex:1;font-size:14px;min-width:0}
.cart-supplier{font-size:11px;color:var(--muted);display:block}
.cart-qty-wrap{display:flex;align-items:center;gap:6px}
.cart-qty-btn{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.08);border:none;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-qty-btn:active{background:rgba(255,255,255,.15)}
.cart-qty-input{width:56px;height:32px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--text);font-size:15px;font-weight:700;text-align:center;outline:none;padding:0 4px}
.cart-qty-input:focus{border-color:var(--accent)}
/* Панели: позиции ведутся springs из JS — CSS-переходов нет */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.sheet{position:relative;width:100%;max-width:500px;background:var(--glass);border-radius:20px 20px 0 0;transform:translateY(100%);will-change:transform;touch-action:none;box-shadow:0 -8px 32px rgba(0,0,0,.5),inset 0 1px 0 var(--glass-border);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border);display:flex;flex-direction:column;max-height:85vh;outline:none}
.sheet-handle{width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin:8px auto 0;flex-shrink:0}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;flex-shrink:0;cursor:grab}
.sheet-header:active{cursor:grabbing}
.sheet-title{font-weight:800;font-size:18px}
.sheet-close{background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 30px;touch-action:pan-y;overscroll-behavior:contain}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:250;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;height:90vh;display:flex;flex-direction:column;transform:translateY(100%);will-change:transform;outline:none}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px;flex-shrink:0}
.modal-title{font-weight:800;font-size:18px}
.modal-close{background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px}
.modal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 20px;touch-action:pan-y;overscroll-behavior:contain}
.form-field{margin-bottom:14px}
.form-label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.form-input,.form-textarea,.form-select{width:100%;padding:12px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--accent)}
.form-textarea{min-height:80px;resize:vertical}
.item-card{padding:14px;background:var(--card);border-radius:12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.06)}
.item-card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item-card-title{font-weight:700;font-size:15px}
.icon-btn{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border:none;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
.icon-btn:active{background:rgba(255,255,255,.1)}
.icon-btn.danger{background:rgba(255,107,94,.15);color:var(--red)}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--bg);padding:12px 22px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;z-index:300;max-width:85vw;text-align:center;will-change:transform,opacity;pointer-events:none}
.loader-inline{border:4px solid rgba(255,255,255,0.1);border-left-color:var(--accent);border-radius:50%;width:30px;height:30px;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-btn{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:20px;font-size:.9rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;margin-left:auto;min-height:36px}
.refresh-btn:active{transform:scale(.95)}
.tab-btn{flex:1;padding:10px;background:rgba(255,255,255,.05);border:none;color:var(--muted);font-weight:600;border-radius:8px;margin-right:4px;cursor:pointer;min-height:44px}
.tab-btn.on{background:var(--accent);color:#000}
.supplier-block{margin-bottom:20px}
.supplier-header{background:rgba(255,138,61,.1);border-left:3px solid var(--accent);padding:12px;border-radius:8px;margin-bottom:10px}
.supplier-name{font-weight:700;font-size:15px;color:var(--accent);margin-bottom:4px}
.supplier-schedule{font-size:12px;color:var(--muted);line-height:1.4}
.matrix-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.matrix-item:last-child{border-bottom:none}
.matrix-name{font-size:14px;font-weight:500;flex:1;padding-right:10px;word-break:break-word}
.matrix-meta{text-align:right;flex-shrink:0;margin-left:10px}
.matrix-unit{font-size:11px;color:var(--muted);display:block;letter-spacing:.01em}
.matrix-limit{font-size:13px;font-weight:700;color:var(--green)}
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.week-nav-btn{background:rgba(255,255,255,.1);border:none;color:var(--text);width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.week-nav-btn:active{background:var(--accent);color:#000}
.week-title{font-weight:700;font-size:14px;text-align:center;flex:1;color:var(--muted)}
.today-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:var(--text);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;min-height:32px}
.today-btn:active{background:var(--accent);color:#000;border-color:var(--accent)}
.day-card{flex:1;text-align:center;padding:8px 4px;background:var(--card);border-radius:10px;color:var(--text);cursor:pointer;border:2px solid transparent;min-width:45px;font:inherit}
.day-card:active{transform:scale(.92)}
.day-card.selected{background:var(--accent);color:#000;border-color:#fff}
.day-card.today{border-color:var(--green)}
.day-card .dow-name{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.day-card.selected .dow-name{color:#000}
.day-card .day-num{font-weight:800;font-size:17px;margin:3px 0}
.day-card .count{font-size:11px;color:var(--muted)}
.day-card.selected .count{color:#000}
.loc-head{width:100%;padding:16px;background:transparent;border:none;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font:inherit;min-height:44px}
.chev{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;flex-shrink:0;will-change:transform}
.acc-wrap{overflow:hidden}
.recipe-detail-container{width:100%;padding-bottom:20px}
.recipe-detail-container .ingredient,.recipe-detail-container .step{word-wrap:break-word;overflow-wrap:break-word;white-space:normal}
/* G016/AC013: интерактивная зона ≥44px при любом визуальном размере */
.tap44{position:relative}
.tap44::after{content:'';position:absolute;top:50%;left:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
@media (prefers-reduced-motion:reduce){
*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (prefers-reduced-transparency:reduce){
.sheet,.modal,.back{background:var(--card)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.modal-bg{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
}
@media (prefers-contrast:more){
.card,.tile,.item-card,.recipe{border:1px solid rgba(255,255,255,.5)}
.sheet,.modal{border:1px solid rgba(255,255,255,.5)}
}
</style>
</head>

/* ================= S001–S025: STATE MACHINE ================= */
function createSM(initial,table){
  let state=initial;
  return{
    get state(){return state;},
    is(s){return state===s;},
    send(evt){
      const next=table[state]?.[evt];
      if(!next)return false;
      state=next;
      return true;
    }
  };
}

/* ================= PHYSICS ================= */
function springAnimate({from,to,velocity=0,onUpdate,onComplete,stiffness=520,damping=28,mass=1}){
  if(REDUCED_MOTION.matches){onUpdate(to,0);if(onComplete)onComplete();return{cancel(){},getVelocity(){return 0;}};}
  let current=from,vel=velocity,rafId=null,lastTime=performance.now(),running=true;
  function tick(now){
    if(!running)return;
    const dt=Math.min((now-lastTime)/1000,0.05);
    lastTime=now;
    const acc=(-stiffness*(current-to)-damping*vel)/mass;
    vel+=acc*dt;
    current+=vel*dt;
    onUpdate(current,vel);
    if(Math.abs(current-to)<0.5&&Math.abs(vel)<0.5){
      onUpdate(to,0);
      if(onComplete)onComplete();
      return;
    }
    rafId=requestAnimationFrame(tick);
  }
  rafId=requestAnimationFrame(tick);
  return{
    cancel(){running=false;if(rafId)cancelAnimationFrame(rafId);},
    getVelocity(){return vel;}
  };
}
function rubberband(overshoot,dimension,constant=0.55){
  return(overshoot*dimension*constant)/(dimension+constant*Math.abs(overshoot));
}
function project(initialVelocity,decelerationRate=0.998){
  return(initialVelocity/1000)*decelerationRate/(1-decelerationRate);
}
function velFromHistory(h){
  const now=performance.now();
  const rec=h.filter(p=>now-p.t<100);
  if(rec.length<2)return 0;
  const a=rec[0],b=rec[rec.length-1],dt=b.t-a.t;
  return dt>0?(b.y-a.y)/dt*1000:0;
}
function popEl(el,from=0.5){
  if(!el)return;
  springAnimate({from,to:1,velocity:0,stiffness:500,damping:18,
    onUpdate:s=>{el.style.transform=`scale(${s})`;},
    onComplete:()=>{el.style.transform='';}});
}
/* Аккордеон: spring по высоте + прозрачность */
const heightState=new WeakMap();
function springHeight(el,open){
  let st=heightState.get(el);
  if(!st){st={v:0,anim:null};heightState.set(el,st);}
  const startH=el.getBoundingClientRect().height;
  const target=open?el.firstElementChild.offsetHeight:0;
  if(st.anim)st.anim.cancel();
  el.style.height=startH+'px';
  st.anim=springAnimate({from:startH,to:target,velocity:st.v,stiffness:420,damping:36,
    onUpdate:(h,v)=>{
      st.v=v;
      el.style.height=h+'px';
      el.style.opacity=String(clamp(h/Math.max(open?target:startH,1),0,1));
    },
    onComplete:()=>{
      st.v=0;
      el.style.height=open?'auto':'0px';
      el.style.opacity=open?'1':'0';
    }});
}

function springRotate(el,to){
  if(!el)return;
  let st=rotState.get(el);
  if(!st){st={deg:parseFloat(el.dataset.rot||'0'),v:0,anim:null};rotState.set(el,st);}
  if(st.anim)st.anim.cancel();
  st.anim=springAnimate({from:st.deg,to,velocity:st.v,stiffness:420,damping:30,
    onUpdate:(d,v)=>{st.deg=d;st.v=v;el.style.transform=`rotate(${d}deg)`;},
    onComplete:()=>{st.v=0;}});
}

/* ================= FOCUS / A11Y ================= */
function trapFocus(container,e){
  if(e.key!=='Tab')return;
  const f=[...container.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled&&el.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
function focusFirst(container){
  const f=container.querySelector('input,select,textarea,button:not(.sheet-close):not(.modal-close)');
  try{(f||container).focus({preventScroll:true});}catch(e){}
}

/* ================= TOAST (spring) ================= */
let toastEl=null,toastAnim=null,toastTimer=null;
function toast(msg,type='info'){
  if(toastEl){toastAnim?.cancel();clearTimeout(toastTimer);toastEl.remove();toastEl=null;}
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;t.setAttribute('role','status');
  if(type==='error'){t.style.background='var(--red)';t.style.color='#fff';}
  if(type==='success'){t.style.background='var(--green)';t.style.color='#000';}
  document.body.appendChild(t);
  toastEl=t;
  const apply=y=>{
    t.style.transform=`translateX(-50%) translateY(${y}px)`;
    t.style.opacity=String(clamp(1-y/100,0,1));
  };
  toastAnim=springAnimate({from:100,to:0,velocity:0,stiffness:300,damping:20,
    onUpdate:apply,
    onComplete:()=>{
      toastTimer=setTimeout(()=>{
        toastAnim=springAnimate({from:0,to:100,velocity:0,stiffness:420,damping:34,
          onUpdate:apply,
          onComplete:()=>{t.remove();if(toastEl===t)toastEl=null;}});
      },2500);
    }});
}

function getCurrentScreen(){

  if(prevScreen&&prevScreen!==app){

    screenAnim=springAnimate({from:100,to:0,velocity:0,stiffness:450,damping:42,
      onUpdate:x=>{
        newScreen.style.transform=`translateX(${x}%)`;
        prevScreen.style.transform=`translateX(${x*0.3-30}%)`;
        prevScreen.style.opacity=Math.max(0.4,1-x/150);

function goBack(){

/* ================= SWIPE-BACK: Pointer Events + SM ================= */
const swipe={
  sm:createSM('idle',{
    idle:{TRACK:'tracking'},
    tracking:{DRAG:'dragging',CANCEL:'idle'},
    dragging:{SETTLE:'settling',CANCEL:'idle'},
    settling:{DONE:'idle',TRACK:'tracking'}
  }),
  pointerId:null,startX:0,baseX:0,x:0,cur:null,prev:null,anim:null,history:[]
};
function initSwipeBack(){
  if(!window.PointerEvent)return;
  document.addEventListener('pointerdown',e=>{
    if(viewStack.length<=1)return;
    if(sheetStates.size||modalStates.size)return;
    if(e.clientX>50)return;
    if(!swipe.sm.is('idle')&&!swipe.sm.is('settling'))return;
    if(swipe.sm.is('settling')&&swipe.anim){swipe.anim.cancel();swipe.anim=null;}
    const screens=app.querySelectorAll('.screen');
    const cur=screens[screens.length-1];
    if(!cur)return;
    swipe.cur=cur;
    swipe.prev=screens.length>1?screens[screens.length-2]:null;
    swipe.pointerId=e.pointerId;
    swipe.startX=e.clientX;
    swipe.baseX=swipe.sm.is('settling')?(swipe.x||0):0;
    swipe.history=[];
    swipe.sm.send('TRACK');
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(swipe.pointerId!==e.pointerId)return;
    if(swipe.sm.is('tracking')){
      const dx=e.clientX-swipe.startX;
      const dy=e.clientY-(swipe.startY||e.clientY);
      if(swipe.startY===undefined)swipe.startY=e.clientY;
      if(dx<0||(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8)){
        swipe.sm.send('CANCEL');swipe.pointerId=null;swipe.startY=undefined;return;
      }
      if(dx>12&&Math.abs(dx)>Math.abs(dy)*1.5){
        if(!swipe.sm.send('DRAG'))return;
        try{swipe.cur.setPointerCapture(e.pointerId);}catch(_){}
        if(swipe.prev){
          swipe.prev.style.display='';
          swipe.prev.style.visibility='';
        }
      }else return;
    }
    if(!swipe.sm.is('dragging'))return;
    e.preventDefault();
    const dx=swipe.baseX+(e.clientX-swipe.startX);
    swipe.x=dx;
    swipe.history.push({x:e.clientX,t:performance.now()});
    if(swipe.history.length>8)swipe.history.shift();
    swipe.cur.style.transform=`translateX(${dx}px)`;
    if(swipe.prev){
      const pct=dx/window.innerWidth;
      swipe.prev.style.transform=`translateX(${(pct*30-30)}%)`;
      swipe.prev.style.opacity=Math.max(0.4,1-pct*0.6);
    }
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    if(swipe.pointerId!==e.pointerId)return;
    swipe.startY=undefined;
    if(swipe.sm.is('tracking')){swipe.sm.send('CANCEL');swipe.pointerId=null;return;}
    if(!swipe.sm.is('dragging'))return;
    swipe.sm.send('SETTLE');
    swipe.pointerId=null;
    const v=velFromHistory(swipe.history.map(h=>({y:h.x,t:h.t})));
    const projected=swipe.x+project(v);
    const commit=projected>window.innerWidth*0.4||v>900;
    settleSwipe(commit,v);
  });
  document.addEventListener('pointercancel',e=>{
    if(swipe.pointerId!==e.pointerId)return;
    swipe.startY=undefined;
    if(swipe.sm.is('tracking')){swipe.sm.send('CANCEL');swipe.pointerId=null;return;}
    if(!swipe.sm.is('dragging'))return;
    swipe.sm.send('SETTLE');
    swipe.pointerId=null;
    settleSwipe(false,0);
  });
}
function settleSwipe(commit,velocity){
  const cur=swipe.cur,prev=swipe.prev;
  if(swipe.anim)swipe.anim.cancel();
  swipe.anim=springAnimate({from:swipe.x,to:commit?window.innerWidth:0,velocity,stiffness:520,damping:32,
    onUpdate:x=>{
      swipe.x=x;
      cur.style.transform=`translateX(${x}px)`;
      if(prev){
        const p=x/window.innerWidth;
        prev.style.transform=`translateX(${(p*30-30)}%)`;
        prev.style.opacity=Math.max(0.4,1-p*0.6);
      }
    },
    onComplete:()=>{
      swipe.anim=null;
      swipe.sm.send('DONE');
      if(commit){
        viewStack.pop();
        const prevState=viewStack[viewStack.length-1];
        currentView=prevState.view;
        if(prevState.data!==undefined)currentRecipeId=prevState.data;
        cur.remove();
        if(prev){
          prev.classList.add('current');
          prev.style.transform='';prev.style.opacity='';
          currentScreen=prev;
        }
      }else{
        if(prev){prev.style.display='none';prev.style.visibility='hidden';prev.style.transform='';prev.style.opacity='';}
        cur.style.transform='';
      }
      swipe.cur=null;swipe.prev=null;swipe.x=0;
    }});
}

/* ================= SHEET (spring + SM + focus) ================= */
function openSheet(opts){
  closeSheetImmediate(opts.id);
  const bg=document.createElement('div');
  bg.className='sheet-bg';bg.id=opts.id;
  const sheet=document.createElement('div');
  sheet.className='sheet';
  sheet.setAttribute('role','dialog');
  sheet.setAttribute('aria-modal','true');
  sheet.setAttribute('aria-label',opts.title.replace(/[^\wа-яА-ЯёЁ \-]/g,''));
  sheet.setAttribute('tabindex','-1');
  sheet.innerHTML=`
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${opts.title}</div>
      <button class="sheet-close tap44" onclick="CB.closeSheet('${opts.id}')" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body">${opts.body}</div>`;
  bg.appendChild(sheet);
  document.body.appendChild(bg);
  const H=sheet.offsetHeight;
  const st={
    id:opts.id,bg,sheet,H,y:H,anim:null,drag:null,
    trigger:document.activeElement,
    onClosed:opts.onClosed,
    sm:createSM('closed',{
      closed:{OPEN:'opening'},
      opening:{OPENED:'open',GRAB:'dragging',CLOSE:'closing'},
      open:{GRAB:'dragging',CLOSE:'closing'},
      dragging:{SETTLE:'settling',CLOSE:'closing'},
      settling:{SETTLED:'open',GRAB:'dragging',CLOSE:'closing'},
      closing:{CLOSED:'closed',GRAB:'dragging'}
    })
  };
  sheetStates.set(opts.id,st);
  sheet.style.transform=`translateY(${H}px)`;
  bg.style.pointerEvents='auto';
  bg.addEventListener('click',e=>{if(e.target===bg)dismissSheet(st,0);});
  bg.addEventListener('keydown',e=>trapFocus(sheet,e));
  wireSheetDrag(st);
  st.sm.send('OPEN');
  st.anim=springAnimate({from:H,to:0,velocity:0,stiffness:440,damping:33,
    onUpdate:y=>setSheetPos(st,y),
    onComplete:()=>{st.anim=null;st.sm.send('OPENED');focusFirst(sheet);}});
  return st;
}
function setSheetPos(st,y){
  st.y=y;
  st.sheet.style.transform=`translateY(${y}px)`;
  const p=clamp(1-y/st.H,0,1);
  st.bg.style.background=`rgba(0,0,0,${(0.55*p).toFixed(3)})`;
}
function wireSheetDrag(st){
  const sheet=st.sheet;
  sheet.addEventListener('pointerdown',e=>{
    if(e.target.closest('button,input,textarea,select,a'))return;
    if(e.target.closest('.sheet-body'))return;
    const s=st.sm.state;
    if(s!=='open'&&s!=='opening'&&s!=='settling')return;
    e.preventDefault();
    if(st.anim){st.anim.cancel();st.anim=null;}
    if(!st.sm.send('GRAB'))return;
    st.drag={id:e.pointerId,startY:e.clientY,baseY:st.y,history:[]};
    try{sheet.setPointerCapture(e.pointerId);}catch(_){}
  });
  sheet.addEventListener('pointermove',e=>{
    const d=st.drag;
    if(!d||e.pointerId!==d.id)return;
    let y=d.baseY+(e.clientY-d.startY);
    if(y<0)y=-rubberband(-y,st.H*0.5,0.55);
    d.history.push({y:e.clientY,t:performance.now()});
    if(d.history.length>8)d.history.shift();
    setSheetPos(st,y);
  });
  const release=(e,cancelled)=>{
    const d=st.drag;
    if(!d||e.pointerId!==d.id)return;
    st.drag=null;
    if(!st.sm.is('dragging'))return;
    const v=cancelled?0:velFromHistory(d.history);
    const projected=st.y+project(v);
    if(projected>st.H*0.35||v>1000){
      dismissSheet(st,v);
    }else{
      st.sm.send('SETTLE');
      st.anim=springAnimate({from:st.y,to:0,velocity:v,stiffness:380,damping:32,
        onUpdate:y=>setSheetPos(st,y),
        onComplete:()=>{st.anim=null;st.sm.send('SETTLED');}});
    }
  };
  sheet.addEventListener('pointerup',e=>release(e,false));
  sheet.addEventListener('pointercancel',e=>release(e,true));
}
function dismissSheet(st,velocity){
  if(!st)return;
  const s=st.sm.state;
  if(s==='closing'||s==='closed')return;
  st.sm.send('CLOSE');
  if(st.anim)st.anim.cancel();
  st.anim=springAnimate({from:st.y,to:st.H,velocity:velocity||0,stiffness:440,damping:36,
    onUpdate:y=>setSheetPos(st,y),
    onComplete:()=>removeSheet(st)});
}
function removeSheet(st){
  st.sm.send('CLOSED');
  st.bg.remove();
  sheetStates.delete(st.id);
  if(st.trigger&&document.contains(st.trigger)){try{st.trigger.focus({preventScroll:true});}catch(e){}}
  if(st.onClosed)st.onClosed();
}
function closeSheet(id){
  const st=sheetStates.get(id);
  if(st){haptic();dismissSheet(st,0);}
}
function closeSheetImmediate(id){
  const st=sheetStates.get(id);
  if(!st)return;
  if(st.anim)st.anim.cancel();
  st.bg.remove();
  sheetStates.delete(id);
}

/* ================= MODAL (spring + focus trap) ================= */
function openModal(opts){
  closeModalImmediate(opts.id);
  const bg=document.createElement('div');
  bg.className='modal-bg';bg.id=opts.id;
  const modal=document.createElement('div');
  modal.className='modal';
  modal.setAttribute('role','dialog');
  modal.setAttribute('aria-modal','true');
  modal.setAttribute('aria-label',opts.title.replace(/[^\wа-яА-ЯёЁ \-]/g,''));
  modal.setAttribute('tabindex','-1');
  modal.innerHTML=`
    <div class="modal-header">
      <div class="modal-title">${opts.title}</div>
      <button class="modal-close tap44" onclick="CB.closeModal('${opts.id}')" aria-label="Закрыть">✕</button>
    </div>
    <div class="modal-body">${opts.body}</div>`;
  bg.appendChild(modal);
  document.body.appendChild(bg);
  const H=modal.offsetHeight;
  const st={id:opts.id,bg,modal,H,y:0,anim:null,closing:false,trigger:document.activeElement};
  modalStates.set(opts.id,st);
  bg.style.background='rgba(0,0,0,0)';
  modal.style.transform=`translateY(${H}px)`;
  bg.addEventListener('keydown',e=>trapFocus(modal,e));
  st.anim=springAnimate({from:H,to:0,velocity:0,stiffness:440,damping:33,
    onUpdate:y=>setModalPos(st,y),
    onComplete:()=>{st.anim=null;focusFirst(modal);}});
  return st;
}
function setModalPos(st,y){
  st.y=y;
  st.modal.style.transform=`translateY(${y}px)`;
  const p=clamp(1-y/st.H,0,1);
  st.bg.style.background=`rgba(0,0,0,${(0.7*p).toFixed(3)})`;
}
function closeModal(id){
  const st=modalStates.get(id);
  if(!st||st.closing)return;
  st.closing=true;
  if(st.anim)st.anim.cancel();
  st.anim=springAnimate({from:st.y,to:st.H,velocity:0,stiffness:480,damping:40,
    onUpdate:y=>setModalPos(st,y),
    onComplete:()=>{
      st.bg.remove();
      modalStates.delete(id);
      if(st.trigger&&document.contains(st.trigger)){try{st.trigger.focus({preventScroll:true});}catch(e){}}
    }});
}
function closeModalImmediate(id){
  const st=modalStates.get(id);
  if(!st)return;
  if(st.anim)st.anim.cancel();
  st.bg.remove();
  modalStates.delete(id);
}

</button>`;
async function fetchScheduleData(force=false,silent=false){
  if(isLoading)return;
  isLoading=true;
  if(!force&&scheduleData){isLoading=false;return;}
  try{
    const response=await fetch(SHEET_URL+'&t='+Date.now());
    if(!response.ok)throw new Error('Ошибка сети: '+response.status);
    const parsed=parseComplexCSV(await response.text());
    if(parsed?.locations?.length){
      scheduleData=parsed;
      if(!silent)toast('Данные обновлены','success');
    }else throw new Error('Неверный формат данных');
  }catch(e){
    console.warn('Онлайн загрузка не удалась:',e);
    if(!scheduleData)scheduleData=DEFAULT_LOCAL_DATA;
    if(!silent)toast('Нет связи с сервером. Показаны локальные данные.','error');
  }finally{isLoading=false;}
}
function parseComplexCSV(csvText){
  const rows=csvText.split('\n').map(row=>{
    const result=[];let cell='',inQuotes=false;
    for(let i=0;i<row.length;i++){
      const char=row[i];
      if(char==='"')inQuotes=!inQuotes;
      else if(char===','&&!inQuotes){result.push(cell.trim());cell='';}
      else cell+=char;
    }
    result.push(cell.trim());
    return result;
  }).filter(r=>r.length>2);
  if(rows.length<5)return null;
  const locations=[];
  let currentLoc=null;
  for(const row of rows){
    const firstCell=(row[0]||'').trim().toLowerCase();
    if(firstCell.includes('итого')||firstCell.includes('дата')||firstCell.includes('локация')||
       firstCell===''||!isNaN(firstCell)||firstCell.includes('вск')||firstCell.includes('пн'))continue;
    const secondCell=(row[1]||'').trim();
    if(secondCell==='Должность'||secondCell===''){
      if(row[0]&&row[0].trim()!==''&&!row[0].includes('итого')){
        currentLoc={name:row[0].trim(),staff:[]};
        locations.push(currentLoc);
      }
    }else if(currentLoc){
      const shifts=[];
      for(let d=2;d<Math.min(row.length-2,33);d++){
        let val=row[d];
        if(val&&val.includes(','))val=val.replace(',','.');
        let num=parseFloat(val);
        if(isNaN(num))num=0;
        shifts.push(num);
      }
      currentLoc.staff.push({name:row[0].trim(),role:secondCell,shifts,total:shifts.reduce((a,b)=>a+b,0)});
    }
  }
  return locations.length?{month:'Август 2026',locations}:null;
}

  if(!saved[type])saved[type]=[];
  const idx=saved[type].indexOf(i);
  let nowDone;
  if(idx>=0){saved[type].splice(idx,1);nowDone=false;}
  else{saved[type].push(i);nowDone=true;}

const cartFab=document.createElement('button');

function updateCartFab(){

function cartBodyHTML(){
  const grouped={};
  orderCart.forEach((c,i)=>{
    if(!grouped[c.supplier])grouped[c.supplier]=[];
    grouped[c.supplier].push({...c,idx:i});
  });
  return Object.entries(grouped).map(([sup,items])=>`
  <div style="margin-bottom:16px">
    <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:8px">${esc(sup)}</div>

    <div class="cart-item">

        <span class="cart-supplier">${esc(it.unit)}</span>
      </div>
      <div class="cart-qty-wrap">
        <button class="cart-qty-btn tap44" onclick="CB.updateCartQty(${it.idx},-1)" aria-label="Уменьшить">−</button>
        <input class="cart-qty-input" type="text" inputmode="decimal" data-cidx="${it.idx}" value="${it.qty}"
          aria-label="Количество: ${esc(it.name)}" onchange="CB.setCartQty(${it.idx},this.value)" onclick="this.select()">
        <button class="cart-qty-btn tap44" onclick="CB.updateCartQty(${it.idx},1)" aria-label="Увеличить">+</button>
      </div>
      <button class="icon-btn danger tap44" style="width:28px;height:28px" onclick="CB.deleteCartItem(${it.idx})" aria-label="Удалить">✕</button>
    </div>`).join('')}
  </div>`).join('')+`
  <button class="btn" onclick="CB.copyOrder()" style="margin-top:8px">📋 Скопировать заявку</button>
  <button class="btn btn-sec" onclick="CB.clearCart()" style="margin-top:8px">🗑 Очистить</button>`;
}
function renderCartSheet(){
  const st=sheetStates.get('cart-sheet-bg');
  if(st){
    st.sheet.querySelector('.sheet-title').textContent=`📋 Заявка (${orderCart.length})`;
    st.sheet.querySelector('.sheet-body').innerHTML=cartBodyHTML();
  }else{
    openSheet({id:'cart-sheet-bg',title:`📋 Заявка (${orderCart.length})`,body:cartBodyHTML()});
  }
}
function updateCartQty(idx,delta){
  if(!orderCart[idx])return;
  haptic();
  orderCart[idx].qty=Math.max(0.01,parseFloat((orderCart[idx].qty+delta).toFixed(3)));
  saveData();
  updateCartFab();
  const inp=document.querySelector(`.cart-qty-input[data-cidx="${idx}"]`);
  if(inp)inp.value=orderCart[idx].qty;
  else renderCartSheet();
}
function setCartQty(idx,rawVal){
  const num=parseFloat(String(rawVal).replace(',','.').replace(/[^0-9.]/g,''));
  if(isNaN(num)||num<=0)orderCart.splice(idx,1);
  else orderCart[idx].qty=Math.round(num*1000)/1000;
  saveData();
  updateCartFab();
  renderCartSheet();
  if(orderCart.length===0)closeSheet('cart-sheet-bg');
}
function deleteCartItem(idx){
  haptic();
  orderCart.splice(idx,1);
  saveData();
  updateCartFab();
  renderCartSheet();
  if(orderCart.length===0)closeSheet('cart-sheet-bg');
}
function clearCart(){
  orderCart=[];
  saveData();
  updateCartFab();
  closeSheet('cart-sheet-bg');
  if(currentView==='matrix')renderMatrix();
}
function copyOrder(){
  if(!orderCart.length){toast('Корзина пуста','error');return;}
  const date=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
  const grouped={};
  orderCart.forEach(c=>{
    if(!grouped[c.supplier])grouped[c.supplier]=[];
    grouped[c.supplier].push(c);
  });
  let text=`📋 ЗАЯВКА НА ПОСТАВКУ\n${date}\n\n`;
  for(const [sup,items] of Object.entries(grouped)){
    text+=`📦 ${sup}\n`;
    items.forEach(it=>{text+=`• ${it.name} — ${it.qty} ${it.unit}\n`;});
    text+='\n';
  }
  text+='—\nОтправлено из ШефБук';
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>{toast('Скопировано! Вставьте в заметки','success');haptic('hard');})
      .catch(()=>fallbackCopy(text));
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text;
  ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);
  ta.select();
  try{document.execCommand('copy');toast('Скопировано! Вставьте в заметки','success');haptic('hard');}
  catch{toast('Не удалось скопировать','error');}
  ta.remove();
}

/* ================= ХРАНИЛИЩЕ / FIREBASE ================= */
function saveData(){
  internalSave=true;
  try{
    localStorage.setItem('chef_recipes',JSON.stringify(RECIPES));
    localStorage.setItem('chef_news',JSON.stringify(NEWS));
    localStorage.setItem('chef_team',JSON.stringify(TEAM));
    localStorage.setItem('chef_matrix',JSON.stringify(MATRIX_DATA));
    localStorage.setItem('chef_favorites',JSON.stringify(FAVORITES));
    localStorage.setItem('chef_cart',JSON.stringify(orderCart));
    window.dispatchEvent(new Event('local-storage-update'));
  }finally{
    internalSave=false;
  }
}
function reloadFromStorage(){
  if(internalSave)return;
  RECIPES=JSON.parse(localStorage.getItem('chef_recipes'))||DEFAULT_RECIPES;
  NEWS=JSON.parse(localStorage.getItem('chef_news'))||DEFAULT_NEWS;
  TEAM=JSON.parse(localStorage.getItem('chef_team'))||DEFAULT_TEAM;
  MATRIX_DATA=JSON.parse(localStorage.getItem('chef_matrix'))||DEFAULT_MATRIX;
  if(currentView==='home')renderHome();
  if(currentView==='ttk')renderTTK();
  if(currentView==='team')renderTeam();
  if(currentView==='matrix')renderMatrix();
}
window.addEventListener('storage',reloadFromStorage);
window.addEventListener('local-storage-update',reloadFromStorage);
async function syncToFirebase(){
  try{
    await fetch(`${FIREBASE_URL}${FB_PATH}.json`,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({recipes:RECIPES,news:NEWS,team:TEAM,matrix:MATRIX_DATA,favorites:FAVORITES,updatedAt:Date.now()})
    });
  }catch(e){console.warn('☁️ Ошибка синхронизации:',e.message);}
}
async function loadFromFirebase(){
  try{
    const res=await fetch(`${FIREBASE_URL}${FB_PATH}.json?t=${Date.now()}`);
    if(!res.ok)return false;
    const data=await res.json();
    if(data&&data.recipes){
      RECIPES=data.recipes;
      NEWS=data.news||DEFAULT_NEWS;
      TEAM=data.team||DEFAULT_TEAM;
      MATRIX_DATA=data.matrix||DEFAULT_MATRIX;
      FAVORITES=data.favorites||[];
      localStorage.setItem('chef_recipes',JSON.stringify(RECIPES));
      localStorage.setItem('chef_news',JSON.stringify(NEWS));
      localStorage.setItem('chef_team',JSON.stringify(TEAM));
      localStorage.setItem('chef_matrix',JSON.stringify(MATRIX_DATA));
      localStorage.setItem('chef_favorites',JSON.stringify(FAVORITES));
      return true;
    }
  }catch(e){console.warn('☁️ Не удалось загрузить из Firebase:',e.message);}
  return false;
}

/* ================= ПРОЧИЕ ДЕЙСТВИЯ ================= */
function toggleFavorite(id){
  haptic();
  const idx=FAVORITES.indexOf(id);
  if(idx>=0)FAVORITES.splice(idx,1);
  else FAVORITES.push(id);
  saveData();
  syncToFirebase();
  render();
}
function refreshTTKData(){
  RECIPES=JSON.parse(localStorage.getItem('chef_recipes'))||DEFAULT_RECIPES;
  ttkQ='';ttkCat='Все';
  const input=document.getElementById('ttk-search-input');
  if(input)input.value='';
  renderTTK();
  toast('Данные обновлены','success');
}
function handleRefresh(){
  currentWeekStart=null;
  selectedDayIndex=null;
  renderSchedule();
}
function changeWeek(offset){
  if(!currentWeekStart)return;
  haptic();
  const d=new Date(currentWeekStart);
  d.setDate(currentWeekStart.getDate()+offset*7);
  currentWeekStart=d;
  selectedDayIndex=null;
  renderScheduleContent();
}
function goToToday(){
  haptic();
  const today=new Date();
  const dow=today.getDay();
  currentWeekStart=new Date(today);
  currentWeekStart.setDate(today.getDate()+(dow===0?-6:1-dow));
  selectedDayIndex=today.getDate()-1;
  renderScheduleContent();
}
function selectDay(dayIndex){
  haptic();
  selectedDayIndex=dayIndex;
  renderScheduleContent();
}

/* iOS: фикс прыжка скролла при blur quantity-input */
document.addEventListener('focusout',e=>{
  if(e.target.classList?.contains('cart-qty-input')){
    const scroller=app.querySelector('.screen.current');
    if(!scroller)return;
    const st=scroller.scrollTop;
    requestAnimationFrame(()=>{
      scroller.scrollTop=st;
      requestAnimationFrame(()=>{scroller.scrollTop=st;});
    });
  }
});
/* Тап в верхней зоне — скролл наверх (как тап по статус-бару iOS) */
document.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  if(t.clientY<80&&viewStack.length>1&&!sheetStates.size&&!modalStates.size){
    const scroller=app.querySelector('.screen.current');
    if(scroller){
      scroller.scrollTo({top:0,behavior:'smooth'});
      haptic();
    }
  }
},{passive:true});

/* ================= ПУБЛИЧНЫЙ API ================= */
window.CB={
  navigate,goBack,openAdmin,closeSheet,closeModal,setAdminTab,
  editRecipe,deleteRecipe,saveRecipe,addIngr,addStep,
  editNews,saveNews,deleteNews,
  editTeamMember,saveTeamMember,deleteTeamMember,
  editSupplier,saveSupplier,deleteSupplier,addMatrixItem,
  toggleFavorite,setMult,setTtkCat,refreshTTKData,
  handleRefresh,changeWeek,goToToday,selectDay,toggleLoc,
  openChecklist(name){clLoc=name;renderChecklist();haptic();},
  closeChecklistLoc(){clLoc=null;renderChecklist();haptic();},
  setClTab(t){clTab=t;renderChecklist();haptic();},
  toggleCheckItem,saveManager(loc,name){
    const today=new Date().toISOString().slice(0,10);
    const key='cl_'+today+'_'+loc;
    const saved=JSON.parse(localStorage.getItem(key)||'{}');
    saved.manager=name;
    localStorage.setItem(key,JSON.stringify(saved));
    haptic();
    renderChecklist();
  },
  toggleOrder,updateCartQty,setCartQty,deleteCartItem,clearCart,copyOrder
};

/* ================= СТАРТ ================= */
initSwipeBack();
updateCartFab();
(async function init(){
  await loadFromFirebase();
  render();
})();
})();
</script>

(function(){
  var names=[
    'navigate','goBack','haptic','openAdmin','closeSheet','closeModal','setAdminTab',
    'editRecipe','deleteRecipe','saveRecipe','addIngr','addStep',
    'editNews','saveNews','deleteNews',
    'editTeamMember','saveTeamMember','deleteTeamMember',
    'editSupplier','saveSupplier','deleteSupplier','addMatrixItem',
    'toggleFavorite','setMult','setTtkCat','refreshTTKData',
    'handleRefresh','changeWeek','goToToday','selectDay','toggleLoc',
    'openChecklist','closeChecklistLoc','setClTab','toggleCheckItem','saveManager',
    'toggleOrder','updateCartQty','setCartQty','deleteCartItem','clearCart','copyOrder'
  ];
  // 1) Если есть пространство имён CB — делегируем ему отсутствующие функции
  if(window.CB){
    names.forEach(function(n){
      if(typeof window[n]!=='function' && typeof window.CB[n]==='function'){
        window[n]=function(){ return window.CB[n].apply(null,arguments); };
      }
    });
  }
  // 2) Фолбэк для setMult, если его нет вообще
  if(typeof window.setMult!=='function'){
    window.setMult=function(m){
      window.currentMult=m;
      if(window.haptic)window.haptic();
      if(window.renderRecipe)window.renderRecipe();
    };
  }
})();

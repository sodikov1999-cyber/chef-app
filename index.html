<style>
:root{
  --bg:#0F0D0B;
  --card:#1B1613;
  --text:#F5ECE2;
  --muted:#9C8D7E;
  --accent:#FF8A3D;
  --accent-soft:rgba(255,138,61,.14);
  --green:#5FD38A;
  --blue:#6FA8FF;
  --red:#FF6B5E;
  --glass:rgba(255,255,255,.06);
  --glass-border:rgba(255,255,255,.1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow:hidden;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
::-webkit-scrollbar{width:0;height:0}
body{scrollbar-width:none}
#app{position:fixed;inset:0;overflow:hidden}

/* Screens */
.screen{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;padding:20px;padding-bottom:100px;background:var(--bg);display:none}
.screen.current{display:block}

h1{font-weight:800;font-size:26px;margin-bottom:16px;letter-spacing:-0.02em}
h2{font-weight:700;font-size:18px;margin:22px 0 12px}
h3{font-weight:700;font-size:16px;margin:18px 0 10px;color:var(--accent)}

.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.tile{padding:18px 14px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.06);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.tile:active{transform:scale(.97)}
.tile-emoji{font-size:28px;margin-bottom:8px}
.tile-title{font-weight:700;font-size:15px}
.tile-desc{font-size:12px;color:var(--muted);margin-top:3px}

.pulse{display:inline-block;width:8px;height:8px;background:var(--green);border-radius:50%;margin-right:8px;animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.btn{display:block;width:100%;padding:14px;background:var(--accent);color:#000;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:10px;text-align:center}
.btn:active{transform:scale(.98)}
.btn-sec{background:rgba(255,255,255,.06);color:var(--text);border:1px solid rgba(255,255,255,.1)}
.btn-sm{padding:8px 14px;font-size:13px;width:auto;display:inline-flex;align-items:center;gap:6px}

/* iOS-style back button */
.back-btn{width:40px;height:40px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:inline-flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer;margin-bottom:16px;font-size:18px}
.back-btn svg{width:20px;height:20px;fill:currentColor}
.back-btn:active{transform:scale(.93)}

.recipe{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;cursor:pointer;border:none;width:100%;text-align:left;color:inherit;font:inherit}
.recipe:active{background:rgba(255,255,255,.07)}
.recipe-name{font-weight:700;font-size:15px;margin-bottom:3px}
.recipe-meta{font-size:12px;color:var(--muted)}

.ingredient{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;font-size:14px}
.ingredient:last-child{border:none}
.ingredient b{color:var(--accent)}

.step{padding:12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent);font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word}
.step-num{display:inline-block;width:20px;height:20px;background:var(--accent-soft);color:var(--accent);border-radius:6px;text-align:center;line-height:20px;font-weight:700;font-size:11px;margin-right:8px;flex-shrink:0}

.news{padding:14px;background:rgba(255,138,61,.08);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--accent)}
.news-title{font-weight:700;font-size:14px;margin-bottom:3px}
.news-text{font-size:13px;color:var(--muted);line-height:1.4}
.news-date{font-size:11px;color:var(--muted);margin-top:5px}

.check-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.check-item:last-child{border:none}
.check-box{width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin-right:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg);transition:.15s}
.check-item.done .check-box{background:var(--green);border-color:var(--green)}
.check-item.done .check-text{text-decoration:line-through;color:var(--muted)}

/* Search */
.search-wrap{position:sticky;top:0;z-index:10;padding:8px 0;background:var(--bg)}
.search-wrap input{width:100%;padding:12px 16px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:var(--text);font-size:15px;outline:none}
.search-wrap input::placeholder{color:var(--muted)}

/* Sheet / Modal */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;opacity:0}
.sheet-overlay.show{display:block;opacity:1;transition:opacity .25s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:24px 24px 0 0;padding:0 0 30px;z-index:101;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,.35,1);max-height:85vh;display:flex;flex-direction:column}
.sheet.open{transform:translateY(0)}
.sheet-handle{width:36px;height:5px;background:rgba(255,255,255,.2);border-radius:3px;margin:10px auto}
.sheet-head{padding:8px 20px 12px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sheet-body{overflow-y:auto;padding:0 20px 20px;flex:1;-webkit-overflow-scrolling:touch}

/* Cart FAB */
.cart-fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;border:none;z-index:90;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;box-shadow:0 4px 20px rgba(255,138,61,.35)}
.cart-fab:active{transform:scale(.92)}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;background:var(--red);color:#fff;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* Admin FAB */
.admin-fab{position:fixed;bottom:24px;right:88px;width:48px;height:48px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-border);backdrop-filter:blur(12px);color:var(--text);z-index:90;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.admin-fab:active{transform:scale(.92)}

/* Matrix / Write-off items */
.m-item{display:flex;align-items:center;justify-content:space-between;padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px}
.m-item-info{flex:1;min-width:0}
.m-item-name{font-weight:600;font-size:14px;margin-bottom:2px}
.m-item-meta{font-size:12px;color:var(--muted)}
.m-item-actions{display:flex;align-items:center;gap:8px}
.m-add-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;cursor:pointer;flex-shrink:0}
.m-add-btn.added{background:var(--green);border-color:var(--green);color:#000}
.m-add-btn:active{transform:scale(.9)}

/* Cart sheet items */
.cart-item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.cart-item:last-child{border:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-weight:600;font-size:14px}
.cart-item-meta{font-size:12px;color:var(--muted)}
.cart-qty{display:flex;align-items:center;gap:6px}
.cart-qty button{width:28px;height:28px;border-radius:8px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-qty button:active{transform:scale(.9)}
.cart-qty input{width:60px;height:32px;text-align:center;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);font-size:14px;font-weight:600}
.cart-qty input:focus{outline:none;border-color:var(--accent)}
.cart-remove{width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cart-remove:active{color:var(--red)}

/* Write-off location cards */
.loc-card{padding:16px;background:var(--card);border-radius:14px;border:1px solid rgba(255,255,255,.06);margin-bottom:10px;cursor:pointer}
.loc-card:active{transform:scale(.98)}
.loc-card-title{font-weight:700;font-size:16px;margin-bottom:4px}
.loc-card-desc{font-size:13px;color:var(--muted)}

/* Reason select */
.reason-select{padding:6px 10px;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);font-size:12px;outline:none}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--card);border:1px solid var(--glass-border);padding:12px 20px;border-radius:12px;font-size:14px;z-index:200;transition:transform .3s cubic-bezier(.32,.72,.35,1);backdrop-filter:blur(12px)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Period tabs */
.period-tabs{display:flex;gap:6px;margin-bottom:16px}
.period-tab{flex:1;padding:10px;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;text-align:center;cursor:pointer}
.period-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Accessibility */
@media (prefers-reduced-motion:reduce){
  .screen{transition:none !important}
  .sheet{transition:opacity .2s ease;transform:none !important}
  .sheet-overlay{transition:opacity .2s ease}
  .toast{transition:opacity .2s ease;transform:translateX(-50%) !important}
}
@media (prefers-reduced-transparency:reduce){
  .back-btn,.admin-fab{background:rgba(40,35,30,.95);backdrop-filter:none}
}
@media (prefers-contrast:more){
  .card,.tile,.loc-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3)}
}
</style>
</head>

// ============================================================
// PHYSICS ENGINE (Apple Fluid UI Constitution)
// ============================================================
function springAnimate({from, to, velocity = 0, stiffness = 380, damping = 32, onUpdate, onComplete}) {
  let pos = from;
  let vel = velocity || 0;
  const k = stiffness / 1000;
  const d = damping / 100;
  let rafId = null;
  let lastTime = performance.now();

  function tick(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.032);
    lastTime = now;
    const force = (to - pos) * k;
    const damp = vel * d;
    vel += (force - damp) * dt * 60;
    pos += vel * dt * 60;
    onUpdate(pos);
    if (Math.abs(to - pos) < 0.5 && Math.abs(vel) < 0.5) {
      onUpdate(to);
      if (onComplete) onComplete();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
  return {
    cancel: () => { if (rafId) cancelAnimationFrame(rafId); }
  };
}

function rubberband(overshoot, dimension, constant = 0.55) {
  return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));
}

function project(initialVelocity, decelerationRate = 0.998) {
  return (initialVelocity / 1000) * decelerationRate / (1 - decelerationRate);
}

// Haptic
function haptic(type = 'light') {
  if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
    if (type === 'hard') Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
    else if (type === 'medium') Telegram.WebApp.HapticFeedback.impactOccurred('medium');
    else Telegram.WebApp.HapticFeedback.impactOccurred('light');
  }
}

// Toast
function showToast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => t.classList.remove('show'), 2200);
}

// NAVIGATION (iOS-style push/pop)
// ============================================================
function navigate(view, data) {
  haptic('light');
  const prevScreen = app.querySelector('.screen.current');
  const prevState = {view: currentView};
  if (currentRecipeId !== null) prevState.data = currentRecipeId;
  viewStack.push(prevState);

  currentView = view;
  if (data !== undefined) currentRecipeId = data;

  const newScreen = document.createElement('div');
  newScreen.className = 'screen current';
  newScreen.id = 'screen-' + (++screenIdCounter);
  app.appendChild(newScreen);
  currentScreen = newScreen;

  render();

  if (prevScreen) {
    prevScreen.classList.remove('current');
    prevScreen.style.transition = 'none';
    prevScreen.style.transform = 'translateX(-30%)';
    prevScreen.style.opacity = '0.6';
    prevScreen.style.display = 'block';

    newScreen.style.transition = 'none';
    newScreen.style.transform = 'translateX(100%)';

    requestAnimationFrame(() => {
      prevScreen.style.transition = 'transform .35s cubic-bezier(.32,.72,.35,1), opacity .35s ease';
      newScreen.style.transition = 'transform .35s cubic-bezier(.32,.72,.35,1)';
      prevScreen.style.transform = 'translateX(-30%)';
      prevScreen.style.opacity = '0.6';
      newScreen.style.transform = 'translateX(0)';

      setTimeout(() => {
        if(prevScreen) {
          prevScreen.style.display = 'none';
          prevScreen.style.visibility = 'hidden';
          prevScreen.style.transform = '';
          prevScreen.style.opacity = '';
        }
        newScreen.style.transform = '';
      }, 380);
    });
  }

  updateAdminFab();
}

function goBack() {
  if (viewStack.length <= 1) return;
  haptic('light');
  viewStack.pop();
  const prevState = viewStack[viewStack.length - 1];
  currentView = prevState.view;
  currentRecipeId = prevState.data !== undefined ? prevState.data : null;

  const curScreen = app.querySelector('.screen.current');
  const prevScreen = app.querySelector('.screen:not(.current)');

  if (curScreen) {
    curScreen.style.transition = 'none';
    curScreen.style.transform = 'translateX(0)';
    requestAnimationFrame(() => {
      curScreen.style.transition = 'transform .35s cubic-bezier(.32,.72,.35,1), opacity .35s ease';
      curScreen.style.transform = 'translateX(100%)';
      curScreen.style.opacity = '0.6';

      if (prevScreen) {
        prevScreen.style.display = 'block';
        prevScreen.style.visibility = '';
        prevScreen.style.transition = 'none';
        prevScreen.style.transform = 'translateX(-30%)';
        prevScreen.style.opacity = '0.6';
        requestAnimationFrame(() => {
          prevScreen.style.transition = 'transform .35s cubic-bezier(.32,.72,.35,1), opacity .35s ease';
          prevScreen.style.transform = 'translateX(0)';
          prevScreen.style.opacity = '1';
        });
      }

      setTimeout(() => {
        curScreen.remove();
        if (prevScreen) {
          prevScreen.classList.add('current');
          prevScreen.style.transform = '';
          prevScreen.style.opacity = '';
          currentScreen = prevScreen;
        }
        render();
        updateAdminFab();
      }, 380);
    });
  }
}

  adminFab.style.display = currentView === 'home' ? 'flex' : 'none';

// ============================================================
// SWIPE-BACK (iOS-style interactive pop)
// ============================================================
(function initSwipeBack(){
  let sbStartX = 0, sbStartY = 0, sbStartTime = 0, sbDragging = false;
  let sbCurrentScreen = null, sbPrevScreen = null;

  document.body.addEventListener('touchstart', e => {
    if(viewStack.length <= 1) return;
    const t = e.touches[0];
    if(t.clientX > 50) return;
    const cur = app.querySelector('.screen.current');
    if(!cur) return;
    sbDragging = true;
    sbStartX = t.clientX;
    sbStartY = t.clientY;
    sbStartTime = e.timeStamp;
    sbCurrentScreen = cur;
    sbPrevScreen = app.querySelector('.screen:not(.current)');
  }, {passive: true});

  document.body.addEventListener('touchmove', e => {
    if(!sbDragging || !sbCurrentScreen) return;
    const t = e.touches[0];
    const dx = t.clientX - sbStartX;
    const dy = t.clientY - sbStartY;
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){ sbDragging = false; return; }
    if(dx < 0){ sbDragging = false; return; }
    if(dx > 5) e.preventDefault();
    const pct = dx / window.innerWidth;
    sbCurrentScreen.style.transition = 'none';
    sbCurrentScreen.style.transform = `translateX(${dx}px)`;
    if(sbPrevScreen){
      sbPrevScreen.style.display = 'block';
      sbPrevScreen.style.visibility = '';
      sbPrevScreen.style.transition = 'none';
      sbPrevScreen.style.transform = `translateX(${(pct * 30 - 30)}%)`;
      sbPrevScreen.style.opacity = Math.max(0.4, 1 - pct * 0.6);
    }
  }, {passive: false});

  document.body.addEventListener('touchend', e => {
    if(!sbDragging || !sbCurrentScreen) return;
    sbDragging = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sbStartX;
    const dt = e.timeStamp - sbStartTime;
    const threshold = window.innerWidth * 0.28;
    const velocity = dt > 0 ? dx / dt * 1000 : 0;
    const commit = dx > threshold || (dx > 60 && velocity > 400);

    if(commit){
      springAnimate({
        from: dx, to: window.innerWidth, velocity: velocity * 0.3,
        stiffness: 520, damping: 28,
        onUpdate: x => {
          sbCurrentScreen.style.transform = `translateX(${x}px)`;
          if(sbPrevScreen){
            const p = x / window.innerWidth;
            sbPrevScreen.style.transform = `translateX(${(p * 30 - 30)}%)`;
            sbPrevScreen.style.opacity = Math.max(0.4, 1 - p * 0.6);
          }
        },
        onComplete: () => {
          viewStack.pop();
          const prevState = viewStack[viewStack.length - 1];
          currentView = prevState.view;
          if(prevState.data !== undefined) currentRecipeId = prevState.data;
          sbCurrentScreen.remove();
          if(sbPrevScreen){
            sbPrevScreen.classList.add('current');
            sbPrevScreen.style.transform = ''; sbPrevScreen.style.opacity = '';
            currentScreen = sbPrevScreen;
          }
          render();
          updateAdminFab();
          sbCurrentScreen = null; sbPrevScreen = null;
        }
      });
    } else {
      springAnimate({
        from: dx, to: 0, velocity: 0,
        stiffness: 520, damping: 28,
        onUpdate: x => {
          sbCurrentScreen.style.transform = `translateX(${x}px)`;
          if(sbPrevScreen){
            const p = x / window.innerWidth;
            sbPrevScreen.style.transform = `translateX(${(p * 30 - 30)}%)`;
            sbPrevScreen.style.opacity = Math.max(0.4, 1 - p * 0.6);
          }
        },
        onComplete: () => {
          if(sbPrevScreen){ sbPrevScreen.style.display = 'none'; sbPrevScreen.style.visibility = 'hidden'; }
          sbCurrentScreen.style.transform = '';
          sbCurrentScreen = null; sbPrevScreen = null;
        }
      });
    }
  }, {passive: true});
})();

// Tap-to-top (top 80px zone)
document.body.addEventListener('touchend', e => {

// Debounce search
function debounceSearch(fn) {
  if(searchRafId) cancelAnimationFrame(searchRafId);
  searchRafId = requestAnimationFrame(() => {

}

function renderMatrix() {
  let html = backBtn() + '<h1>📊 Матрица заявок</h1>';

function searchMatrix() {
  const q = (document.getElementById('matrixSearch')?.value || '').toLowerCase();
  const container = document.getElementById('matrix-list-container');
  if(!container) return;
  const filtered = MATRIX_ITEMS.filter(i => i.name.toLowerCase().includes(q) || i.supplier.toLowerCase().includes(q));

  // Group by supplier
  const bySupplier = {};
  filtered.forEach(i => {
    if(!bySupplier[i.supplier]) bySupplier[i.supplier] = [];
    bySupplier[i.supplier].push(i);
  });

  let html = '';
  for(const [supplier, items] of Object.entries(bySupplier)) {
    html += `<h3>${supplier}</h3>`;
    items.forEach(item => {
      const inCart = orderCart.find(c => c.name === item.name);
      html += `<div class="m-item">
        <div class="m-item-info">
          <div class="m-item-name">${item.name}</div>
          <div class="m-item-meta">${item.unit} · Лимит: ${item.limit}</div>
        </div>
        <div class="m-item-actions">
          ${inCart ? `<span style="font-size:12px;color:var(--green);font-weight:700">${inCart.qty}</span>` : ''}
          <button class="m-add-btn ${inCart?'added':''}" onclick="toggleMatrixItem('${item.name.replace(/'/g,"\'")}','${item.unit}',${item.limit});event.stopPropagation()">
            ${inCart?'✓':'+'}
          </button>
        </div>
      </div>`;
    });
  }
  container.innerHTML = html || '<p style="color:var(--muted);text-align:center;padding:40px">Ничего не найдено</p>';
}

function toggleMatrixItem(name, unit, limit) {
  const idx = orderCart.findIndex(c => c.name === name);
  if(idx >= 0) {
    orderCart.splice(idx, 1);
    haptic('light');
  } else {
    orderCart.push({name, unit, qty: limit || 1, supplier: MATRIX_ITEMS.find(i => i.name === name)?.supplier || ''});
    haptic('medium');
  }
  saveData();
  updateCartFab();
  searchMatrix();
}

function updateCartFab() {
  if(orderCart.length > 0) {
    cartFab.style.display = 'flex';
    cartBadge.style.display = 'flex';
    cartBadge.textContent = orderCart.length;
  } else {
    cartFab.style.display = 'none';
    cartBadge.style.display = 'none';
  }
}

// CART SHEET (Bottom sheet for orders)
// ============================================================
let cartSheetOverlay = null;
let cartSheet = null;

function renderCartSheet() {
  haptic('hard');
  if(cartSheetOverlay) { closeCartSheet(); return; }

  cartSheetOverlay = document.createElement('div');
  cartSheetOverlay.className = 'sheet-overlay show';
  cartSheetOverlay.onclick = e => { if(e.target === cartSheetOverlay) closeCartSheet(); };

  cartSheet = document.createElement('div');
  cartSheet.className = 'sheet open';

  // Group by supplier
  const bySupplier = {};
  orderCart.forEach(c => {
    if(!bySupplier[c.supplier]) bySupplier[c.supplier] = [];
    bySupplier[c.supplier].push(c);
  });

  let bodyHtml = '';
  if(orderCart.length === 0) {
    bodyHtml = '<p style="color:var(--muted);text-align:center;padding:40px">Корзина пуста</p>';
  } else {
    for(const [supplier, items] of Object.entries(bySupplier)) {
      bodyHtml += `<div style="font-weight:700;font-size:14px;color:var(--accent);margin:12px 0 8px">${supplier}</div>`;
      items.forEach((item, idx) => {
        const globalIdx = orderCart.findIndex(c => c.name === item.name);
        bodyHtml += `<div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-meta">${item.unit}</div>
          </div>
          <div class="cart-qty">
            <button onclick="changeCartQty(${globalIdx},-1)">−</button>
            <input type="text" inputmode="decimal" value="${item.qty}" onchange="setCartQty(${globalIdx},this.value)" onfocus="saveScroll()" onblur="restoreScroll()">
            <button onclick="changeCartQty(${globalIdx},1)">+</button>
          </div>
          <button class="cart-remove" onclick="removeCartItem(${globalIdx})">✕</button>
        </div>`;
      });
    }
  }

  cartSheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span>📋 Корзина заявки</span>
      <button onclick="closeCartSheet();haptic('light')" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div class="sheet-body">${bodyHtml}</div>
    <div style="padding:0 20px 10px;display:flex;gap:8px">
      <button class="btn btn-sec" style="flex:1" onclick="clearCart();haptic('hard')">🗑 Очистить</button>
      <button class="btn" style="flex:2" onclick="copyOrder();haptic('hard')">📋 Скопировать заявку</button>
    </div>
  `;

  document.body.appendChild(cartSheetOverlay);
  document.body.appendChild(cartSheet);
}

let savedScrollTop = 0;
function saveScroll() {
  const scroller = app.querySelector('.screen.current');
  if(scroller) savedScrollTop = scroller.scrollTop;
}
function restoreScroll() {
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const scroller = app.querySelector('.screen.current');
      if(scroller) scroller.scrollTop = savedScrollTop;
    });
  });
}

function closeCartSheet() {
  if(cartSheet) {
    cartSheet.classList.remove('open');
    cartSheet.style.transform = '';
  }
  if(cartSheetOverlay) cartSheetOverlay.classList.remove('show');
  setTimeout(() => {
    if(cartSheet) { cartSheet.remove(); cartSheet = null; }
    if(cartSheetOverlay) { cartSheetOverlay.remove(); cartSheetOverlay = null; }
  }, 300);
}

function changeCartQty(idx, delta) {
  if(!orderCart[idx]) return;
  orderCart[idx].qty = Math.max(0.01, +(orderCart[idx].qty + delta).toFixed(3));
  saveData();
  renderCartSheet();
}

function setCartQty(idx, val) {
  if(!orderCart[idx]) return;
  const num = parseFloat(val.toString().replace(',', '.'));
  if(isNaN(num) || num <= 0) {
    removeCartItem(idx);
    return;
  }
  orderCart[idx].qty = Math.round(num * 1000) / 1000;
  saveData();
  renderCartSheet();
  updateCartFab();
}

function removeCartItem(idx) {
  orderCart.splice(idx, 1);
  saveData();
  updateCartFab();
  renderCartSheet();
}

function clearCart() {
  orderCart = [];
  saveData();
  updateCartFab();
  closeCartSheet();
  showToast('Корзина очищена');
}

function copyOrder() {
  if(orderCart.length === 0) return;
  const bySupplier = {};
  orderCart.forEach(c => {
    if(!bySupplier[c.supplier]) bySupplier[c.supplier] = [];
    bySupplier[c.supplier].push(c);
  });
  const dateStr = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});
  let text = `📋 ЗАЯВКА НА ПОСТАВКU\n${dateStr}\n\n`;
  for(const [supplier, items] of Object.entries(bySupplier)) {
    text += `📦 ${supplier}\n`;
    items.forEach(i => {
      text += `• ${i.name} — ${i.qty} ${i.unit}\n`;
    });
    text += `\n`;
  }
  text += `—\nОтправлено из ШефБук`;
  navigator.clipboard.writeText(text).then(() => showToast('Скопировано! Вставьте в заметки'));
}

    </div>`;

function openWriteOffLocation(loc) {
  currentWriteOffLocation = loc;
  navigate('writeoffLocation');
}

function renderWriteOffLocation() {
  const loc = currentWriteOffLocation;
  if(!loc) { goBack(); return; }

  let html = backBtn() + `<h1>🗑 ${loc}</h1>`;

  // Period tabs
  html += `<div class="period-tabs">
    <button class="period-tab ${writeOffPeriod==='today'?'active':''}" onclick="setWriteOffPeriod('today')">Сегодня</button>
    <button class="period-tab ${writeOffPeriod==='week'?'active':''}" onclick="setWriteOffPeriod('week')">Неделя</button>
    <button class="period-tab ${writeOffPeriod==='month'?'active':''}" onclick="setWriteOffPeriod('month')">Месяц</button>
  </div>`;

  // Cart FAB for write-off
  const locCart = writeOffCart[loc] || [];
  const periodCart = filterWriteOffByPeriod(locCart);

  html += '<div id="wo-list">';
  WRITE_OFF_CATEGORIES.forEach(cat => {
    const products = WRITE_OFF_PRODUCTS[cat] || [];
    if(products.length === 0) return;
    html += `<h3>${cat}</h3>`;
    products.forEach(([name, unit]) => {
      const inCart = periodCart.find(c => c.name === name);
      html += `<div class="m-item">
        <div class="m-item-info">
          <div class="m-item-name">${name}</div>
          <div class="m-item-meta">${unit}</div>
        </div>
        <div class="m-item-actions" style="gap:8px">
          ${inCart ? `<span style="font-size:12px;color:var(--green);font-weight:700">${inCart.qty}</span>` : ''}
          <select class="reason-select" onchange="setWriteOffReason('${name.replace(/'/g,"\'")}',this.value)">
            ${WRITE_OFF_REASONS.map(r => `<option value="${r}" ${(inCart?.reason||'Порча')===r?'selected':''}>${r}</option>`).join('')}
          </select>
          <button class="m-add-btn ${inCart?'added':''}" onclick="toggleWriteOffItem('${name.replace(/'/g,"\'")}','${unit}');event.stopPropagation()">
            ${inCart?'✓':'+'}
          </button>
        </div>
      </div>`;
    });
  });
  html += '</div>';

  currentScreen.innerHTML = html;

  // Add write-off cart FAB if items exist
  updateWriteOffFab(loc, periodCart);
}

let writeOffReasons = {}; // { name: reason }

function setWriteOffReason(name, reason) {
  writeOffReasons[name] = reason;
}

function toggleWriteOffItem(name, unit) {
  const loc = currentWriteOffLocation;
  if(!loc) return;
  if(!writeOffCart[loc]) writeOffCart[loc] = [];
  const idx = writeOffCart[loc].findIndex(c => c.name === name && c.location === loc);

  if(idx >= 0) {
    writeOffCart[loc].splice(idx, 1);
    haptic('light');
  } else {
    writeOffCart[loc].push({
      name, unit, qty: 1, 
      reason: writeOffReasons[name] || 'Порча',
      location: loc,
      date: Date.now()
    });
    haptic('medium');
  }
  saveData();
  renderWriteOffLocation();
}

function setWriteOffPeriod(p) {
  writeOffPeriod = p;
  renderWriteOffLocation();
}

function filterWriteOffByPeriod(items) {
  if(!items) return [];
  const now = Date.now();
  const day = 86400000;
  return items.filter(i => {
    if(writeOffPeriod === 'today') return now - i.date < day;
    if(writeOffPeriod === 'week') return now - i.date < day * 7;
    if(writeOffPeriod === 'month') return now - i.date < day * 30;
    return true;
  });
}

function updateWriteOffFab(loc, items) {
  // Remove old fab
  const oldFab = document.getElementById('writeOffFab');
  if(oldFab) oldFab.remove();

  if(items.length === 0) return;

  const fab = document.createElement('button');
  fab.id = 'writeOffFab';
  fab.className = 'cart-fab';
  fab.style.cssText = 'bottom:24px;right:20px;width:56px;height:56px;';
  fab.innerHTML = `<span>🗑</span><span class="cart-badge">${items.length}</span>`;
  fab.onclick = () => { renderWriteOffCartSheet(); haptic('hard'); };
  document.body.appendChild(fab);
}

// ============================================================
let woSheetOverlay = null;
let woSheet = null;

function renderWriteOffCartSheet() {
  haptic('hard');
  if(woSheetOverlay) { closeWriteOffCartSheet(); return; }

  const loc = currentWriteOffLocation;
  const allItems = writeOffCart[loc] || [];
  const items = filterWriteOffByPeriod(allItems);

  woSheetOverlay = document.createElement('div');
  woSheetOverlay.className = 'sheet-overlay show';
  woSheetOverlay.onclick = e => { if(e.target === woSheetOverlay) closeWriteOffCartSheet(); };

  woSheet = document.createElement('div');
  woSheet.className = 'sheet open';

  // Aggregate same items
  const aggregated = {};
  items.forEach(i => {
    const key = i.name + '|' + i.reason;
    if(!aggregated[key]) aggregated[key] = {name: i.name, unit: i.unit, qty: 0, reason: i.reason, category: ''};
    aggregated[key].qty += i.qty;
    // Find category
    for(const [cat, prods] of Object.entries(WRITE_OFF_PRODUCTS)) {
      if(prods.some(p => p[0] === i.name)) { aggregated[key].category = cat; break; }
    }
  });

  // Group by category
  const byCat = {};
  Object.values(aggregated).forEach(i => {
    if(!byCat[i.category]) byCat[i.category] = [];
    byCat[i.category].push(i);
  });

  let bodyHtml = '';
  if(items.length === 0) {
    bodyHtml = '<p style="color:var(--muted);text-align:center;padding:40px">Корзина пуста</p>';
  } else {
    for(const [cat, catItems] of Object.entries(byCat)) {
      bodyHtml += `<div style="font-weight:700;font-size:14px;color:var(--accent);margin:12px 0 8px">${cat}</div>`;
      catItems.forEach(item => {
        const idx = allItems.findIndex(c => c.name === item.name && c.reason === item.reason);
        bodyHtml += `<div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-meta">${item.reason} · ${item.unit}</div>
          </div>
          <div class="cart-qty">
            <button onclick="changeWriteOffQty('${item.name.replace(/'/g,"\'")}','${item.reason}',-1)">−</button>
            <input type="text" inputmode="decimal" value="${item.qty.toFixed(3).replace(/\.0+$/,'').replace(/(\.\d+?)0+$/,'$1')}" onchange="setWriteOffQty('${item.name.replace(/'/g,"\'")}','${item.reason}',this.value)" onfocus="saveScroll()" onblur="restoreScroll()">
            <button onclick="changeWriteOffQty('${item.name.replace(/'/g,"\'")}','${item.reason}',1)">+</button>
          </div>
          <button class="cart-remove" onclick="removeWriteOffItem('${item.name.replace(/'/g,"\'")}','${item.reason}')">✕</button>
        </div>`;
      });
    }
  }

  const periodLabel = writeOffPeriod === 'today' ? 'за сегодня' : writeOffPeriod === 'week' ? 'за неделю' : 'за месяц';

  woSheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span>🗑 Корзина списания · ${loc} · ${periodLabel}</span>
      <button onclick="closeWriteOffCartSheet();haptic('light')" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div class="sheet-body">${bodyHtml}</div>
    <div style="padding:0 20px 10px;display:flex;gap:8px">
      <button class="btn btn-sec" style="flex:1" onclick="clearWriteOffCart();haptic('hard')">🗑 Очистить</button>
      <button class="btn" style="flex:2" onclick="copyWriteOff();haptic('hard')">📋 Скопировать списание</button>
    </div>
  `;

  document.body.appendChild(woSheetOverlay);
  document.body.appendChild(woSheet);
}

function closeWriteOffCartSheet() {
  if(woSheet) {
    woSheet.classList.remove('open');
    woSheet.style.transform = '';
  }
  if(woSheetOverlay) woSheetOverlay.classList.remove('show');
  setTimeout(() => {
    if(woSheet) { woSheet.remove(); woSheet = null; }
    if(woSheetOverlay) { woSheetOverlay.remove(); woSheetOverlay = null; }
  }, 300);
}

function changeWriteOffQty(name, reason, delta) {
  const loc = currentWriteOffLocation;
  if(!loc || !writeOffCart[loc]) return;
  const item = writeOffCart[loc].find(c => c.name === name && c.reason === reason);
  if(!item) return;
  item.qty = Math.max(0.01, +(item.qty + delta).toFixed(3));
  saveData();
  renderWriteOffCartSheet();
}

function setWriteOffQty(name, reason, val) {
  const loc = currentWriteOffLocation;
  if(!loc || !writeOffCart[loc]) return;
  const num = parseFloat(val.toString().replace(',', '.'));
  if(isNaN(num) || num <= 0) {
    removeWriteOffItem(name, reason);
    return;
  }
  const item = writeOffCart[loc].find(c => c.name === name && c.reason === reason);
  if(item) {
    item.qty = Math.round(num * 1000) / 1000;
    saveData();
    renderWriteOffCartSheet();
  }
}

function removeWriteOffItem(name, reason) {
  const loc = currentWriteOffLocation;
  if(!loc || !writeOffCart[loc]) return;
  const idx = writeOffCart[loc].findIndex(c => c.name === name && c.reason === reason);
  if(idx >= 0) {
    writeOffCart[loc].splice(idx, 1);
    saveData();
    renderWriteOffCartSheet();
    renderWriteOffLocation();
  }
}

function clearWriteOffCart() {
  const loc = currentWriteOffLocation;
  if(!loc) return;
  writeOffCart[loc] = [];
  saveData();
  closeWriteOffCartSheet();
  renderWriteOffLocation();
  showToast('Корзина списания очищена');
}

function copyWriteOff() {
  const loc = currentWriteOffLocation;
  if(!loc) return;
  const allItems = writeOffCart[loc] || [];
  const items = filterWriteOffByPeriod(allItems);
  if(items.length === 0) return;

  // Aggregate
  const aggregated = {};
  items.forEach(i => {
    const key = i.name + '|' + i.reason;
    if(!aggregated[key]) aggregated[key] = {name: i.name, unit: i.unit, qty: 0, reason: i.reason, category: ''};
    aggregated[key].qty += i.qty;
    for(const [cat, prods] of Object.entries(WRITE_OFF_PRODUCTS)) {
      if(prods.some(p => p[0] === i.name)) { aggregated[key].category = cat; break; }
    }
  });

  const byCat = {};
  Object.values(aggregated).forEach(i => {
    if(!byCat[i.category]) byCat[i.category] = [];
    byCat[i.category].push(i);
  });

  const periodLabel = writeOffPeriod === 'today' ? 'за сегодня' : writeOffPeriod === 'week' ? 'за неделю' : 'за месяц';
  const dateStr = new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});

  let text = `🗑 АКТ СПИСАНИЯ\n${loc} · ${periodLabel}\n${dateStr}\n\n`;
  for(const [cat, catItems] of Object.entries(byCat)) {
    text += `📦 ${cat}\n`;
    catItems.forEach(i => {
      const qtyStr = i.qty.toFixed(3).replace(/\.0+$/,'').replace(/(\.\d+?)0+$/,'$1');
      text += `• ${i.name} — ${qtyStr} ${i.unit} (${i.reason})\n`;
    });
    text += `\n`;
  }
  text += `—\nОтправлено из ШефБук`;
  navigator.clipboard.writeText(text).then(() => showToast('Скопировано! Вставьте в заметки'));
}

// ============================================================
// ADMIN MODAL (Spring Physics Sheet)
// ============================================================
let adminSheetOverlay = null;
let adminSheet = null;
let adminSheetAnim = null;

function showAdminModal() {
  haptic('hard');
  if(adminSheetOverlay) { closeAdminSheet(); return; }

  adminSheetOverlay = document.createElement('div');
  adminSheetOverlay.className = 'sheet-overlay show';
  adminSheetOverlay.onclick = e => { if(e.target === adminSheetOverlay) closeAdminSheet(); };

  adminSheet = document.createElement('div');
  adminSheet.className = 'sheet';
  adminSheet.style.transform = 'translateY(100%)';

  adminSheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <span>✏️ Админ-панель</span>
      <button onclick="closeAdminSheet();haptic('light')" style="background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer">✕</button>
    </div>
    <div class="sheet-body">
      <h3>📋 Чек-листы</h3>
      <button class="btn btn-sec" onclick="resetChecklists();haptic('medium')">🔄 Сбросить чек-листы</button>
      <h3 style="margin-top:20px">📊 Данные</h3>
      <button class="btn btn-sec" onclick="clearAllData();haptic('hard')">🗑 Очистить все данные</button>
      <h3 style="margin-top:20px">📰 Новости (Firebase)</h3>
      <div id="admin-news-list" style="margin-bottom:12px"></div>
      <input type="text" id="newsTitle" placeholder="Заголовок" style="width:100%;padding:10px;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);margin-bottom:8px">
      <textarea id="newsText" placeholder="Текст новости" style="width:100%;padding:10px;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text);margin-bottom:8px;height:80px;resize:none;font-family:inherit"></textarea>
      <button class="btn" onclick="addNews();haptic('medium')">➕ Добавить новость</button>
    </div>
  `;

  document.body.appendChild(adminSheetOverlay);
  document.body.appendChild(adminSheet);

  // Spring open
  requestAnimationFrame(() => {
    springAnimate({
      from: window.innerHeight, to: 0, velocity: 0,
      stiffness: 380, damping: 32,
      onUpdate: y => { adminSheet.style.transform = `translateY(${y}px)`; }
    });
  });

  renderAdminNews();
  initAdminDrag();
}

function closeAdminSheet() {
  if(!adminSheet) return;
  springAnimate({
    from: 0, to: window.innerHeight, velocity: 0,
    stiffness: 380, damping: 32,
    onUpdate: y => { if(adminSheet) adminSheet.style.transform = `translateY(${y}px)`; },
    onComplete: () => {
      if(adminSheetOverlay) { adminSheetOverlay.remove(); adminSheetOverlay = null; }
      if(adminSheet) { adminSheet.remove(); adminSheet = null; }
    }
  });
}

function initAdminDrag() {
  if(!adminSheet) return;
  const dragArea = adminSheet.querySelector('.sheet-handle') || adminSheet;
  let isDragging = false, startY = 0, startSheetY = 0, dragHistory = [];

  function onPointerDown(e) {
    if(e.target.closest('button, input, textarea, select, .sheet-body')) return;
    isDragging = true;
    startY = e.clientY;
    startSheetY = 0;
    dragHistory = [];
    if(adminSheetAnim) adminSheetAnim.cancel();
    adminSheet.style.transition = 'none';
    if(e.pointerId) adminSheet.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function onPointerMove(e) {
    if(!isDragging) return;
    const y = e.clientY;
    const delta = y - startY;
    let targetY = startSheetY + delta;
    if(targetY < 0) targetY = -rubberband(-targetY, adminSheet.offsetHeight * 0.5);
    dragHistory.push({y, t: performance.now()});
    if(dragHistory.length > 6) dragHistory.shift();
    adminSheet.style.transform = `translateY(${targetY}px)`;
  }

  function onPointerUp(e) {
    if(!isDragging) return;
    isDragging = false;
    const now = performance.now();
    const recent = dragHistory.filter(h => now - h.t < 80);
    let releaseVelocity = 0;
    if(recent.length >= 2) {
      const first = recent[0], last = recent[recent.length - 1];
      const dt = last.t - first.t;
      if(dt > 0) releaseVelocity = (last.y - first.y) / dt * 1000;
    }
    const projected = (adminSheet.style.transform.match(/translateY\(([^p]+)px\)/)?.[1] || 0) * 1 + project(releaseVelocity);
    const threshold = adminSheet.offsetHeight * 0.35;
    if(projected > threshold || (parseFloat(adminSheet.style.transform.match(/translateY\(([^p]+)px\)/)?.[1]||0) > threshold && releaseVelocity > 0)) {
      closeAdminSheet();
    } else {
      springAnimate({
        from: parseFloat(adminSheet.style.transform.match(/translateY\(([^p]+)px\)/)?.[1]||0), to: 0, velocity: releaseVelocity,
        stiffness: 380, damping: 32,
        onUpdate: y => { if(adminSheet) adminSheet.style.transform = `translateY(${y}px)`; }
      });
    }
  }

  dragArea.addEventListener('pointerdown', onPointerDown);
  adminSheet.addEventListener('pointermove', onPointerMove);
  adminSheet.addEventListener('pointerup', onPointerUp);
  adminSheet.addEventListener('pointercancel', onPointerUp);
}

function renderAdminNews() {
  const list = document.getElementById('admin-news-list');
  if(!list) return;
  if(newsData.length === 0) {
    list.innerHTML = '<p style="color:var(--muted);font-size:13px">Нет новостей</p>';
    return;
  }
  let html = '';
  newsData.forEach((n, i) => {
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)">
      <span style="font-size:13px">${n.title}</span>
      <button onclick="deleteNews(${i});haptic('light')" style="background:none;border:none;color:var(--red);font-size:16px;cursor:pointer">🗑</button>
    </div>`;
  });
  list.innerHTML = html;
}

function addNews() {
  const title = document.getElementById('newsTitle')?.value.trim();
  const text = document.getElementById('newsText')?.value.trim();
  if(!title || !text) { showToast('Заполните заголовок и текст'); return; }
  const news = {title, text, date: new Date().toLocaleDateString('ru-RU')};
  newsData.unshift(news);
  if(window.db && window.dbPush) {
    const newsRef = window.dbPush(window.dbRef(window.db, 'chefbook/news'));
    window.dbSet(newsRef, news);
  }
  saveData();
  document.getElementById('newsTitle').value = '';
  document.getElementById('newsText').value = '';
  renderAdminNews();
  showToast('Новость добавлена');
}

function deleteNews(idx) {
  newsData.splice(idx, 1);
  saveData();
  renderAdminNews();
}

function resetChecklists() {
  checklistOpen = JSON.parse(JSON.stringify(CHECKLISTS.open));
  checklistClose = JSON.parse(JSON.stringify(CHECKLISTS.close));
  saveData();
  showToast('Чек-листы сброшены');
}

function clearAllData() {
  if(!confirm('Очистить ВСЕ данные?')) return;
  orderCart = [];
  writeOffCart = {};
  favorites = [];
  checklistOpen = JSON.parse(JSON.stringify(CHECKLISTS.open));
  checklistClose = JSON.parse(JSON.stringify(CHECKLISTS.close));
  localStorage.removeItem('shefbuk_orderCart');
  localStorage.removeItem('shefbuk_writeOffCart');
  localStorage.removeItem('shefbuk_favorites');
  localStorage.removeItem('shefbuk_checklistOpen');
  localStorage.removeItem('shefbuk_checklistClose');
  updateCartFab();
  showToast('Все данные очищены');
  closeAdminSheet();
}

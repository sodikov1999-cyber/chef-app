body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;padding-bottom:40px;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{position:relative;width:100%;height:100vh;overflow:hidden}

h1{font-weight:800;font-size:26px;margin-bottom:16px}

.step{padding:12px;margin-bottom:8px;background:rgba(255,255,255,.03);border-radius:10px;border-left:3px solid var(--accent);font-size:14px;line-height:1.5;word-wrap:break-word;overflow-wrap:break-word}
.step-num{display:inline-block;width:20px;height:20px;background:var(--accent-soft);color:var(--accent);border-radius:6px;text-align:center;line-height:20px;font-weight:700;font-size:11px;margin-right:8px;flex-shrink:0}
.news{padding:14px;background:rgba(255,138,61,.08);border-radius:12px;margin-bottom:8px;border-left:3px solid var(--accent)}
.news-title{font-weight:700;font-size:14px;margin-bottom:3px}
.news-text{font-size:13px;color:var(--muted);line-height:1.4}
.news-date{font-size:11px;color:var(--muted);margin-top:5px}
.check-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer}
.check-item:last-child{border:none}

.check-item.done .check-box{background:var(--green);border-color:var(--green);color:#000}
.check-item.done span{text-decoration:line-through;color:var(--muted)}
.kpi{display:flex;gap:8px;margin-bottom:14px}
.kpi-box{flex:1;padding:10px;background:rgba(255,255,255,.03);border-radius:10px;text-align:center}
.kpi-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.kpi-value{font-weight:700;font-size:14px}
.mults{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

.mult.on{background:var(--accent);color:#000;border-color:var(--accent)}
.user{padding:14px;background:rgba(255,255,255,.03);border-radius:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px}

.user-info b{display:block;font-size:15px}
.user-info span{font-size:12px;color:var(--muted)}
.note{padding:14px;background:rgba(95,211,138,.1);border-left:3px solid var(--green);border-radius:10px;margin-top:14px;font-size:13px;line-height:1.5}
.admin-btn{position:fixed;bottom:14px;right:14px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(255,138,61,.4);font-size:20px;z-index:100}
.admin-btn:active{transform:scale(.9)}
/* === НОВАЯ МОДАЛКА С DRAG === */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;display:flex;align-items:flex-end;justify-content:center;pointer-events:none;transition:background .25s ease}
.sheet-bg.open{background:rgba(0,0,0,.55);pointer-events:auto}
.sheet{position:relative;width:100%;max-width:500px;background:var(--glass);border-radius:20px 20px 0 0;transform:translateY(100%);will-change:transform;touch-action:none;box-shadow:0 -8px 32px rgba(0,0,0,.5),inset 0 1px 0 var(--glass-border);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--glass-border);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.sheet.open{transform:translateY(0)}
.sheet-handle{position:absolute;top:0;left:50%;transform:translateX(-50%);width:36px;height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-top:8px;z-index:10;pointer-events:none}
.sheet-header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;flex-shrink:0}
.sheet-title{font-weight:800;font-size:18px}
.sheet-close{background:rgba(255,255,255,.08);border:none;color:var(--text);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.sheet-body{flex:1;overflow-y:auto;padding:0 20px 30px;max-height:70vh}
.sheet-drag-area{position:absolute;top:0;left:0;right:0;height:40px;z-index:5;cursor:grab}
.sheet-drag-area:active{cursor:grabbing}

/* === СТАРЫЕ МОДАЛКИ (редактирование) === */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){

}

}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:500px;height:90vh;display:flex;flex-direction:column;animation:slideUp .3s ease-out}

    gap: 10px;

.week-nav-btn {

.today-btn {

    font-size: 12px;
    font-weight: 600;
    cursor: pointer;

.day-card .day-num { font-weight: 800; font-size: 17px; margin: 3px 0; }
.day-card .count { font-size: 11px; color: var(--muted); }

  .modal{animation:none!important;transform:none!important;opacity:0;transition:opacity .15s ease!important}
  .modal.show{opacity:1}
}
</style>

// === FIREBASE: Сохранение в облако ===
async function syncToFirebase(){
  if(FIREBASE_URL.includes('ВАШ-ПРОЕКТ')){
    console.warn('Firebase URL не настроен. Данные сохранены только локально.');
    return;
  }
  try{
    const data = {
      recipes: RECIPES,
      news: NEWS,
      team: TEAM,
      matrix: MATRIX_DATA,
      favorites: FAVORITES,
      updatedAt: Date.now()
    };
    const url = `${FIREBASE_URL}${FB_PATH}.json`;
    console.log('☁️ Отправка в Firebase:', url);
    const res = await fetch(url, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    });

  try{

    console.log('☁️ Загрузка из Firebase:', url);
    const res = await fetch(url);
    console.log('☁️ Ответ Firebase:', res.status, res.statusText);
    if(!res.ok){
      console.warn('☁️ Firebase вернул ошибку:', res.status);
      return false;
    }
    const data = await res.json();
    console.log('☁️ Данные из Firebase:', data === null ? 'null (база пустая)' : 'получены');
    if(data && data.recipes){
      RECIPES = data.recipes;
      NEWS = data.news || DEFAULT_NEWS;
      TEAM = data.team || DEFAULT_TEAM;
      MATRIX_DATA = data.matrix || DEFAULT_MATRIX;
      FAVORITES = data.favorites || [];
      localStorage.setItem('chef_recipes', JSON.stringify(RECIPES));
      localStorage.setItem('chef_news', JSON.stringify(NEWS));
      localStorage.setItem('chef_team', JSON.stringify(TEAM));
      localStorage.setItem('chef_matrix', JSON.stringify(MATRIX_DATA));
      console.log('☁️ Данные загружены из Firebase, рецептов:', RECIPES.length);
      return true;
    }else{

    }
  }catch(e){
    console.warn('☁️ Не удалось загрузить из Firebase:', e.message);
  }
  return false;
}

/* ============================================================
   🌀 PHYSICS ENGINE
   ============================================================ */
const PHYS = {
  stiffness: 520,
  damping: 28,
  mass: 1,
  decelerationRate: 0.998
};

function springAnimate({ from, to, velocity = 0, onUpdate, onComplete, stiffness = PHYS.stiffness, damping = PHYS.damping, mass = PHYS.mass }) {
  let current = from;
  let vel = velocity;
  let rafId = null;
  let lastTime = performance.now();
  let running = true;

  function tick(now) {
    if (!running) return;
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    const displacement = current - to;
    const springForce = -stiffness * displacement;
    const dampingForce = -damping * vel;
    const acceleration = (springForce + dampingForce) / mass;
    vel += acceleration * dt;
    current += vel * dt;
    onUpdate(current);
    if (Math.abs(displacement) < 0.5 && Math.abs(vel) < 0.5) {
      onUpdate(to);
      if (onComplete) onComplete();
      return;
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
  return {
    cancel() { running = false; if (rafId) cancelAnimationFrame(rafId); },
    getVelocity() { return vel; }
  };
}

function rubberband(overshoot, dimension, constant = 0.55) {
  return (overshoot * dimension * constant) / (dimension + constant * Math.abs(overshoot));
}

function project(initialVelocity, decelerationRate = PHYS.decelerationRate) {
  return (initialVelocity / 1000) * decelerationRate / (1 - decelerationRate);
}

/* ============================================================
   ⬅️ GLOBAL SWIPE-BACK (iOS-style interactive pop)
   ============================================================ */
(function initSwipeBack(){
  let sbStartX = 0, sbStartY = 0, sbDragging = false, sbAnim = null;
  let sbCurrentScreen = null, sbPrevScreen = null;

  app.addEventListener('pointerdown', e => {
    if(viewStack.length <= 1) return;
    if(e.clientX > 24) return; // left edge zone only
    const cur = app.querySelector('.screen.current');
    if(!cur) return;
    sbDragging = true;
    sbStartX = e.clientX;
    sbStartTime = e.timeStamp;
    sbStartY = e.clientY;
    sbCurrentScreen = cur;
    sbPrevScreen = app.querySelector('.screen:not(.current)');
    if(sbAnim) sbAnim.cancel();
    if(e.pointerId) app.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  app.addEventListener('pointermove', e => {
    if(!sbDragging || !sbCurrentScreen) return;
    const dx = e.clientX - sbStartX;
    const dy = e.clientY - sbStartY;
    // Cancel if vertical scroll dominates
    if(Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 12){ sbDragging = false; return; }
    if(dx < 0){ sbDragging = false; return; }
    const pct = dx / window.innerWidth;
    sbCurrentScreen.style.transition = 'none';
    sbCurrentScreen.style.transform = `translateX(${dx}px)`;
    if(sbPrevScreen){
      sbPrevScreen.style.display = '';
      sbPrevScreen.style.visibility = '';
      sbPrevScreen.style.transition = 'none';
      sbPrevScreen.style.transform = `translateX(${(pct * 30 - 30)}%)`;
      sbPrevScreen.style.opacity = Math.max(0.4, 1 - pct * 0.6);
    }
  });

  app.addEventListener('pointerup', e => {
    if(!sbDragging || !sbCurrentScreen) return;
    sbDragging = false;
    const dx = e.clientX - sbStartX;
    const threshold = window.innerWidth * 0.28;
    const velocity = dx / (e.timeStamp - (sbStartTime || e.timeStamp - 100)) * 1000 || 0;
    const commit = dx > threshold || (dx > 60 && velocity > 400);

    if(commit){
      if(sbAnim) sbAnim.cancel();
      sbAnim = springAnimate({
        from: dx, to: window.innerWidth, velocity: velocity * 0.3,
        stiffness: 520, damping: 28,
        onUpdate: x => {
          sbCurrentScreen.style.transform = `translateX(${x}px)`;
          if(sbPrevScreen){
            const p = x / window.innerWidth;
            sbPrevScreen.style.transform = `translateX(${(p * 30 - 30)}%)`;
            sbPrevScreen.style.opacity = Math.max(0.4, 1 - p * 0.6);
          }
        },
        onComplete: () => {
          viewStack.pop();
          const prevState = viewStack[viewStack.length - 1];
          currentView = prevState.view;
          if(prevState.data !== undefined) currentRecipeId = prevState.data;
          sbCurrentScreen.remove();
          if(sbPrevScreen){
            sbPrevScreen.classList.add('current');
            sbPrevScreen.style.transform = ''; sbPrevScreen.style.opacity = '';
            currentScreen = sbPrevScreen;
          }
          sbCurrentScreen = null; sbPrevScreen = null;
        }
      });
    } else {
      if(sbAnim) sbAnim.cancel();
      sbAnim = springAnimate({
        from: dx, to: 0, velocity: 0,
        stiffness: 520, damping: 28,
        onUpdate: x => {
          sbCurrentScreen.style.transform = `translateX(${x}px)`;
          if(sbPrevScreen){
            const p = x / window.innerWidth;
            sbPrevScreen.style.transform = `translateX(${(p * 30 - 30)}%)`;
            sbPrevScreen.style.opacity = Math.max(0.4, 1 - p * 0.6);
          }
        },
        onComplete: () => {
          if(sbPrevScreen){ sbPrevScreen.style.display = 'none'; sbPrevScreen.style.visibility = 'hidden'; }
          sbCurrentScreen.style.transform = '';
          sbCurrentScreen = null; sbPrevScreen = null;
        }
      });
    }
  });
})();

function getCurrentScreen() {
  const screens = app.querySelectorAll('.screen');
  return screens[screens.length - 1] || app;
}

function navigate(view, data){
  haptic();
  if(data !== undefined) currentRecipeId = data;

  const prevScreen = getCurrentScreen();
  if (prevScreen && prevScreen !== app) {
    prevScreen.classList.remove('current');
  }

  const newScreen = document.createElement('div');
  newScreen.className = 'screen';
  newScreen.style.transform = 'translateX(100%)';
  app.appendChild(newScreen);
  currentScreen = newScreen;

  currentView = view;
  render();
  window.scrollTo(0,0);

  if(prevScreen && prevScreen !== app){
    if(screenAnim) screenAnim.cancel();
    screenAnim = springAnimate({
      from: 100, to: 0, velocity: 0,
      onUpdate: x => {
        newScreen.style.transform = `translateX(${x}%)`;
        prevScreen.style.transform = `translateX(${x * 0.3 - 30}%)`;
        prevScreen.style.opacity = Math.max(0.4, 1 - x/150);
      },
      onComplete: () => {
        prevScreen.style.display = 'none';
        prevScreen.style.visibility = 'hidden';
      }
    });
  } else {
    newScreen.style.transform = 'translateX(0)';
  }
  newScreen.classList.add('current');
  viewStack.push({view, data});

}

function goBack(){
  if(viewStack.length <= 1) return;
  haptic();
  viewStack.pop();
  const prevState = viewStack[viewStack.length - 1];
  currentView = prevState.view;
  if(prevState.data !== undefined) currentRecipeId = prevState.data;

  const screens = app.querySelectorAll('.screen');
  if (screens.length < 2) {
    currentScreen = app;
    render();
    return;
  }

  const curScreen = screens[screens.length - 1];
  const prevScreen = screens[screens.length - 2];

  prevScreen.style.display = '';
  prevScreen.style.visibility = '';
  prevScreen.classList.add('current');
  currentScreen = prevScreen;

  if(screenAnim) screenAnim.cancel();
  screenAnim = springAnimate({
    from: 0, to: 100, velocity: 0,
    onUpdate: x => {
      curScreen.style.transform = `translateX(${x}%)`;
      prevScreen.style.transform = `translateX(${x * 0.3 - 30}%)`;
      prevScreen.style.opacity = Math.max(0.4, 1 - x/150);
    },
    onComplete: () => {
      curScreen.remove();
      if (prevScreen) {
        prevScreen.style.transform = '';
        prevScreen.style.opacity = '';
      }
    }
  });
}

    isLoading = true;
    if (!force && scheduleData) {
        isLoading = false;
        return;
    }
    try {
        const response = await fetch(SHEET_URL + '&t=' + Date.now());
        if (!response.ok) throw new Error('Ошибка сети: ' + response.status);
        const text = await response.text();
        const parsed = parseComplexCSV(text);
        if (parsed && parsed.locations && parsed.locations.length > 0) {
            scheduleData = parsed;
            useLocalSchedule = false;
            if (!silent) toast('Данные обновлены', 'success');
        } else {
            throw new Error('Неверный формат данных');
        }
    } catch (e) {
        console.warn('Онлайн загрузка не удалась:', e);
        if (!scheduleData) {
            scheduleData = DEFAULT_LOCAL_DATA;
            useLocalSchedule = true;
        }
        if (!silent) toast('Нет связи с сервером. Показаны локальные данные.', 'error');
    } finally {
        isLoading = false;
    }
}

function parseComplexCSV(csvText) {
    const rows = csvText.split('\n').map(row => {
        const result = [];
        let cell = '';
        let inQuotes = false;
        for (let i = 0; i < row.length; i++) {
            const char = row[i];
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(cell.trim());
                cell = '';
            } else {
                cell += char;
            }
        }
        result.push(cell.trim());
        return result;
    }).filter(r => r.length > 2);

    if (rows.length < 5) return null;
    const locations = [];
    let currentLoc = null;
    
    for (let i = 0; i < rows.length; i++) {
        const row = rows[i];
        const firstCell = (row[0] || '').trim().toLowerCase();
        
        if (firstCell.includes('итого') || firstCell.includes('дата') || 
            firstCell.includes('локация') || firstCell === '' || 
            !isNaN(firstCell) || firstCell.includes('вск') || firstCell.includes('пн')) {
            continue;
        }

        const secondCell = (row[1] || '').trim();
        if (secondCell === 'Должность' || secondCell === '') {
             if (row[0] && row[0].trim() !== '' && !row[0].includes('итого')) {
                 currentLoc = { name: row[0].trim(), staff: [] };
                 locations.push(currentLoc);
             }
        } else if (currentLoc) {
            const name = row[0].trim();
            const role = secondCell;
            const shifts = [];
            for (let d = 2; d < Math.min(row.length - 2, 33); d++) {
                let val = row[d];
                if (val && val.includes(',')) val = val.replace(',', '.');
                let num = parseFloat(val);
                if (isNaN(num)) num = 0;
                shifts.push(num);
            }
            const total = shifts.reduce((a, b) => a + b, 0);
            currentLoc.staff.push({ name, role, shifts, total });
        }
    }
    if (locations.length === 0) return null;
    return { month: 'Август 2026', locations: locations };
}

window.changeWeek = function(offset) {
    if (!currentWeekStart) return;
    const newDate = new Date(currentWeekStart);
    newDate.setDate(currentWeekStart.getDate() + (offset * 7));
    if (newDate.getMonth() !== 7 && newDate.getMonth() !== 6 && newDate.getMonth() !== 8) {}
    currentWeekStart = newDate;
    selectedDayIndex = null;
    renderScheduleContent();
};

window.selectDay = function(dayIndex) {
    selectedDayIndex = dayIndex;
    renderScheduleContent();
};

window.goToToday = function() {
    const today = new Date();
    const dayOfWeek = today.getDay();
    const mondayOffset = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    currentWeekStart = new Date(today);
    currentWeekStart.setDate(today.getDate() + mondayOffset);
    selectedDayIndex = today.getDate() - 1;
    renderScheduleContent();
};

  saved.manager = name;
  localStorage.setItem(key, JSON.stringify(saved));
  haptic();

};

window.toggleCheckItem = function(loc, type, i){
  const today = new Date().toISOString().slice(0,10);
  const key = 'cl_'+today+'_'+loc;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  if(!saved[type]) saved[type] = [];
  
  const idx = saved[type].indexOf(i);
  if(idx>=0) saved[type].splice(idx,1); else saved[type].push(i);
  
  localStorage.setItem(key, JSON.stringify(saved));
  haptic();
  renderChecklist();
};

  const filteredSuppliers = MATRIX_DATA.map(sup => {
    const items = sup.items.filter(it => it.name.toLowerCase().includes(q));

  // Удаляем все старые модалки редактирования
  const oldEditModal = document.getElementById('edit-modal');
  if(oldEditModal) oldEditModal.remove();
  const oldSupplierModal = document.getElementById('edit-supplier-modal');
  if(oldSupplierModal) oldSupplierModal.remove();

  adminTab = localStorage.getItem('chef_admin_tab') || adminTab || 'recipes';

  // Создаём фон
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.id = 'admin-modal';

  // Создаём саму панель
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.id = 'admin-sheet';

  // Drag-область (невидимая, но ловит тап)
  const dragArea = document.createElement('div');
  dragArea.className = 'sheet-drag-area';

  // Содержимое
  sheet.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">⚙️ Редактор</div>
      <button class="sheet-close" onclick="event.stopPropagation();closeSheet()">✕</button>
    </div>
    <div style="display:flex;gap:4px;padding:0 20px 12px;flex-shrink:0">
      <button class="tab-btn ${adminTab==='recipes'?'on':''}" onclick="adminTab='recipes';localStorage.setItem('chef_admin_tab','recipes');Array.from(this.parentNode.children).forEach(b=>b.classList.remove('on'));this.classList.add('on');renderAdminContent()">ТТК</button>
      <button class="tab-btn ${adminTab==='news'?'on':''}" onclick="adminTab='news';localStorage.setItem('chef_admin_tab','news');Array.from(this.parentNode.children).forEach(b=>b.classList.remove('on'));this.classList.add('on');renderAdminContent()">Новости</button>
      <button class="tab-btn ${adminTab==='team'?'on':''}" onclick="adminTab='team';localStorage.setItem('chef_admin_tab','team');Array.from(this.parentNode.children).forEach(b=>b.classList.remove('on'));this.classList.add('on');renderAdminContent()">Команда</button>
      <button class="tab-btn ${adminTab==='matrix'?'on':''}" onclick="adminTab='matrix';localStorage.setItem('chef_admin_tab','matrix');Array.from(this.parentNode.children).forEach(b=>b.classList.remove('on'));this.classList.add('on');renderAdminContent()">Матрица</button>
    </div>
    <div id="admin-content" class="sheet-body"></div>
  `;

  sheet.insertBefore(dragArea, sheet.firstChild);
  bg.appendChild(sheet);
  document.body.appendChild(bg);

  // Показываем с анимацией (следующий кадр)
  requestAnimationFrame(() => {
    bg.classList.add('open');
    sheet.classList.add('open');
  });

  // === DRAG ЛОГИКА (Spring Physics) ===
  let sheetAnim = null;
  let sheetY = 0;
  let isDraggingSheet = false;
  let dragStartY = 0;
  let dragStartSheetY = 0;
  let dragHistory = [];

  function setSheetY(y) {
    sheetY = y;
    sheet.style.transform = `translateY(${y}px)`;
  }

  function snapSheet(target, velocity = 0) {
    if (sheetAnim) sheetAnim.cancel();
    sheetAnim = springAnimate({
      from: sheetY,
      to: target,
      velocity: velocity,
      stiffness: 380,
      damping: 32,
      onUpdate: y => setSheetY(y),
      onComplete: () => {
        if (target > 0) closeSheet();
      }
    });
  }

  function onPointerDown(e) {
    if (e.target.closest('button, input, textarea, select, .sheet-body')) return;
    isDraggingSheet = true;
    dragStartY = e.clientY;
    dragStartSheetY = sheetY;
    dragHistory = [];
    if (sheetAnim) sheetAnim.cancel();
    sheet.style.transition = 'none';
    if (e.pointerId) sheet.setPointerCapture(e.pointerId);
    e.preventDefault();
  }

  function onPointerMove(e) {
    if (!isDraggingSheet) return;
    const y = e.clientY;
    const delta = y - dragStartY;
    let targetY = dragStartSheetY + delta;

    // Rubber-banding: can't pull above 0
    if (targetY < 0) {
      targetY = -rubberband(-targetY, sheet.offsetHeight * 0.5);
    }

    // Track velocity history
    dragHistory.push({ y, t: performance.now() });
    if (dragHistory.length > 6) dragHistory.shift();

    setSheetY(targetY);
  }

  function onPointerUp(e) {
    if (!isDraggingSheet) return;
    isDraggingSheet = false;

    // Calculate release velocity from recent history
    const now = performance.now();
    const recent = dragHistory.filter(h => now - h.t < 80);
    let releaseVelocity = 0;
    if (recent.length >= 2) {
      const first = recent[0];
      const last = recent[recent.length - 1];
      const dt = last.t - first.t;
      if (dt > 0) releaseVelocity = (last.y - first.y) / dt * 1000;
    }

    // Momentum projection
    const projected = sheetY + project(releaseVelocity);
    const threshold = sheet.offsetHeight * 0.35;

    if (projected > threshold || (sheetY > threshold && releaseVelocity > 0)) {
      snapSheet(sheet.offsetHeight, releaseVelocity);
    } else {
      snapSheet(0, releaseVelocity);
    }
  }

  dragArea.addEventListener('pointerdown', onPointerDown);
  sheet.addEventListener('pointermove', onPointerMove);
  sheet.addEventListener('pointerup', onPointerUp);
  sheet.addEventListener('pointercancel', onPointerUp);

  // Клик по фону = закрыть
  bg.addEventListener('click', (e) => {
    if (e.target === bg) closeSheet();
  });

  renderAdminContent();}

// Функция закрытия
function closeSheet(){
  const bg = document.getElementById('admin-modal');
  const sheet = document.getElementById('admin-sheet');
  if(!bg) return;
  
  bg.classList.remove('open');
  if(sheet) sheet.classList.remove('open');
  
  // Ждём конца анимации и убираем из DOM
  setTimeout(() => {
    if(bg && bg.parentNode) bg.remove();
  }, 350);
}

window.saveSupplier = function(index) {
    const supplierName = $('#m-supplier').value;
    const schedule = $('#m-schedule').value;
    
    if(!supplierName) { toast('Введите название поставщика', 'error'); return; }
    
    const items = Array.from(document.querySelectorAll('[data-midx]')).reduce((acc, el) => {
        const idx = el.dataset.midx;
        const f = el.dataset.f;
        acc[idx] = acc[idx] || {};
        let val = el.value;
        if (f === 'limit') val = val === '' ? null : parseFloat(val);
        acc[idx][f] = val;
        return acc;
    }, []).filter(x => x.name && x.name.trim() !== '');
    
    const newSupplier = { supplier: supplierName, schedule: schedule, items: items };
    
    if (index !== null) {
        MATRIX_DATA[index] = newSupplier;
    } else {
        MATRIX_DATA.push(newSupplier);
    }
    
    saveData();
    syncToFirebase();
    document.getElementById('edit-supplier-modal').remove();
    toast('Сохранено', 'success');
    renderAdminContent();
};

window.deleteSupplier = function(index) {

    MATRIX_DATA.splice(index, 1);
    saveData();
    renderAdminContent();
    toast('Удалено', 'success');
};

window.saveRecipe = function(editId){
  const r = {
    id: editId || Date.now(),
    name: $('#r-name').value,
    cat: $('#r-cat').value,
    time: $('#r-time').value,
    yield: $('#r-yield').value,
    kcal: parseInt($('#r-kcal').value) || 0,
    note: $('#r-note').value,
    ingr: Array.from(document.querySelectorAll('[data-ing]')).reduce((acc, el)=>{
      const idx = el.dataset.ing;
      const f = el.dataset.f;
      acc[idx] = acc[idx] || [];
      const val = f==='name' ? el.value : parseFloat(el.value)||0;
      const pos = f==='name'?0:f==='brutto'?1:2;
      acc[idx][pos] = val;
      return acc;
    }, []).filter(x=>x && x[0]),
    steps: Array.from(document.querySelectorAll('[data-step]')).map(el=>el.value).filter(x=>x.trim())
  };
  if(!r.name){ toast('Введите название', 'error'); return; }
  if(editId){
    const idx = RECIPES.findIndex(x=>x.id===editId);
    RECIPES[idx] = r;
  } else {
    RECIPES.push(r);
  }
  saveData();
  syncToFirebase();
  document.getElementById('edit-modal').remove();
  haptic('hard');
  toast('Сохранено ✓', 'success');
  renderAdminContent();
};

window.deleteRecipe = function(id){
  if(!confirm('Удалить техкарту?')) return;
  const idx = RECIPES.findIndex(r=>r.id===id);
  if(idx>=0) RECIPES.splice(idx,1);
  saveData();
  syncToFirebase();
  renderAdminContent();
  toast('Удалено', 'success');
};

};

/* ============================================================
   🚀 СТАРТ
   ============================================================ */
// Сначала пробуем загрузить из Firebase, потом рендерим
// Tap on <h1> to scroll to top
document.addEventListener('click', e => {
  if(e.target.tagName === 'H1' || e.target.closest('h1')){
    const scroller = app.querySelector('.screen.current') || app;
    scroller.scrollTo({ top: 0, behavior: 'smooth' });
    haptic();
  }
});

(async function init(){
  const loaded = await loadFromFirebase();
  if(!loaded){
    // Если Firebase не настроен — используем локальные данные (уже загружены выше)
    console.log('📱 Работаем в offline-режиме');
  }
  render();
  startFirebaseSync();
})();
</script>
